  title: The Postage-Stamp Advantage
  color: purple
  items:
    - '<strong>Fits on a Postage Stamp:</strong> While C++ and C# continually bloat their grammars with 80+ keywords, Ruby''s core grammar famously fits on a postage stamp (~40 keywords).'
    - '<strong>Methods Over Keywords:</strong> Features like properties (<code>attr_accessor</code>), visibility (<code>private</code>), and mixins (<code>include</code>) are plain methods, not compiler grammar.'
    - '<strong>Blocks as Universal Primitives:</strong> A single, universal construct—the block (<code>do...end</code>)—powers iteration, resource safety (<code>File.open</code>), and rich DSLs.'
    - '<strong>Zero Syntax Bloat:</strong> Ecosystems like Rails, RSpec, and Sinatra look like dedicated domain languages, yet require zero new syntax rules in the compiler.'
    - '<strong>Elegance Through Restraint:</strong> Rather than accumulating specialized syntactic sugar, a compact set of orthogonal primitives yields maximum expressive freedom.'
notes: |
  In computer science lore, Alan Kay famously observed that Smalltalk was so elegant that its entire grammar could fit on a postcard. Matz brought this profound insight to Ruby: you do not need 80 or 100 keywords to build a powerful programming language.
  In fact, adding keywords often restricts what developers can do. In C#, Java, or C++, if you want properties, asynchronous tasks, or access control, the language committee must invent new keywords and syntax rules.
  In Ruby, properties like attr_accessor, access modifiers like private, testing constructs like describe/it, and web routes like get/post are simply ordinary methods combined with blocks!
  By keeping the core grammar down to a postage-stamp size of ~40 keywords, Ruby unlocked an unbounded universe of domain-specific languages: keeping the language tiny, clean, and elegant while empowering programmers to shape their own abstractions.
