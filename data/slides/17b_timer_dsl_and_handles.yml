crystal:
  title: ':sparkles: Crystal: Scoped Timers & Cancellable Handles'
  lang: crystal
  tag: Crystal (Lapis)
  font_size: '0.80rem'
  code: |
    def setup_gameplay_timers : Void
      # 1. Non-blocking recurring timer with TimerHandle
      handle = every(1.second) do |h|
        pulse_fx
        h.cancel if game_over?
      end

      # 2. Node-scoped delay: auto-cancels if node is destroyed!
      node.after(500.milliseconds) do
        play_sfx # Guarded: won't run on dead pointer
      end

      # 3. Full lifecycle control: pause, resume, reset
      handle.pause
      handle.resume

      # 4. Deterministic headless testing: step time forward!
      handle.advance(1.0) # Instant tick in tests without sleep!
    end
  points:
  - <strong>Non-Blocking DSL:</strong> <code>every(1.second)</code> and <code>after(500.ms)</code> run cooperatively on Crystal fibers without thread stalls.
  - <strong>Node Lifecycle Scoped:</strong> <code>node.every</code> and <code>node.after</code> validate <code>#alive?</code> on each tick, auto-aborting if the node is freed.
  - <strong>First-Class TimerHandle:</strong> Full control with <code>cancel</code>, <code>stop</code>, <code>pause</code>, <code>resume</code>, and <code>reset</code>.
  - <strong>Deterministic Unit Testing:</strong> <code>handle.advance(delta)</code> steps elapsed time forward instantly in headless specs with zero sleep delays.
takeaway:
