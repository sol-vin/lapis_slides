title: 'Signals & Async: String Awaits vs. Typed Handles'
subtitle: Non-Blocking Coroutines, Timeout Guards & Dead-Pointer Checks
badge: GDSCRIPT ANTI-PATTERN VS. CRYSTAL CLEAN SOLUTION
badge_color: amber
palette: oled_micro
layout: code-comparison-layout
gdscript:
  title: ':circle-xmark: GDScript: Unsafe Await & Leaked Coroutines'
  lang: gdscript
  tag: GDScript
  code: |
    func start_boss_cinematic() -> void:
        # Pitfall 1: Target freed -> coroutine hangs FOREVER!
        # If boss is despawned or scene reloaded, this line NEVER resumes:
        await boss.died 
        show_victory_screen()

        # Pitfall 2: No timeouts -> must build manual Timer nodes:
        var timer = get_tree().create_timer(10.0)
        # Racing timer vs signal requires convoluted boolean flag gymnastics!

        # Pitfall 3: String typo in connection crashes at runtime:
        $StartButton.pressed.connect(_on_strt_pressed)
  points:
  - <strong>Infinite Hang Risk:</strong> <code>await boss.died</code> hangs indefinitely if the target node is freed before emitting.
  - <strong>No Built-In Timeouts:</strong> Adding timeouts requires manual timer nodes and complex cleanup logic.
  - <strong>Boilerplate Handlers:</strong> Connecting signals requires authoring separate named handler functions.
crystal:
  title: ':sparkles: Crystal: First-Class Signal Handles & Timeouts'
  lang: crystal
  tag: Crystal (Lapis)
  code: |
    def start_boss_cinematic : Void
      # 1. Bang variant: unwraps or raises TimeoutError
      await!(boss.died, timeout_sec: 10.0)

      # 2. Nilable variant: returns value on emit, nil on timeout
      if loot = await?(boss.dropped_loot, timeout_sec: 2.0)
        collect_reward(loot)
      end

      # 3. Dead-pointer safe: raises Godot::DisposedObjectError
      # if node is freed mid-wait; zero zombie coroutines!
      show_victory_screen
    end
  points:
  - <strong>Await Triad (<code>await</code>, <code>await?</code>, <code>await!</code>):</strong> Inspect <code>AwaitStatus</code>, unwrap safely with <code>await?</code>, or enforce with <code>await!</code>.
  - <strong>Dead-Pointer Armor:</strong> Node destruction while waiting raises <code>Godot::DisposedObjectError</code> instead of hanging indefinitely.
  - <strong>Built-In Timeout Guards:</strong> Optional <code>timeout_sec: 10.0</code> prevents coroutines from leaking or stalling state machines.
takeaway:
  badge: SAFE ASYNCHRONY
  text: Lapis signal awaiting provides await, await?, and await! with automatic timeouts and DisposedObjectError dead-pointer guards.
notes: |
  Asynchronous game logic in GDScript relies on await, but await has major pitfalls: if the target object is freed or the signal is never fired, the coroutine is suspended forever, leaking memory and leaving game states stuck. In Lapis, await supports three ergonomic flavors: 'await' returning AwaitStatus, 'await!' asserting completion or raising TimeoutError, and 'await?' returning nil/false on timeout. Furthermore, if a target node is destroyed while awaiting, Lapis immediately raises Godot::DisposedObjectError rather than hanging silently.
