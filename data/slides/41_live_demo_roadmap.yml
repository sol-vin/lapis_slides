badge_color: cyan
palette: spaces_10
layout: demo-roadmap-layout
steps:
  - phase: 'STEP 1 • 00:00'
    title: 'Scaffold & Doctor'
    color: cyan
    cmd: |
      $ lapis init live_game
      $ cd live_game && lapis doctor
    items:
      - Scaffolds <code>shard.yml</code>, manifests, & scenes
      - Verifies Crystal, Godot, & radare2 toolchain
      - Scaffolds self-hosted Crystal editor plugin
      - Compiles C++ GDExtension bridge DLL
    highlight: '⚡ Turnkey Zero-Config Init'

  - phase: 'STEP 2 • 02:00'
    title: 'Author Player Node'
    color: purple
    code: |
      node Player < CharacterBody3D do
        @[Export]
        property speed : Float32 = 8.0_f32

        signal coin_collected(n : Int32)

        def _physics_process(delta : Float64) : Void
          self.velocity = Godot::Vector3.new(0, 0, -speed)
          move_and_slide
        end
      end
    lang: crystal
    items:
      - Zen ergonomics with <code>node</code> DSL
      - Automatic <code>ClassDB</code> registration
      - <code>@[Export]</code> sliders in Godot Inspector
      - Type-safe engine signals & async await
    highlight: '💎 Pure Ruby-Like Elegance'

  - phase: 'STEP 3 • 05:00'
    title: 'F5 Shadow Hot-Reload'
    color: green
    cmd: |
      $ lapis editor
      # Press F5 in Godot:
      # Compiles -> bin/game.dll
      # Loads -> shadow DLL copy
    items:
      - Self-hosted plugin handles build hook
      - Timestamped shadow copy avoids file locks
      - Hot reloads code without restarting Godot
      - Live Inspector value tweaking during play
    highlight: '🔄 Sub-Second In-Editor Loop'

  - phase: 'STEP 4 • 08:00'
    title: 'Quality Gate & r2 Debug'
    color: amber
    cmd: |
      $ lapis test --tui
      # ✔ Zero Leaks: ΔObjects = 0
      $ lapis debug
      # radare2: dc, pdf, rw 0x7ffd...
    items:
      - Double-buffered ANSI TUI test dashboard
      - Headless in-editor <code>@tool</code> tests
      - Mathematical zero-leak verification
      - Disassemble & inspect native registers
    highlight: '🛡️ Mathematical Stability'
summary: '🎯 <strong>Live Demo Mission:</strong> From an empty directory to a playable 3D Godot game with hot reloading, visual inspector controls, and zero-leak test suites in under 10 minutes.'
notes: |
  Now let's switch over to our live demonstration.
  In Step 1, we start from a clean terminal, running lapis init to scaffold our project and lapis doctor to verify all toolchain dependencies.
  In Step 2, we author a Player node in Crystal using our concise DSL, declaring an exported speed property, an engine signal, and 3D physics movement.
  In Step 3, we open Godot. Our self-hosted Crystal editor plugin hooks into F5. We press F5, and thanks to Windows shadow DLL loading, the game recompiles and hot reloads in milliseconds while we tweak the speed slider in the Inspector.
  Finally in Step 4, we run lapis test --tui to watch our automated specs and zero memory leak verification execute live, followed by launching radare2 to demonstrate native debugging and hardware watchpoints.
