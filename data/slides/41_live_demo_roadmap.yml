id: 41_live_demo_roadmap
title: 'Live DEMO: End-to-End Workflow Roadmap'
subtitle: Hands-On Journey from Zero-Config Scaffolding to Addon Integration, Shader FX & Release Packaging
badge: LIVE DEMONSTRATION • ROADMAP
badge_color: cyan
palette: spaces_10
layout: demo-roadmap-layout
steps:
  - phase: 'STEP 1 • 00:00'
    title: 'Scaffold & Hot-Reload'
    color: cyan
    cmd: |
      $ lapis init dungeon_crawl
      $ lapis editor
      # Press F5 in Godot:
      # Shadow reload in 0.4s!
    items:
      - Zero-config project bootstrapping
      - Manifests, bridge DLL & default scenes
      - Windows timestamped shadow loading
      - Instant F5 loop without restarting
    highlight: '⚡ Turnkey Zero-Lock Init'

  - phase: 'STEP 2 • 02:00'
    title: 'Gameplay & Traits'
    color: purple
    code: |
      node Player < CharacterBody3D do
        include Damageable
        @[Export]
        property speed : Float32 = 8.0_f32
        signal coin_collected(n : Int32)
      end
    lang: crystal
    items:
      - Elegant Ruby-like <code>node</code> DSL
      - Modular <code>gmodule Damageable</code> mixin
      - Live Inspector sliders & UI hints
      - Type-safe engine signals & await
    highlight: '💎 Pure Declarative Zen'

  - phase: 'STEP 3 • 04:30'
    title: 'Install CrShader Addon'
    color: green
    cmd: |
      $ lapis install addon \
        github:sol-vin/crshader \
        --shard --bind
    items:
      - Fetches & stages GDExtension plugin
      - Auto-enables plugin in <code>project.godot</code>
      - Links <code>shard.yml</code> Crystal dependency
      - Generates typed bindings in <code>src/bindings/</code>
    highlight: '📦 One-Command Ecosystem'

  - phase: 'STEP 4 • 07:00'
    title: 'Live Shaders & FX'
    color: magenta
    code: |
      onready mat = CrShader.material do |m|
        m.shader = "res://.../plasma.gdshader"
        m.set_uniform("tint", shield_color)
      end
      # Direct GPU uniform sync in _process!
    lang: crystal
    items:
      - Procedural shader material synthesis
      - Direct Crystal-to-GPU uniform sync
      - Live shield distortion & pulse effects
      - Real-time in-editor <code>@[Tool]</code> feedback
    highlight: '🎨 Procedural GPU Power'

  - phase: 'STEP 5 • 09:30'
    title: 'Compile & Package'
    color: amber
    cmd: |
      $ lapis build --release -O3
      $ lapis package game -r \
        -n DungeonCrawl
      # -> dist/DungeonCrawl-win-x64.zip
    items:
      - LLVM link-time optimization & symbol strip
      - Bundles PCK, runtime DLLs & all addons
      - Standalone zero-dependency executable
      - Generates cryptographic SHA256 checksums
    highlight: '🚀 Ship-Ready Distribution'
summary: '🎯 <strong>Live Demo Mission:</strong> From an empty directory to a feature-rich, shader-powered 3D Godot game with hot reloading, ecosystem addons, and a standalone release package in under 12 minutes.'
notes: |
  Welcome to our comprehensive live demonstration.
  We will take you on a complete hands-on journey from a blank terminal all the way to a finished, packaged game:
  In Step 1, we scaffold a brand new project and demonstrate Windows shadow DLL hot-reloading on F5 without ever locking binaries.
  In Step 2, we author gameplay with our declarative node DSL, mixing in reusable gmodule traits and reactive Inspector sliders.
  In Step 3, we demonstrate the Lapis addon ecosystem by installing the CrShader visual effects plugin with a single command—automatically wiring GDExtension manifests, enabling the plugin in project.godot, and generating typed Crystal bindings.
  In Step 4, we put CrShader to work: synthesizing a procedural plasma shield material and streaming Crystal gameplay data directly into GPU shader uniforms every frame.
  And in Step 5, we run an optimized release build and package the complete standalone playable game into a self-contained release archive ready to ship to Steam or itch.io!
