side_cards:
- title: 'The Lifeline: Dead-Pointer Protection'
  badge: MEMORY SAFETY
  color: cyan
  items:
  - "<strong>The Segfault Hazard:</strong> <code>queue_free()</code> frees native C++ memory; standard bindings dereference dead pointers, crashing with unrecoverable <code>0xC0000005</code>."
  - "<strong>Monotonic ObjectDB IDs:</strong> <code>#check_alive!</code> verifies the 64-bit ID before every dispatch, raising <code>DisposedObjectError</code> instead of segfaulting."
- title: Windows Shadow DLL Hot-Reload
  badge: DEVELOPER EXPERIENCE
  color: blue
  items:
  - "<strong>File Locking Problem:</strong> Windows locks loaded DLLs on disk, preventing compiler writes."
  - "<strong>Shadow Copy Engine:</strong> Bridge creates timestamped copies named <code>game_loaded_&lt;PID&gt;.dll</code>, leaving <code>game.dll</code> unlocked for instant F5 rebuilds."
notes: |
  Here is the complete architectural stack of Lapis. At the bottom is Godot's native C++ engine core. Above it sits our C++ loader bridge, which initializes the Boehm GC and manages shadow DLL loading on Windows. Layer 3 provides 800+ typed Crystal classes. Layer 4 adds Lapis engine extensions like dead-pointer protection and actor channels. And Layer 5 is where you write your gameplay code using our clean node DSL.
