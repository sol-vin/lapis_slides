    public partial class CombatHUD : Control
    {
        [Export] public PlayerController Player { get; set; } = null!;
        private AudioStreamPlayer _healSFX = null!;

        public override void _Ready()
        {
            _healSFX = GetNode<AudioStreamPlayer>("Audio/HealSFX");

            // += creates strong GC root holding CombatHUD alive in CLR heap:
            Player.HealthChanged += OnHealthChanged;
            Player.Died += OnPlayerDied;
        }

        private void OnHealthChanged(int cur, int max)
        {
            // GHOST CALLBACK: Fires on dead HUD if QueueFree'd without -= unhook!
            // Player != null is true (wrapper alive), but C++ peer may be freed!
            if (Player != null)
                _healSFX.Play(); // Throws ObjectDisposedException
        }

        private void OnPlayerDied() => QueueFree();

        public override void _ExitTree()
        {
            // FRAGILE: Must remember every -= or leak memory forever!
            // If Player died first, Player.HealthChanged crashes unless guarded:
            if (GodotObject.IsInstanceValid(Player))
            {
                Player.HealthChanged -= OnHealthChanged;
                Player.Died -= OnPlayerDied;
            }
        }
    }
  points:
  - <strong>Null-Forgiving Annotation Lie (<code>!</code>):</strong> C#'s nullable reference types are mere compiler suggestions; developers use <code>null!</code> to silence warnings, inviting runtime <code>NullReferenceException</code>.
  - <strong>Ghost Delegate Memory Leaks (<code>+=</code>):</strong> C# <code>+=</code> subscriptions create strong GC roots holding subscriber nodes in memory. If a node is freed without manual <code>-=</code> unhooking, it stays alive in RAM firing ghost callbacks.
  - <strong>Tombstone Pointer Trap:</strong> <code>Player != null</code> only checks the managed CLR wrapper. If the native C++ node was freed, invoking methods throws <code>ObjectDisposedException</code> or causes segfaults.
  - <strong>Fragile Teardown Boilerplate:</strong> Requiring explicit <code>-=</code> in <code>_ExitTree</code> guarded by <code>GodotObject.IsInstanceValid</code> turns simple UI and gameplay components into error-prone leak hazards.
