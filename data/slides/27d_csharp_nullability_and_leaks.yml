    public partial class CombatHUD : Control
    {
        [Export] public PlayerController? Player { get; set; }
        private AudioStreamPlayer? _healSFX;

        public override void _Ready()
        {
            _healSFX = GetNodeOrNull<AudioStreamPlayer>("Audio/HealSFX");

            // += binds strong managed delegate; prevents CLR GC of this HUD:
            if (Player != null)
                Player.HealthChanged += OnHealthChanged;
        }

        private void OnHealthChanged(int cur, int max)
        {
            // THE ?. TRAP: C# ?. bypasses custom operator == at bytecode level!
            // CLR wrapper is not null, but C++ node was freed -> RUNTIME CRASH:
            _healSFX?.Play(); // Throws System.ObjectDisposedException!

            // Must use verbose engine checks everywhere instead of idiomatic ?.:
            if (GodotObject.IsInstanceValid(_healSFX))
                _healSFX.Play();
        }

        public override void _ExitTree()
        {
            // FRAGILE: Must manually -= or HUD leaks forever in CLR heap.
            // If Player was already freed, Player.HealthChanged crashes unless guarded:
            if (GodotObject.IsInstanceValid(Player))
                Player.HealthChanged -= OnHealthChanged;
        }
    }
  points:
    - '<strong>The <code>?.</code> Bytecode Trap:</strong> C# <code>?.</code> and <code>??</code> operators compile to IL <code>ldnull</code>, bypassing Godot’s overloaded <code>operator ==</code>. Calling <code>node?.Play()</code> on a freed node evaluates to true and throws <code>ObjectDisposedException</code>.'
    - '<strong>Mandatory <code>IsInstanceValid()</code> Boilerplate:</strong> Because idiomatic C# null-conditional operators are unsafe with engine peers, developers must litter code with <code>GodotObject.IsInstanceValid(node)</code> guards.'
    - '<strong>Managed Delegate GC Leaks (<code>+=</code>):</strong> C# <code>+=</code> events create strong managed references. If a UI or enemy node is removed from the scene tree without manual <code>-=</code>, the CLR keeps it alive in RAM forever.'
    - '<strong>Fragile Teardown in <code>_ExitTree</code>:</strong> Unsubscribing in <code>_ExitTree</code> is required but hazardous: if the emitter died first, unhooking throws an exception unless defensive <code>IsInstanceValid</code> guards are written.'
