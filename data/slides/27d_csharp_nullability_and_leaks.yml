notes: |
  In Godot C#, null safety and event lifecycles are full of minefields. First, C#'s nullable reference types are merely compiler warnings that developers routinely bypass with `null!`, leading to unexpected NullReferenceExceptions at runtime.
  Second, C# event subscriptions via `+=` create strong GC roots on the subscriber: `Player.HealthChanged += OnHealthChanged` prevents the CLR garbage collector from freeing CombatHUD even after Godot frees it from the scene tree. This causes "ghost leaks"—the freed HUD continues to live in memory and execute callbacks on dead nodes!
  Third, checking `Player != null` only checks whether the managed wrapper object exists. If the underlying native C++ node was deleted, dereferencing it throws `ObjectDisposedException`. To clean up, developers must write fragile `_ExitTree()` boilerplate guarded by `GodotObject.IsInstanceValid(Player)` before calling `-=`. If you miss one `-=`, your node leaks forever.
  In Lapis, Crystal's flow-sensitive type system enforces true compile-time nil safety without fake `!` escapes. You get familiar `+=` and `-=` operator syntax for signals, but subscriptions bind through Godot's 64-bit ObjectDB IDs rather than strong GC roots. If either node is destroyed, Lapis automatically self-prunes dead subscriptions—giving you zero ghost leaks, zero delegate boilerplate, and bulletproof lifecycle hygiene.
