  title: ':circle-xmark: Godot C#: Null Exceptions & Leaking Delegates'
  lang: csharp
  tag: C# (.NET 8)
  card_title: C# Null Reference & Leak Hazards
  code: |
    public partial class CombatHUD : Control
    {
        // Bypassed compiler null check with '!'
        [Export] public PlayerController Player { get; set; } = null!;

        public override void _Ready()
        {
            // Strong delegate reference: leaks HUD if not manually unsubscribed
            Player.HealthChanged += OnHealthChanged;
        }

        private void OnHealthChanged(int current, int max)
        {
            // Deceptive check: Player != null is true even after QueueFree()
            if (Player != null)
                GetNode<AudioStreamPlayer>("Audio/HealSFX").Play();
        }

        public override void _ExitTree()
        {
            // Boilerplate required to prevent ghost leaks
            if (GodotObject.IsInstanceValid(Player))
                Player.HealthChanged -= OnHealthChanged;
        }
    }
  points:
  - <strong>Null-Forgiving Abuse (<code>!</code>):</strong> C#'s nullable reference types are mere compiler annotations; developers routinely use <code>null!</code> to silence warnings, inviting runtime <code>NullReferenceException</code>.
  - <strong>Ghost Delegate Memory Leaks:</strong> <code>+=</code> event subscriptions create strong GC roots. If a node is freed without manual <code>-=</code> unhooking in <code>_ExitTree</code>, the dead instance stays alive in RAM, firing phantom callbacks.
  - <strong>Tombstone Pointer Trap:</strong> Checking <code>Player != null</code> only checks the managed CLR wrapper. If the native C++ node was freed, dereferencing it throws <code>ObjectDisposedException</code> or causes segfaults.
  - <strong>Manual Cleanup Boilerplate:</strong> Requiring explicit unhooking in <code>_ExitTree</code> turns simple UI and gameplay components into fragile, leak-prone maintenance burdens.
