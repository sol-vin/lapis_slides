  code: "# Declare states and transitions with an expressive macro DSL\r\nfsm BossState
    do\r\n  state Patrol, initial: true do\r\n    on :see_player, transition_to: Chase\r\n
    \   after 5.seconds, transition_to: ScanArea\r\n  end\r\n\n  state Chase do\r\n
    \   on :in_attack_range, transition_to: Attack\r\n    on :lost_player, transition_to:
    Patrol\r\n  end\r\n\n  state Attack do\r\n    on :attack_finished, transition_to:
