left:
  type: code
  title: enemy_fsm.cr — Declarative State Machine DSL
  tag: Crystal
  lang: crystal
  code: |
    # Declare states and transitions with an expressive macro DSL
    fsm BossState do
      state Patrol, initial: true do
        on :see_player, transition_to: Chase
        after 5.seconds, transition_to: ScanArea
      end

      state Chase do
        on :in_attack_range, transition_to: Attack
        on :lost_player, transition_to: Patrol
      end

      state Attack do
        on :attack_finished, transition_to: Recover
      end

      state Recover do
        after 1.5.seconds, transition_to: Chase
      end
    end
right:
  type: card
  title: What the Macro Generates
  color: purple
  items:
  - <strong>Typed Enum & Handlers:</strong> Generates concrete <code>enum BossState</code>
    with type-checked transition methods.
  - <strong>Compile-Time Transition Validation:</strong> Referencing an undeclared
    state or illegal transition fails at compile time.
  - <strong>Zero Reflection Overhead:</strong> Transitions compile to direct jump
    tables; no dictionary lookups or string comparisons.
  - <strong>Automatic Frame Timers:</strong> <code>after 5.seconds</code> hooks into
    Godot's frame delta without manual timer node instantiations.
notes: State machines are ubiquitous in gameplay engineering, but they often devolve
  into massive switch statements or complex class hierarchies. With Crystal's AST
  macros, we can write a clean, declarative state machine DSL that reads like a specification
  document. Under the hood, the macro generates strongly-typed transition methods,
  validates that all transitions are valid at compile time, and compiles down to direct
  jump tables with zero reflection overhead.
