    - '<strong>Step 1 — Header-Only C Binding:</strong> Found <strong>PureDOOM</strong> (a single-header C port of LinuxDoom) and bound it to Crystal alongside <code>raylib-cr</code> and <code>libADLMIDI</code> to get DOOM playable immediately.'
