  items:
    - '<strong>Declarative <code>onready</code> Macro:</strong> <code>onready camera, Camera2D, "path"</code> lazily caches, types, and validates child nodes during <code>_ready</code> with zero boilerplate.'
    - '<strong>Path Traversal with <code>/</code> &amp; <code>.as(T)</code>:</strong> Traverse hierarchies with strings or classes; pair with <code>.as(Camera2D)</code> for instant, explicit compile-time typing.'
    - '<strong>Scene Unique Nodes with <code>%</code> &amp; <code>.as(T)</code>:</strong> GDScript <code>%Node</code> parity! Query unique nodes with <code>self % ProgressBar</code> or <code>(self % "HUD").as(CanvasLayer)</code>.'
    - '<strong>Typed Indexers (<code>self["path", T]</code>):</strong> Reads naturally as path first, then type: <code>self["WeaponMount", Marker2D]</code> (or safe <code>[]?</code> returning <code>T?</code>).'
    - '<strong>Full <code>$</code> &amp; <code>%</code> Subscript Support:</strong> <code>self["$Weapons/Blaster", Node3D]</code> and <code>self["%UniqueNode", UniqueNode]</code> handle <code>$</code> and <code>%</code> prefixes natively.'
notes: |
  One of the biggest pain points in Godot bindings is retrieving nodes: in GDScript you use @onready or $Node / %UniqueNode, but in standard GDExtension you are stuck writing verbose, untyped get_node calls followed by unsafe manual casting. Lapis completely revolutionizes this with first-class operator ergonomics.
  Our onready macro provides 100% parity with GDScript's @onready, lazily caching and dead-pointer validating nodes with concrete types. The slash operator (/) accepts Strings and Class types, working seamlessly with Crystal's native .as(Class). The percent operator (%) provides 1:1 parity with GDScript's scene-unique nodes.
  Furthermore, our typed subscript indexers—self[] and self[]?—use the intuitive path-first signature: self["NodePath", SomeClass], returning a strongly-typed instance with zero casting boilerplate.
