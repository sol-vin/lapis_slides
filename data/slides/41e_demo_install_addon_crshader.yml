notes: |
  In Part 2 of our demo, we demonstrate the power of the Lapis ecosystem. Installing third-party GDExtension plugins in traditional Godot setups involves downloading zips, manually placing files into addons/, editing project.godot, and configuring build scripts.
  With Lapis, it's a single turnkey command: `lapis install addon github:sol-vin/diorite`.
  Lapis downloads the release binary, unpacks the GDExtension manifest into `addons/diorite/`, enables the plugin in project.godot, injects the dependency into shard.yml, and automatically generates typed Crystal wrapper classes in src/bindings/.
  In seconds, our project has access to Diorite with full compiler type checking and autocomplete.
