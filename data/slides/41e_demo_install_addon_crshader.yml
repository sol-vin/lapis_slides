    - '<strong>Zero-Friction GDExtension Wiring:</strong> <code>lapis install addon</code> fetches release archives, extracts assets, and validates extension manifests automatically.'
    - '<strong>Headless project.godot Configuration:</strong> Enables the plugin in <code>project.godot</code> programmatically—no clicking through editor menus required.'
