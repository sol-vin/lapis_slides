    - '<strong>Zero-Config Root Mounting:</strong> <code>@[Autoload]</code> attaches instances directly to <code>/root/GameManager</code> with zero <code>project.godot</code> edits.'
    - '<strong>Engine Singleton Registration:</strong> Registers in <code>Godot.engine</code>, giving GDScript access via <code>Engine.get_singleton</code>.'
