    end
right:
  type: card
  title: Autoload Singleton Invariants & Comparison
  color: cyan
  items:
    - '<strong>GDScript Anti-Pattern:</strong> Requires manually editing <code>project.godot</code> under <code>[autoload]</code>, relying on untyped global identifiers or string paths (<code>get_node("/root/GameManager")</code>).'
    - '<strong>C# / Native Boilerplate:</strong> Demands verbose <code>GetNode&lt;GameManager&gt;("/root/GameManager")</code> casting, manual static instance caching, and brittle DLL unload cleanup.'
    - '<strong>Zero-Config Root Mounting:</strong> <code>Godot::AutoloadManager</code> automatically attaches instances to <code>/root/&lt;Name&gt;</code>, participating in <code>_process</code>, physics, and input loops.'
    - '<strong>Engine Singleton Registration:</strong> Registers with <code>Godot.engine.register_singleton</code> by default, giving GDScript instant access via <code>Engine.get_singleton("GameManager")</code>.'
    - '<strong>Type-Safe Class Accessors:</strong> Synthesizes strict <code>.instance</code> (raises if unmounted) and safe <code>.instance?</code> accessors with zero dictionary lookup overhead.'
    - '<strong>Transactional Hot-Reload Safety:</strong> Automatically unparents nodes and unregisters singletons during live reloads, eliminating dangling pointers and Windows DLL lockouts.'
notes: |
  In standard Godot development, configuring singletons is notoriously fragmented. In GDScript, you have to open Project Settings, register an autoload script in project.godot, and access it as a dynamic global without compile-time type safety. In Godot C# or C++, you have to manually traverse the scene tree with GetNode("/root/..."), maintain your own static instance pointers, and write defensive teardown code so engine reloads don't crash.
  Lapis unifies this entire workflow with a single declarative annotation: @[Autoload].
  When your GDExtension loads, AutoloadManager instantiates the node, mounts it directly to the SceneTree root (/root/GameManager), and registers it with Godot's native Engine singleton registry. You get compile-time typed access via GameManager.instance, full interoperability so GDScript can query Engine.get_singleton, and guaranteed clean teardown during live hot reloads with zero dangling pointers.
