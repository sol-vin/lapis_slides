  title: Ergonomic Language Design
  color: cyan
  items:
  - <strong>Inlined Closures:</strong> Crystal's compiler inlines block iterators
    (<code>.each</code>, <code>.select</code>, <code>.map</code>) into raw flat loops
    with zero allocation tax.
  - <strong>Block Shorthand <code>&.method</code>:</strong> Write <code>enemies.select(&.alive?)</code>
    instead of verbose anonymous functions.
  - <strong>Exhaustive Pattern Matching:</strong> <code>case / when</code> inspects
    types and states; compiler verifies all branches are handled.
  - <strong>Zero-Cost Value Types:</strong> Structs, enums, and tuples live on the
    stack without heap allocation or GC pressure.
  - <strong>Local Type Inference:</strong> Write <code>speed = 10.0_f32</code> without
    typing redundant declarations everywhere.
notes: Crystal's expressive ergonomics make writing complex game logic an effortless
  experience. Blocks and closures like .select and .sort_by! read cleanly like high-level
  scripting languages, but Crystal's LLVM compiler inlines them into direct, flat
  machine loops with zero heap allocations. Pattern matching with case / when lets
  you model game state transitions cleanly and exhaustively. You get high-level algorithmic
  expressiveness combined with bare-metal C execution efficiency.
