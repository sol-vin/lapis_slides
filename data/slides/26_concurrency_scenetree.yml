  code: |
    # Thread-safe mutation via call_deferred
    def offload_pathfinding(start : Godot::Vector3, target : Godot::Vector3)
      Thread.new do
        path = compute_astar_path(start, target)

        # Buffers dispatch into Godot's thread-safe MessageQueue
        call_deferred("apply_nav_path", path)
      end
    end

    def apply_nav_path(path : Array(Godot::Vector3)) : Void
      # Executes safely on main loop thread
      @nav_agent.set_target_position(path.last)
    end
right:
  type: card
  title: Core Safety Invariants
  color: cyan
  items:
  - <strong>Engine MessageQueue:</strong> <code>call_deferred</code> pushes dispatches
    into Godot's thread-safe message queue.
  - <strong>Predictable Execution:</strong> Deferred calls are processed at frame
    boundaries on the main thread.
  - <strong>Protects Internal Child Arrays:</strong> Guarantees Godot's native tree
    state remains strictly single-threaded.
  - <strong>Dead-Pointer Protection:</strong> Validates target node validity before
    executing deferred dispatches.
notes: Godot's MessageQueue is the bedrock of cross-thread safety. In Lapis, call_deferred
  allows any background worker thread to schedule method executions on the main thread
  safely. This prevents race conditions in Godot's internal node arrays and ensures
  that game state transitions happen deterministically at frame boundaries.
