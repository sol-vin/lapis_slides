  items:
    - '<strong>The Outsider''s Discomfort:</strong> Mainstream languages enforce prefix order: <code>if (cond) { action(); }</code>. Seeing the condition at the end feels inverted and backward to prefix-trained brains.'
    - '<strong>Human Conversational Alignment:</strong> In real life, humans say: <em>"Take an umbrella if it rains"</em>, not <em>"If it rains, take an umbrella"</em>. The primary action is what matters most to the reader.'
    - '<strong>Flattening Indentation (Zero Pyramid of Doom):</strong> Preconditions and guard clauses are dispatched in clean, single lines without wrapping code in 3 or 4 levels of nested if-blocks.'
    - '<strong>Secondary Guards Tucked Out of Sight:</strong> By placing <code>if low_health?</code> at the tail, code reads as a clean list of actions with guardrails neatly aligned on the right.'
