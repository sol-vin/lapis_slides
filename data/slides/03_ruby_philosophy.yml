  code: |
    # Ruby's human-centric syntax: blocks, closures, and clean reads
    class Player
      attr_accessor :health, :inventory

      def initialize(health = 100)
        @health = health
        @inventory = []
      end

      # Idiomatic iteration with blocks: natural English read
      def heal_all_companions(party, amount)
        party.select(&:alive?).each do |companion|
          companion.health += amount
          puts "Healed #{companion.name} to #{companion.health} HP"
        end
      end
    end
right:
  type: card
  title: Why Ruby Won Developer Hearts
  color: purple
  items:
  - <strong>Developer Happiness as Primary Goal:</strong> Yukihiro 'Matz' Matsumoto
    designed Ruby to prioritize human cognitive comfort over machine convenience.
  - <strong>Small Syntax, Massive Reach:</strong> A minimal grammatical surface area
    that bends to almost any domain—turning simple method calls and blocks into DSLs without language bloat.
  - <strong>First-Class Blocks & Closures:</strong> Passing blocks to methods transformed
    data manipulation into an expressive, natural language flow.
  - <strong>Principle of Least Surprise (POLS):</strong> The language behaved consistently
    and intuitively, minimizing cognitive friction.
  - <strong>The Downside in Game Tech:</strong> Dynamic method dispatch (YARV byte
    interpreter) was too slow for 60/120 FPS physics, frame budgets, and tight loops.
notes: |
  To understand why Crystal exists and why Lapis is designed the way it is, we have to look back at the Ruby era. In the early 2000s, Ruby took the software world by storm because it prioritized human developer ergonomics. Yukihiro Matsumoto explicitly designed Ruby for human happiness, introducing first-class blocks, elegant closures, and a syntax that reads like natural English.
  Crucially, Ruby proved that a programming language doesn't need hundreds of complex grammar rules to be extraordinarily expressive: a remarkably small, orthogonal syntax can provide an almost infinite variety of usages across web, systems, and gaming. But for game developers, Ruby's interpreted virtual machine was far too slow to meet the brutal 16-millisecond frame budget demanded by real-time physics and rendering.
