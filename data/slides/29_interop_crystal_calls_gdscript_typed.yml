  code: "# Generate typed binding with: lapis bind res://scripts/dialogue.gd\r\nclass
    DialogueSystem < Godot::Node\r\n  # Type-safe method proxy synthesized by Lapis\r\n
    \ def show_dialogue(speaker : String, line_id : Int32) : Bool\r\n    call(\"show_dialogue\",
    speaker, line_id).as_bool\r\n  end\r\n\n  # Typed property wrapper\r\n  def dialogue_speed
    : Float32\r\n    get(\"dialogue_speed\").as_f32\r\n  end\r\nend\r\n\n# Consumer
    usage: 100% typed, with compiler autocomplete!\r\ndialogue = get_node_as(DialogueSystem,
    \"Dialogue\")\r\ndialogue.show_dialogue(\"Hero\", 42)"
right:
  type: card
  title: Typed Binding Benefits
  color: cyan
  items:
  - <strong>Compile-Time Type Safety:</strong> Method signatures are validated by
    Crystal's compiler; no runtime string typos.
  - <strong>IDE Autocompletion:</strong> Full jump-to-definition and parameter hinting
    in VS Code and Crystalline LSP.
  - <strong>CLI Automation:</strong> <code>lapis bind</code> automatically inspects
    GDScript files and generates typed wrappers.
  - <strong>Zero Performance Tax:</strong> Compiles to direct Variant dispatches with
    zero extra abstraction layers.
notes: When your team has established GDScript subsystems that you want to call frequently
  from Crystal, you don't have to settle for dynamic string dispatch. Using lapis
  bind, Lapis inspects the GDScript file and generates a strongly-typed Crystal wrapper
  class. You get full compile-time type verification and IDE autocompletion when calling
  GDScript.
