    - '<strong>Eliminates Dynamic <code>.call()</code>:</strong> Invokes GDScript methods as native functions—eliminating stringly calls and Variant casts.'
    - '<strong>Compile-Time Signature Verification:</strong> Statically verifies parameter types, argument counts, and return types before running.'
