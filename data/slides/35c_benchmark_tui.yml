right:
  type: card
  title: Head-to-Head Comparisons & Categories
  color: cyan
  items:
    - '<strong>Head-to-Head Comparison Groups (<code>-g / --group</code>):</strong> Pit competing algorithms, data structures, or implementations directly against a reference baseline to measure exact speedup multiples.'
    - '<strong>Category Organization (<code>-c / --category</code>):</strong> Organize and filter suites by domain (<code>compute</code>, <code>engine</code>, <code>toolchain</code>, <code>custom</code>) with cumulative category breakdown charts.'
    - '<strong>Multi-View ANSI Visualizer (<code>--tui</code>):</strong> Switch interactively between head-to-head comparison bars, top speedup rankings, category donut charts, and multi-sample latency curves.'
    - '<strong>Multi-Format Output Staging:</strong> Export console tables, vector charts (SVG), interactive HTML reports, and XML baselines for version-to-version comparisons.'
notes: |
  While our 5-language shootout benchmarks Lapis itself, `lapis benchmarks` is built for your own game projects to pit implementations head-to-head. By organizing benchmarks into comparison groups (`--group`) and categories (`--category`), you can test competing algorithms—such as a spatial hash versus a quadtree, or a new Crystal system against an existing GDScript prototype—directly against a chosen baseline. Launching `lapis benchmarks --tui` opens an interactive ANSI visualizer where you can cycle through head-to-head bar charts, speedup rankings, category time-share donut charts, and multi-sample latency distributions, or export SVG and HTML reports for team review.
