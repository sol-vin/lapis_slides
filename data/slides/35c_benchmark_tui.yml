  items:
    - '<strong>Double-Buffered ANSI Dashboard:</strong> <code>lapis benchmarks --tui</code> renders a zero-flicker split-pane interface with progress tracking, active suite timers, and live stdout streams.'
    - '<strong>Mathematical Speedup Ratios:</strong> Automatically computes Crystal vs GDScript throughput ratios (e.g. <code>59.4x</code> N-Body, <code>33.0x</code> Perlin Noise, <code>15.4x</code> A* Routing) across multiple iterations.'
    - '<strong>Statistical Iteration Sampling:</strong> Collects min, median, max, and standard deviation across configurable iterations (<code>-i 5</code>) with warmup phase discarding.'
    - '<strong>Multi-Format Output Staging:</strong> Simultaneously generates console reports, visual comparison bar charts (SVG), interactive HTML reports, and CI-ready XML/JSON artifacts.'
notes: |
  To verify real-world game performance across engine versions, Lapis provides a full-featured terminal UI for benchmarking. Invoking `lapis benchmarks --tui` launches a double-buffered ANSI dashboard that executes microbenchmarks and comparative stress tests side-by-side against Godot GDScript. As each suite runs, the TUI dynamically plots execution latency, calculates exact speedup multiples with statistical confidence intervals, and records peak memory. Developers can navigate suites with keyboard controls, drill down into sub-step iterations with Enter, and automatically export SVG comparison charts and HTML reports for documentation or CI regression tracking.
