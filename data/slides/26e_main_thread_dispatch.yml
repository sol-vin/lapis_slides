    title: Dispatch Queue Architecture
    color: cyan
    items:
      - '<strong>Zero Overhead on Main:</strong> If the caller is already executing on the Main Thread, the block executes immediately with zero queue allocation and zero latency.'
      - '<strong>Thread-Safe Mutex Buffer:</strong> Off-thread invocations append closures to an internal buffer (<code>@@main_thread_queue</code>) protected by <code>::Thread::Mutex</code>.'
      - '<strong>Deterministic Frame Flush:</strong> The queue is automatically flushed and drained by the engine main loop at the beginning of each frame tick.'
  - type: card
