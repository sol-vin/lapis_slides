right:
  type: card
  title: Automated Multi-Target Fan-Out
  color: magenta
  items:
  - <strong>Multi-Consumer Binary Fan-Out:</strong> Compiling core libraries automatically fans out updated bridge DLLs, runtime dependencies, and symbols across all consumers.
  - <strong>Windows File-Locking Prevention:</strong> Timestamp-aware synchronization checks file signatures and handles locked shadow copies without failing the build pipeline.
  - <strong>Topological Addon DAG Sorting:</strong> Automatically resolves inter-addon dependency graphs, ensuring load orders in <code>extension_list.cfg</code> match required initialization sequences.
  - <strong>Poison Protection:</strong> Scans target directories to prevent rogue copies of host <code>libgodot.dll</code> from corrupting isolated addon ClassDB registries.
notes: |
  In large multi-project repositories with core engine bindings, test runners, template starters, and showcase demos, keeping shared DLLs and extension manifests in sync is critical. lapis sync eliminates manual copying by analyzing the workspace dependency graph, updating all target directories in parallel, and resolving addon initialization order using topological sort. It even respects Windows file-locking rules, ensuring open editors never break ongoing compilation workflows.
