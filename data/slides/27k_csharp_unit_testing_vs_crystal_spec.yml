gdscript:
  title: ':circle-xmark: Godot C#: Engine Harnesses & Async Signal Pumps'
  lang: csharp
  tag: C# (.NET 8 + GdUnit4)
  card_title: C# Testing Friction
  font_size: '0.68rem'
  code: |
    using Godot;
    using GdUnit4;
    using System.Threading.Tasks;

    [TestSuite]
    public class PlayerCombatTests
    {
        [TestCase]
        public async Task TestShieldMitigation()
        {
            // Requires Godot engine scene runner; new Player() crashes in ObjectDB
            var player = ISceneRunner.Load("res://Player.tscn")
                                    .Instantiate<Player>();
            var signalFired = false;

            // Signal testing requires event listeners or pump loops
            player.HealthChanged += (hp, max) => signalFired = true;

            player.EquipShield(50f);
            player.TakeDamage(20f);

            // Awaiting engine ticks to pump Godot signals and scene tree
            await player.ToSignal(player.GetTree(), SceneTree.SignalName.ProcessFrame);

            Assertions.AssertThat(player.Health).IsEqual(100f);
            Assertions.AssertThat(player.Shield).IsEqual(30f);
            Assertions.AssertThat(signalFired).IsTrue();

            player.QueueFree(); // Manual cleanup of unmanaged C++ handle
        }
    }
  points:
  - <strong>Engine Lifecycle Coupling:</strong> Godot C# nodes depend on C++ ObjectDB bindings; standard <code>dotnet test</code> throws <code>NullReferenceException</code> or native crashes unless run inside headless Godot.
  - <strong>Heavy External Test Harnesses:</strong> Requires third-party runners like GdUnit4 or WAT, loading scene packs and booting engine subsystems just to test pure gameplay logic.
  - <strong>Asynchronous Signal Testing:</strong> Verifying signal emissions requires <code>ToSignal</code> awaiters, thread pumps, or timeout polling loops rather than direct synchronous inspection.
  - <strong>Unmanaged Cleanup &amp; Leak Risks:</strong> Instantiated test nodes must be manually disposed via <code>QueueFree()</code> to prevent native C++ engine memory leaks across test suites.
crystal:
  title: ':sparkles: Crystal: Built-In Spec Runner & Millisecond Isolation'
  lang: crystal
  tag: Crystal (crystal spec)
  card_title: Crystal Spec Zen
  font_size: '0.68rem'
  code: |
    require "spec"
    require "../src/entities/player"

    # Standard Crystal BDD spec: runs in milliseconds without booting Godot
    describe Player do
      it "mitigates damage through shield and emits health_changed" do
        # Direct, instant node instantiation in memory
        player = Player.new
        signal_received = false

        # First-class signal block connection: direct and synchronous
        player.health_changed.connect do |hp, max|
          signal_received = true
        end

        player.equip_shield(50.0_f32)
        player.take_damage(20.0_f32)

        # Pure, instantaneous assertions with zero engine overhead
        player.health.should eq(100.0_f32)
        player.shield.should eq(30.0_f32)
        signal_received.should be_true
      end
    end
  points:
  - <strong>Built-In Zero-Config BDD Runner:</strong> Crystal includes a blazing-fast, RSpec-inspired testing framework (<code>crystal spec</code>) standard in the compiler with zero NuGet packages.
  - <strong>Headless Pure Unit Testing:</strong> Test gameplay logic, combat math, and node state directly in memory in sub-milliseconds without booting the Godot engine process.
  - <strong>Synchronous First-Class Signals:</strong> Signals connect directly with closures (<code>player.health_changed.connect { ... }</code>), enabling immediate assertion verification.
  - <strong>Automatic Memory & Lifecycle Management:</strong> Boehm GC reclaims test objects automatically, while Lapis's test harness and dead-pointer safety eliminate dangling C++ pointers and manual <code>queue_free</code> teardown boilerplate.
takeaway:
  badge: ZERO-CONFIG TESTING
  text: 'Crystal specs run in sub-milliseconds via built-in crystal spec without booting the Godot engine, configuring external runners, or managing unmanaged object lifecycles.'
notes: |
  Unit testing in Godot C# is notoriously cumbersome because node classes inherit from GodotObject, tightly coupling them to Godot's unmanaged C++ ObjectDB. Instantiating a C# node outside a running Godot instance throws native exceptions, forcing developers to set up heavy third-party harnesses like GdUnit4 and boot a headless Godot process for every test run. Testing signals further requires asynchronous event listeners and frame-stepping loops (`await ToSignal`).
  In stark contrast, Lapis nodes in Crystal are pure, decoupled classes that can be instantiated and exercised directly in memory. Crystal includes a high-performance BDD test framework (`crystal spec`) in the standard compiler toolchain, allowing combat formulas, state machines, and synchronous signal emissions to be verified in sub-milliseconds with zero external dependencies. Boehm GC reclaims test objects automatically, while Lapis's test harness and dead-pointer safety eliminate dangling C++ pointers and manual queue_free teardown boilerplate.
