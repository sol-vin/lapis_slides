  title: ':circle-xmark: Godot C#: Engine Harnesses & Async Signal Pumps'
  lang: csharp
  tag: C# (.NET 8 + GdUnit4)
  card_title: C# Testing Friction
  font_size: '0.82rem'
  code: |
    [TestSuite]
    public class PlayerCombatTests
    {
        [TestCase]
        public async Task TestShieldMitigation()
        {
            // Requires engine scene runner; new Player() crashes in ObjectDB
            var player = ISceneRunner.Load("res://Player.tscn").Instantiate<Player>();
            player.EquipShield(50f);
            player.TakeDamage(20f);

            // Awkward untyped signal awaiter requiring engine ticks & casting
            var args = await player.ToSignal(player, Player.SignalName.HealthChanged);
            Assertions.AssertThat((float)args[0]).IsEqual(100f);
            player.QueueFree(); // Manual cleanup of unmanaged C++ handle
        }
    }
  points:
    - '<strong>Engine Lifecycle Coupling:</strong> Godot C# nodes depend on C++ ObjectDB bindings; standard <code>dotnet test</code> crashes unless booted in headless Godot.'
    - '<strong>Heavy External Test Harnesses:</strong> Requires third-party runners like GdUnit4 or WAT, loading scene packs to test pure gameplay logic.'
    - '<strong>Untyped Async Signal Testing:</strong> <code>await player.ToSignal(...)</code> returns loosely-typed <code>Variant[]</code> arrays requiring manual runtime casts.'
crystal:
  title: ':sparkles: Crystal: Built-In Spec Runner & Headless LibGodot'
  lang: crystal
  tag: Crystal (lapis test)
  card_title: Crystal Spec Zen
  font_size: '0.82rem'
  code: |
    require "spec"
    require "../src/entities/player"

    describe Player do
      it "mitigates damage through shield and emits health_changed" do
        player = Godot.create(Player) # Direct ClassDB alloc; no .tscn needed!
        player.equip_shield(50.0_f32)

        spawn { player.take_damage(20.0_f32) }
        hp, _ = await!(player.health_changed) # Typed tuple destructuring!

        player.shield.should eq(30.0_f32)
        hp.should eq(100.0_f32)
      end
    end
  points:
    - '<strong>Built-In Zero-Config Runner:</strong> Crystal ships <code>crystal spec</code> in the standard library with zero external NuGet test harnesses.'
    - '<strong>Pure Structs or Headless Nodes:</strong> Test pure gameplay structs in <code>&lt;1ms</code> via <code>crystal spec</code>, or instantiate nodes via <code>Godot.create(T)</code> without <code>.tscn</code> files.'
    - '<strong>Typed Signal Awaiting:</strong> <code>hp, _ = await!(player.health_changed)</code> awaits signals with full compile-time tuple destructuring.'
takeaway:
