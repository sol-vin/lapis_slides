notes: |
  In Part 3 of our demo, we demonstrate low-level systems rigor. First, we launch a background OS thread that generates complex procedural geometry off-thread. This worker can assemble detached orphan trees across CPU cores. When ready, Godot.on_main_thread queues the block to be drained deterministically at the next frame boundary, mounting the room safely on the main thread. Next, we run our test suite: Lapis::Test.assert_no_leak exercises 100 spawn cycles, queries Godot's native Performance monitors, and verifies zero object leaks. Finally, if any crash or bug ever occurs, lapis run -d drops us directly into radare2 for native machine code disassembly and register forensics.
