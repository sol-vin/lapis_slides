  title: Zero-Alloc Interop Invariants
  color: cyan
  items:
  - <strong>Direct C-ABI Virtual Pointers (1.4 ns):</strong> Lapis bypasses Godot's dynamic <code>Variant</code> dispatch for known methods, calling engine virtual function pointers directly at <strong>1.4 nanoseconds</strong> per invocation.
  - <strong>Zero Variant Boxing in Hot Loops:</strong> Native types (<code>Vector2</code>, <code>Vector3</code>, <code>Transform3D</code>, <code>Color</code>) reside in stack memory without heap allocation or pointer indirection.
  - <strong>Two-Way Typed Bindings:</strong> Both engine methods and custom GDScript project nodes receive static compile-time wrappers, eliminating string method lookup overhead.
  - <strong>Massive Call Density:</strong> Games can execute millions of boundary-crossing queries (raycasts, transform updates, physics steps) per frame without CPU frame hitching.
notes: |
  A common bottleneck in multi-language game development is foreign function interface (FFI) overhead. In this benchmark, we measured the nanosecond-level cost of crossing the Godot GDExtension boundary. When using dynamic Variant method calls, each invocation costs roughly 186 nanoseconds due to string hashing and Variant packing. Lapis generates direct C-ABI function pointer wrappers, reducing call latency to just 1.4 nanoseconds—matching pure C++ and letting you execute millions of engine calls per frame.
