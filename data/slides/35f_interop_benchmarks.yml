  items:
  - <strong>Cached ptrcall Function Pointers:</strong> Lapis binds engine methods via cached GDExtension method binds and direct function pointers, bypassing dynamic <code>Variant</code> string lookups.
  - <strong>Direct Value Passing in Hot Loops:</strong> Native value types (<code>Vector2</code>, <code>Vector3</code>, <code>Transform3D</code>, <code>Color</code>) reside on the stack and pass by pointer without Variant boxing.
  - <strong>Two-Way Typed Bindings:</strong> Both engine methods and custom GDScript project nodes receive static compile-time wrappers, eliminating runtime string method lookup.
  - <strong>High Call Throughput:</strong> Games can execute high-frequency boundary-crossing queries (transforms, physics steps, raycasts) without CPU frame hitching.
notes: |
  A common bottleneck in multi-language game development is foreign function interface (FFI) overhead. In this benchmark, we measured the nanosecond-level cost of crossing the Godot GDExtension boundary. When using dynamic Variant method calls, each invocation costs roughly 186 nanoseconds due to string hashing and Variant packing. Lapis generates direct C-ABI ptrcall wrappers, reducing call latency to roughly 1.4 nanoseconds—matching pure C++ and letting you execute high-frequency engine queries without FFI bottlenecks.
