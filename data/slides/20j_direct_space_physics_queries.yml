  font_size: '0.84rem'
  code: |
    func check_line_of_sight(target_pos: Vector2) -> void:
        # Pitfall: 12 lines of ceremony to cast a single ray
        var space = get_world_2d().direct_space_state
        var query = PhysicsRayQueryParameters2D.create(
            global_position, target_pos
        )
        query.collision_mask = 0b0001
        var result: Dictionary = space.intersect_ray(query)
        if not result.is_empty():
            var point: Vector2 = result["position"]
            var collider = result["collider"]
            if collider is Enemy:
                collider.take_damage(25)
  points:
    - '<strong>Manual Query Setup:</strong> Requires allocating <code>PhysicsRayQueryParameters2D</code> objects for every raycast.'
    - '<strong>Untyped Dictionaries:</strong> <code>intersect_ray</code> returns a dynamic Variant dictionary requiring string key lookups.'
    - '<strong>Runtime Casting Hazards:</strong> Colliders must be manually checked with <code>is Enemy</code>, prone to null errors.'
