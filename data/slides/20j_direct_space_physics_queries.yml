  font_size: '0.80rem'
  code: |
    func check_line_of_sight(target_pos: Vector2) -> void:
        # Pitfall: 12 lines of ceremony to cast a single ray
        var space = get_world_2d().direct_space_state
        var query = PhysicsRayQueryParameters2D.create(
            global_position, target_pos
        )
        query.collision_mask = 0b0001
        query.collide_with_areas = false
        query.collide_with_bodies = true

        var result: Dictionary = space.intersect_ray(query)
        if not result.is_empty():
            var point: Vector2 = result["position"]
            var normal: Vector2 = result["normal"]
            var collider = result["collider"]
            if collider is Enemy:
                collider.take_damage(25)
  points:
    - '<strong>Manual Query Allocation:</strong> Requires allocating <code>PhysicsRayQueryParameters2D</code> objects for every single raycast.'
    - '<strong>Untyped Dictionary Unpacking:</strong> <code>intersect_ray</code> returns an untyped Variant dictionary, requiring manual string key lookups.'
    - '<strong>Runtime Type Casting:</strong> Colliders must be manually checked with <code>is Enemy</code>, prone to null errors if destroyed mid-frame.'
