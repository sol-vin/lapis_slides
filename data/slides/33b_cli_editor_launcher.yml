right:
  type: card
  title: Persistent Engine Supervision
  color: yellow
  items:
  - <strong>Persistent Supervisor (<code>lapis cli -e</code>):</strong> Runs alongside the Godot Editor in a dedicated terminal pane, monitoring engine process health and capturing crash diagnostics.
  - <strong>Performance Monitoring (<code>--monitor</code>):</strong> <code>lapis run --monitor</code> or <code>lapis editor --monitor</code> renders real-time FPS sparklines and RAM usage graphs in your console.
  - <strong>Debugger Attachment (<code>--debug</code> / <code>--r2</code>):</strong> Attaches radare2 directly to the editor or game process for live breakpoint stepping and symbol resolution.
  - <strong>Headless Automation (<code>-q &lt;sec&gt;</code>):</strong> <code>--quit-after=N</code> enables timed CI and integration test runs that auto-terminate cleanly with full exit code reporting.
notes: |
  Developing native GDExtensions requires deep visibility into what the engine is doing while the editor is running. The Lapis Editor Supervisor (lapis cli -e) keeps a persistent terminal window open that monitors the Godot Editor process, captures all engine and runtime output, and displays live process metrics. Developers can trigger hot-recompilation on demand, attach radare2 with --debug, monitor real-time FPS/RAM graphs with --monitor, or script headless runs with --quit-after.
