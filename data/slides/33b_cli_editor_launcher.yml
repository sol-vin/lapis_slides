  title: Persistent Engine Supervision
  color: yellow
  items:
  - <strong>Persistent Supervisor (<code>lapis cli -e</code>):</strong> Runs alongside the Godot Editor in a dedicated terminal pane, monitoring engine process health and capturing crash diagnostics.
  - <strong>Real-Time Process Telemetry:</strong> Continuously tracks engine PID, process uptime, reload cycle count, memory consumption, and exit status codes.
  - <strong>Unified Log Stream:</strong> Multiplexes Godot engine stdout/stderr and Crystal runtime logs into a live rolling viewer with auto-scroll and scrollback buffer lock.
  - <strong>Instant Quick Actions:</strong> Hotkeys allow triggering immediate recompile and hot-reload (<code>R</code>), graceful process termination (<code>K</code>), or log buffer clearing (<code>C</code>) without leaving the terminal.
notes: |
  Developing native GDExtensions requires deep visibility into what the engine is doing while the editor is running. The Lapis Editor Supervisor (lapis cli -e) keeps a persistent terminal window open that monitors the Godot Editor process, captures all engine and runtime output, and displays live process metrics. Developers can trigger hot-recompilation on demand or freeze the log buffer to inspect stack traces without switching focus or digging through external log files.
