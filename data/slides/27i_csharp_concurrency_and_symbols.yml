    node NetworkEntity < Node3D do
      @packet_channel = Channel(Bytes).new(32)

      def _ready : Nil
        # Lightweight fiber: runs cooperatively with 0 OS thread tax
        spawn do
          loop { process_payload(@packet_channel.receive) }
        end
      end

      def on_network_packet_received(data : Bytes) : Nil
        return unless in_group?(:network_synced) # Instant 32-bit integer cmp!
        @packet_channel.send(data)
      end
    end
  points:
    - '<strong>Microscopic Stack Fibers:</strong> <code>spawn</code> creates cooperative fibers running on the stack with negligible memory footprint.'
    - '<strong>Thread-Safe CSP Channels:</strong> <code>Channel(T)</code> provides lock-free message passing between background workers and the main thread.'
    - '<strong>Immediate 32-Bit Symbols:</strong> Symbols like <code>:network_synced</code> are interned integers evaluated at build time without string hashing.'
