  code: |
    public partial class NetworkEntity : Node3D
    {
        // async void: unhandled exceptions crash the entire engine process!
        public async void OnNetworkPacketReceived(byte[] data)
        {
            if (!IsInGroup("network_synced")) return; // String hashing cost

            // Task allocates state machine on heap; background thread cannot touch tree:
            await Task.Run(() => ProcessPacketPayload(data));
            Callable.From(() => GlobalPosition = Vector3.Zero).CallDeferred();
        }
    }
  points:
    - '<strong>Heap Task Churn:</strong> <code>async Task</code> allocates state machine objects on the managed heap, degrading tight game loop performance.'
    - '<strong>Async Void Crash Hazard:</strong> Unhandled exceptions inside <code>async void</code> event handlers bypass try/catch and kill the entire process.'
    - '<strong>SceneTree Threading Hazard:</strong> Touching Godot nodes from background tasks causes fatal thread races, requiring <code>CallDeferred</code>.'
