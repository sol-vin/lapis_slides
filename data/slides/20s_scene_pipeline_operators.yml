gdscript:
  title: ':circle-xmark: GDScript: Multi-Step Instantiation Boilerplate'
  lang: gdscript
  tag: GDScript
  font_size: '0.74rem'
  code: |
    func spawn_entities() -> void:
        # Pitfall 1: Multi-step preload, instantiate, cast & mount
        const EnemyScene = preload("res://scenes/enemy.tscn")
        var enemy = EnemyScene.instantiate() as Enemy
        enemy.health = 250
        enemy.tag = "elite"
        add_child(enemy)

        # Pitfall 2: Sibling mounting with manual parent lookup
        const MarkerScene = preload("res://scenes/marker.tscn")
        var marker = MarkerScene.instantiate() as Marker2D
        marker.position = Vector2(0, 50)
        get_parent().add_child(marker)

        # Pitfall 3: Dynamic loading requires manual resource checking
        var boss_scene = load("res://scenes/boss.tscn") as PackedScene
        var boss = boss_scene.instantiate() as BossEnemy
        boss.damage = 100
        add_child(boss)
  points:
  - <strong>Multi-Step Friction:</strong> Must store <code>PackedScene</code>, invoke <code>instantiate()</code>, cast, configure, and mount in separate statements.
  - <strong>Unsafe Runtime Casting:</strong> Untyped <code>Resource</code> return requires <code>as Enemy</code> casting that fails silently if types diverge.
  - <strong>Manual Tree Lookup:</strong> Sibling mounting requires explicit <code>get_parent().add_child(...)</code> navigation.
crystal:
  title: ':sparkles: Crystal: Preload (>), Load (>>), and Direct Tree Pipelines'
  lang: crystal
  tag: Crystal (Lapis)
  font_size: '0.74rem'
  code: |
    require "lapis/extras"

    def spawn_entities : Void
      # 1. Pipeline Preload (>): Preload, instantiate, cast & mount!
      enemy = add_child("res://scenes/enemy.tscn" > Enemy) do
        self.health = 250
        self.tag = "elite"
      end # typeof(enemy) is Enemy (preserves static type T!)

      # 2. Pipeline Sibling Mounting (>):
      marker = add_sibling("res://scenes/marker.tscn" > Marker2D) do
        self.position = Vector2.new(0, 50)
      end

      # 3. Dynamic Runtime Load Operator (>>):
      boss = "res://scenes/boss.tscn" >> BossEnemy

      # 4. Nilable Pipeline (?): Returns nil if missing (no exception!):
      secret = "res://scenes/secret.tscn" > SecretRoom?
    end
  points:
  - <strong>Opt-In Require:</strong> Add <code>require "lapis/extras"</code> to enable pipeline operators on <code>String</code> and <code>PackedScene</code>.
  - <strong>Direct Tree Pipeline (<code>&gt;</code>):</strong> <code>add_child("path" &gt; T) do ... end</code> preloads, instantiates, types, mounts, and configures inline.
  - <strong>Sibling Pipeline Parity:</strong> <code>add_sibling("path" &gt; T)</code> mounts directly under the parent node with full context block evaluation.
  - <strong>Dynamic Load Pipeline (<code>&gt;&gt;</code>):</strong> Dynamically loads scenes at runtime; pairs with nilable types like <code>T?</code> without throwing.
takeaway:
  badge: PIPELINE ERGONOMICS
  text: Lapis scene pipeline operators (> and >>) turn multi-step scene preloading, instantiation, and initial configuration into expressive single-line expressions.
notes: |
  In Chapter 4.1, we saw how `add_child` and `add_sibling` work with `PackedScene.load("...").instantiate.as(T)`. With `require "lapis/extras"`, we elevate scene instantiation into ultra-clean pipeline operators.
  With the greater-than operator (`>`), `"res://scenes/enemy.tscn" > Enemy` preloads the PackedScene, instantiates it, and downcasts to `Enemy` in a single token stream. When passed directly into `add_child` or `add_sibling`, you can configure properties inline with Crystal's context execution (`with .. yield`).
  The double-greater-than operator (`>>`) performs dynamic runtime loading. When paired with nilable types like `SecretRoom?`, it safely returns nil if the resource fails to load without crashing.
