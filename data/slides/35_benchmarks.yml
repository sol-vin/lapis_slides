  title: Why Crystal Dominates
  color: cyan
  items:
  - <strong>LLVM Ahead-of-Time Compilation:</strong> Compiles down to optimized machine instructions; zero bytecode interpreter overhead.
  - <strong>Autovectorization & SIMD:</strong> Vector math operations benefit from LLVM's automatic AVX2/NEON vectorization.
  - <strong>Flat Memory Layout:</strong> Value types and structs live contiguously on the stack or in flat arrays without pointer indirection.
  - <strong>Minimal GC Pauses:</strong> Predictable, low-latency execution during tight 60/120 FPS frame cycles.
notes: |
  Here are the quantitative numbers from our automated benchmark suite. On heavy gameplay calculations—N-body gravitational simulations, procedural terrain generation, and A* pathfinding—Crystal consistently outperforms GDScript by 15x to nearly 60x. It allows you to write complex, simulation-heavy gameplay systems in high-level code without having to drop down to C++.
