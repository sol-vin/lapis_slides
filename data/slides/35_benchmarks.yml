  color: emerald
  items:
  - <strong>LLVM Ahead-of-Time Compilation:</strong> Compiles down to optimized machine
    instructions; zero bytecode interpreter overhead.
  - <strong>Autovectorization & SIMD:</strong> Vector math operations benefit from
    LLVM's automatic AVX2/NEON vectorization.
  - <strong>Flat Memory Layout:</strong> Value types and structs live contiguously
    on the stack or in flat arrays without pointer indirection.
  - <strong>Zero GC Hitching:</strong> Predictable, low-latency execution during tight
    60/120 FPS frame cycles.
notes: Here are the quantitative numbers from our automated benchmark suite. On heavy
