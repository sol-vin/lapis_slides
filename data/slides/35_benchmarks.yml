right:
  type: card
  title: Why Compiled Crystal Excels
  color: cyan
  items:
  - <strong>LLVM Ahead-of-Time Compilation:</strong> Compiles directly to native machine instructions with zero bytecode interpreter dispatch overhead.
  - <strong>Autovectorization &amp; SIMD:</strong> Contiguous math loops benefit from LLVM's automatic AVX2/NEON vectorization.
  - <strong>Flat Memory Layout:</strong> Value types and structs live contiguously on the stack or in flat buffers without pointer chasing.
  - <strong>Zero-Allocation Frame Loops:</strong> Stack structs and inlined iterators avoid heap allocations on the hot path, keeping GC idle.
notes: |
  Here are the quantitative numbers from our automated 27-suite benchmark harness. Across heavy gameplay calculations—AStar2D grid pathfinding, N-body gravitational simulations, 3D Perlin terrain generation, and VectorMath2D—Crystal achieves a 46.2x geometric mean speedup over GDScript (reaching 149x on N-Body and 282x on AStar2D). It lets you write simulation-heavy gameplay systems in high-level code without dropping down to C++.
