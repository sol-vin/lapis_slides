left:
  type: code
  title: player_character.cr — Declarative Node Definition
  tag: Crystal
  lang: crystal
  font_size: '0.90rem'
  code: |
    require "lapis"

    # Declares Godot class registered in ClassDB
    node Player < CharacterBody3D do
      # Movement speed in meters per second
      @[Export(range: 1.0_f32..20.0_f32, step: 0.5_f32)]
      property speed : Float32 = 7.0_f32

      property health : Int32 = 100
      # Maximum hit points
      @[Export(range: 10..500, step: 10)]
      property max_health : Int32 = 100

      signal health_changed(current : Int32, max_health : Int32)
      signal died

      def take_damage(amount : Int32) : Void
        @health = Math.max(0, @health - amount)
        health_changed.emit(@health, @max_health)
        died.emit if @health == 0
      end

      def _ready : Void
        Godot.print("Player initialized: #{name}")
      end
    end
right:
  type: card
  title: Clean Node DSL Invariants
  color: cyan
  items:
  - <strong>Declarative node Macro:</strong> <code>node ClassName < ParentNode</code>
    registers the class in Godot's ClassDB with zero boilerplate.
  - <strong>Property Annotations:</strong> <code>@[Export]</code> supports ranges,
    enums, file pickers, and tool buttons.
  - <strong>Automated Doc Harvesting:</strong> Regular Crystal comments above classes
    and methods are harvested into Godot's offline EditorHelp database.
  - <strong>Native Lifecycle Hooks:</strong> Direct bindings to <code>_ready</code>,
    <code>_process</code>, and <code>_physics_process</code>.
  - <strong>Multiplayer RPC:</strong> <code>@[RPC]</code> configures network replication
    mode and transfer channels.
  - <strong>Engine Singletons:</strong> <code>@[Autoload]</code> automatically registers
    persistent engine singletons and mounts to SceneTree root with type-safe accessors.
notes: |
  Here is what authoring a Godot node actually looks like in Lapis. Notice how clean, concise, and declarative it is. You write node Player < CharacterBody3D, declare exported properties with ranges, define typed signals, and write your lifecycle methods. Regular comments above properties are harvested at compile time into Godot's in-editor tooltips. Furthermore, annotations like @[RPC] and @[Autoload] configure networking and persistent engine singletons with zero engine boilerplate. It eliminates over 70% of the ceremony required by C++ or Rust.

