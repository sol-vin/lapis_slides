  title: Why LLDB Was Removed — The Fat Debugger Trap
  color: blue
  items:
  - <strong>Gigabyte Toolchain Bloat:</strong> Bundled 2GB+ of Clang/LLVM runtime binaries and Python dependencies, destroying lean developer onboarding.
  - <strong>Windows DWARF vs. PDB Desyncs:</strong> Struggled with MinGW DWARF and MSVC symbol table format differences, causing lost breakpoints and blank backtraces.
  - <strong>Fragile Python Environment Binding:</strong> LLDB plugin scripts demanded exact host Python version matches, breaking constantly across OS updates.
  - <strong>Zero Headless CI Automation:</strong> Inability to script lightweight headless crash triage, stack frame decoding, and memory dump forensics in CI pipelines.
right:
  type: card
  title: Why radare2 (r2) is Sovereign in Lapis
  color: cyan
  items:
  - <strong>Zero-Dependency & Instant:</strong> Pure C systems architecture; installs in seconds with zero Python runtimes or heavyweight LLVM toolchain bloat.
  - <strong>Hardware Memory Watchpoints:</strong> <code>rw &lt;addr&gt;</code> breaks CPU execution instantly at the exact machine instruction performing illegal memory writes (catching <code>0xC0000005</code>).
  - <strong>Native Pseudo-C Decompilation:</strong> <code>pdc</code> and <code>pdf</code> decompile machine instructions side-by-side with Crystal symbols without external debug servers.
  - <strong>Headless CI Crash Forensics:</strong> <code>PluginForensics</code> automatically analyzes registers (<code>RCX</code>/<code>RDI</code>) and verifies Godot ObjectDB 64-bit monotonic instance IDs in CI.
  - <strong>cradare2 Bindings:</strong> Direct, type-safe Crystal bindings to automate r2 inspection routines programmatically.
notes: |
  We completely removed LLDB from Lapis. Why? LLDB is a classic fat debugger: multi-gigabyte LLVM and Clang dependencies, fragile host Python bindings that break across OS updates, and constant symbol table mismatches on Windows between MSVC and MinGW. Instead, Lapis standardized 100% on radare2 (r2) and our cradare2 bindings. radare2 is ultra-lightweight, has zero runtime dependencies, and is unmatched for low-level systems forensics: it lets us set hardware memory watchpoints to catch 0xC0000005 access violations immediately, provides native pdc pseudo-C decompilation, and powers headless crash forensics in CI to validate ObjectDB 64-bit instance IDs.
