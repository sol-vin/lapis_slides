left:
  type: card
  title: Why LLDB Was Replaced
  badge: "THE FAT DEBUGGER TRAP"
  color: coral
  items:
    - <strong>2 GB+ Toolchain Bloat:</strong> Bundled massive Clang/LLVM runtimes and Python dependencies.
    - <strong>DWARF vs. PDB Desyncs:</strong> Struggled with MinGW DWARF vs. MSVC symbol tables on Windows.
    - <strong>Fragile Python Bindings:</strong> Demanded exact host Python version matches across OS updates.
    - <strong>No Headless Triage:</strong> Unsuitable for fast, scriptable crash forensics in CI pipelines.
right_top:
  type: card
  title: In-Editor & CLI Debugging via radare2
  badge: "LIVE DECOMPILATION"
  color: cyan
  items:
    - <strong>In-Editor (<code>lapis editor -d</code>):</strong> Live pseudo-C decompiler (<code>pdc</code>), assembly (<code>pdf</code>), and multiplayer lockstep.
    - <strong>Standalone (<code>lapis run -d</code>):</strong> Debug native game binaries and DLLs under r2 with zero editor overhead.
    - <strong>Static Mapper (<code>lapis decompile</code>):</strong> Inspect Crystal methods as pseudo-C, assembly (<code>pdca</code>), or source lines (<code>pdls</code>).
right_bottom:
  type: card
  title: Hardware Watchpoints & Crash Forensics
  badge: "BINARY FORENSICS"
  color: green
  items:
    - <strong>Hardware Watchpoints (<code>rw &lt;addr&gt;</code>):</strong> Traps CPU execution on the exact instruction performing an illegal write.
    - <strong>Automated Boundary Triage:</strong> <code>PluginForensics</code> classifies crashes across GameCode, LapisPlugin, or GDExtensionBridge and decodes 64-bit ObjectDB IDs.
notes: |
  We removed LLDB from Lapis because it was a 2GB+ dependency with fragile host Python bindings and Windows PDB/DWARF symbol issues. In its place, Lapis standardizes on radare2 (r2) and our cradare2 bindings. Developers get seamless debugging both in and out of the editor: lapis editor -d embeds live pseudo-C decompilation and multiplayer lockstep debugging into Godot, while lapis run -d and lapis decompile let you debug standalone games, inspect compiled machine code, and set hardware memory watchpoints from the terminal.
