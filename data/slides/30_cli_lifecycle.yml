right:
  type: card
  title: Core CLI Capabilities
  color: cyan
  items:
  - <strong>Zero-Config Scaffolding:</strong> <code>lapis init</code> scaffolds ready-to-run
    Godot projects with configured <code>shard.yml</code> and <code>project.godot</code>.
  - <strong>Baked Embedded Assets:</strong> CLI contains all starter templates and
    GDExtension manifests embedded via <code>BakedFileSystem</code>.
  - <strong>Unified Toolchain:</strong> Replaces fractured shell scripts with a single
    standardized executable.
  - <strong>Cross-Platform Parity:</strong> Identical command behavior across Windows,
    Linux, and macOS.
notes: Developer tooling is just as important as the language itself. We built the
  lapis CLI to serve as the unified developer tool for the entire project lifecycle.
  With commands like lapis init, lapis build, lapis editor, and lapis test, developers
  get a seamless, zero-config onboarding experience from day one.
