right:
  type: card
  title: Command Center & Scaffolding Invariants
  color: cyan
  items:
  - <strong>Interactive Command Center:</strong> Running <code>lapis</code> without arguments opens a real-time dashboard displaying engine health, git branch, and compiler statuses with hotkey triggers.
  - <strong>Spotlight Palette & Typo Recovery:</strong> Opal-powered fuzzy search across all 30+ subcommands with Levenshtein distance typo suggestions and native shell autocompletion.
  - <strong>Turnkey Project Scaffolding:</strong> <code>lapis new game &lt;name&gt;</code> scaffolds ready-to-run Godot projects with configured <code>shard.yml</code> and <code>project.godot</code> in milliseconds.
  - <strong>Embedded Baked Assets:</strong> CLI embeds starter templates, manifests, and bridge sources via <code>BakedFileSystem</code> for complete offline portability.
notes: |
  Developer tooling is the foundation of game programming speed. When run without arguments, lapis launches the Lapis Command Center—providing real-time telemetry on engine status, compiler versions, git branch, and bridge DLL states. Developers can trigger instant single-key actions, fuzzy-search through all 30+ commands using the built-in Opal spotlight palette, and recover from mistyped commands via Levenshtein suggestions. Scaffolding new projects with lapis new leverages embedded templates to get playable games running in seconds.
