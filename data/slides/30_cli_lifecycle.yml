  items:
  - <strong>Interactive Command Center:</strong> Running <code>lapis</code> without arguments opens a real-time dashboard displaying engine health, git branch, and compiler statuses.
  - <strong>Single-Key Action Hub:</strong> Direct hotkey triggers for common developer workflows: <code>[B]</code> Build, <code>[T]</code> Test, <code>[D]</code> Doctor, <code>[E]</code> Editor, <code>[/]</code> Command Palette.
  - <strong>Zero-Config Scaffolding:</strong> <code>lapis init</code> scaffolds ready-to-run Godot projects with configured <code>shard.yml</code> and <code>project.godot</code> in milliseconds.
  - <strong>Embedded Baked Assets:</strong> CLI embeds starter templates, manifests, and bridge sources via <code>BakedFileSystem</code> for complete offline portability.
notes: |
  Developer tooling is the foundation of game programming speed. When run without arguments in an interactive terminal, lapis launches the Lapis Command Center—providing real-time telemetry on engine status, compiler versions, git branch, and bridge DLL states. Developers can trigger instant single-key builds, launch Godot with dynamic shadow hot-reloading, or run tests with a single stroke. Scaffolding new projects with lapis init leverages embedded templates to get playable games running in seconds.
