    # 1. Fluent Direct Space Raycast Builder:
    hit = raycast2d
      .to(target_pos)
      .exclude(self)
      .mask(0b0011)
      .query

    if hit
      spawn_sparks(hit.point, hit.normal)
      hit.collider.as?(Enemy).try(&.take_damage(25))
    end

