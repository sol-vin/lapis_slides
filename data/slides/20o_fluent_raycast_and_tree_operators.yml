  items:
    - '<strong>Fluent Raycast Builders:</strong> <code>raycast2d</code> and <code>raycast3d</code> provide fluent builders chaining <code>to</code>, <code>exclude</code>, <code>mask</code>, and <code>query</code> with typed <code>PhysicsHit</code> results.'
    - '<strong>Typed Context Spawning:</strong> <code>Node#spawn(T)</code> and <code>spawn_child(T)</code> allocate, parent, and evaluate configuration blocks directly in the receiver context with static typing.'
    - '<strong>CanvasItem Opacity &amp; Visibility:</strong> Direct <code>node.opacity = val</code>, <code>node.visible!</code>, and <code>node.hidden!</code> streamline rapid UI transitions without color structs.'
    - '<strong>Configured Scene Instantiation:</strong> <code>scene.instantiate_as(T)</code> accepts trailing blocks to configure newly instantiated nodes before mounting.'
    - '<strong>Dead-Pointer Guarded:</strong> All spatial queries and node allocations run through Lapis''s monotonic 64-bit instance checks.'
notes: |
  Building and manipulating scene trees in game engines often suffers from repetitive multi-step ceremony. In Lapis, our core engine bindings make gameplay construction fast, readable, and fluid.
  First, 'raycast2d' and 'raycast3d' introduce fluent builder pipelines on Node2D and Node3D. Instead of constructing raw query dictionaries or parameter objects, you fluently configure targets, exclusion lists, collision masks, and body/area flags before firing '.query' to receive a strongly-typed PhysicsHit struct.
  Second, 'Node#spawn' combines instantiation, parenting, and receiver-scoped configuration into a single typed expression.
  Third, CanvasItem gains direct opacity assignment and imperative visibility helpers ('visible!', 'hidden!'), while 'scene.instantiate_as(T)' supports inline configuration blocks for preloaded scenes.
