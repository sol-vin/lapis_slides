  - "<strong>Declarative @[RPC] Macros:</strong> Configure authority (<code>:any_peer</code>, <code>:authority</code>), transfer channels, and reliability with compile-time AST checking."
  - "<strong>Authoritative Server Pattern:</strong> High-performance server-side physics validation; runs headlessly in Mode B with zero rendering overhead."
  - "<strong>Zero-Alloc Struct Serialization:</strong> Pack packet payloads into immutable Crystal structs for low-bandwidth, low-latency UDP streams."
