right:
  type: card
  title: Portable Packaging Invariants
  color: teal
  items:
    - '<strong>Embedded PCK Binary (GDPC Magic):</strong> Injects the Godot PCK packfile directly into the executable using Godot''s 12-byte <code>GDPC</code> trailer. Players launch a single, unified <code>.exe</code> without external loose packfiles.'
    - '<strong>Turnkey Dependency Staging:</strong> Automatically collects and stages all required runtime shared libraries (<code>crystal_bridge.dll</code>, <code>gc.dll</code>, <code>pcre2-8.dll</code>) and GDExtension manifests with zero manual file hunting.'
    - '<strong>Zero-Toolchain Portable Zips:</strong> Strips foreign binaries, removes temporary caches and PDBs, and zips a self-contained, drop-in folder ready for Steam, itch.io, or offline flash-drive play.'
    - '<strong>Flexible Target & Platform Matrix:</strong> Supports cross-directory targets (<code>-p &lt;path&gt;</code>), custom release names (<code>-n &lt;name&gt;</code>), and target platforms (<code>windows</code>, <code>linux</code>, <code>macos</code>, <code>android</code>).'
notes: |
  Distributing a Godot game with native GDExtension libraries is traditionally tricky: you need the engine runner, the PCK packfile, GDExtension manifests, and every required C-runtime DLL like Boehm GC and the bridge. lapis package solves this in a single command. With lapis package game --portable, Lapis exports the game PCK, bundles all runtime dependencies, and even embeds the PCK directly into the executable binary using Godot's GDPC footer format. The result is a clean, portable executable or ready-to-ship zip archive that players can run anywhere—no installers, no missing DLL errors, and zero friction for Steam or itch.io releases.
