    code: |
      class HomingMissile : public Node3D {
          Enemy *locked_target = nullptr;
          ObjectID target_id;
      public:
          void _physics_process(double dt) override {
              // Target died last frame & called queue_free()!
              // 1. Freed heap -> 0xC0000005 ACCESS_VIOLATION!
              // 2. Or ABA bug: heap address reused by a new
              //    AudioStreamPlayer -> vtable corruption!
              locked_target->take_damage(50);

              // Must manually query ObjectDB on every frame:
              if (Object *o = ObjectDB::get_instance(target_id)) {
                  Object::cast_to<Enemy>(o)->take_damage(50);
              }
          }
      };
