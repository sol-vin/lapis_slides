gdscript:
  title: ':circle-xmark: Unshielded Native C++: Dangling Pointer Crashes'
  lang: cpp
  tag: Native C++
  code: |
    // Combat target acquired earlier in native C++:
    Ref<Enemy> target = get_node<Enemy>("Boss");

    void cast_spell(Ref<Spell> spell) {
        // Boss died from poison & called queue_free()!
        // Raw pointer still references dead C++ memory!
        target->take_damage(spell->get_power()); 
        // FATAL: 0xC0000005 ACCESS_VIOLATION segfault!
        // Instant crash to desktop with NO stack trace!

        // Defensive guard boilerplate required:
        if (target.is_valid() &&
            is_instance_valid(target.ptr())) {
            target->take_damage(spell->get_power());
        }
    }
  points:
  - <strong>Deallocated Native Memory:</strong> <code>queue_free()</code> frees native C++ memory; unshielded pointers retain dead memory addresses.
  - <strong>Fatal Engine Segfault:</strong> Dereferencing dead unmanaged pointers crashes immediately with <code>0xC0000005 ACCESS_VIOLATION</code>.
  - <strong>Defensive Clutter:</strong> Developers must litter code with <code>is_instance_valid</code> guards across every single scene access.
crystal:
  title: ':sparkles: Crystal: Monotonic ObjectDB & Dead-Pointer Armor'
  lang: crystal
  tag: Crystal (Lapis)
  code: |
    property target : Enemy?

    def cast_spell(spell : Spell) : Void
      # 1. Dead-Pointer Safe try? Invocation:
      # Evaluates only if target is alive in ObjectDB:
      @target.try?(&.take_damage(spell.power)) ||
        find_next_target

      # 2. Or Monotonic ID Check on Direct Dispatch:
      # Checks ObjectDB; raises DisposedObjectError:
      if enemy = @target
        enemy.take_damage(spell.power)
      end
    rescue ex : Godot::DisposedObjectError
      # Catchable! Retarget gracefully, zero segfaults:
      find_next_target
    end
  points:
  - <strong>Dead-Pointer Armor with <code>try?</code>:</strong> <code>@target.try?(&amp;.take_damage(...))</code> inspects ObjectDB survival, executing only on living nodes and returning <code>nil</code> on freed targets.
  - <strong>Monotonic 64-Bit Instance IDs:</strong> Godot ObjectDB IDs never collide with recycled heap addresses.
  - "<strong>Automatic #check_alive!:</strong> Lapis validates instance liveness before every method dispatch automatically."
  - <strong>Catchable Exceptions:</strong> Direct access on freed objects raises a catchable <code>DisposedObjectError</code> instead of segfaulting.
takeaway:
  badge: DEFENSIVE POINTER ARMOR
  text: Lapis checks Godot's 64-bit ObjectDB instance IDs before dispatch, converting native dead-pointer segfaults into catchable DisposedObjectError exceptions.
notes: |
  The single biggest source of hard crashes in Godot native bindings is dead-pointer dereferencing. When a node is freed by queue_free(), its underlying C++ memory is deallocated. If native code holds a raw pointer to that memory, dereferencing it triggers an uncatchable access violation that crashes the game instantly. In Lapis, every Godot::Object wrapper tracks its monotonic 64-bit instance ID. Before every dispatch, Lapis verifies this ID with Godot's ObjectDB. If the node was freed, it cleanly raises a DisposedObjectError with a full stack trace that you can catch and recover from gracefully.
