    code: |
      node HomingMissile < Node3D do
        property locked_target : Enemy?
        onready boss : Enemy = "%ArenaBoss"

        def _physics_process(delta : Float64) : Void
          # 1. .try? unwraps Nil AND verifies ObjectDB liveness:
          if target = @locked_target.try?
            steer_toward(target.global_position, delta)
          else
            @locked_target = acquire_next_target
          end

          # 2. One-liner dead-pointer-safe block call:
          @locked_target.try?(&.take_damage(50))

          # 3. onready & check_alive! raise catchable error:
          boss.take_damage(10)
        rescue ex : Godot::DisposedObjectError
          queue_free # Graceful recovery — zero segfaults!
        end
      end
