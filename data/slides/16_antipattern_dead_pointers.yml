gdscript:
  title: ':circle-xmark: Unshielded Native C++: Dangling Pointer Crashes'
  lang: cpp
  tag: Native C++
  code: |
    // Combat target Node* acquired earlier in godot-cpp:
    Enemy *target = get_node<Enemy>("Boss");
    ObjectID target_id = target->get_instance_id();

    void cast_spell(const Ref<Spell> &spell) {
        // Boss died from poison & called queue_free()!
        // Raw Enemy* still points to freed C++ memory:
        target->take_damage(spell->get_power());
        // FATAL: 0xC0000005 ACCESS_VIOLATION segfault!

        // Manual ObjectDB guard required before every call:
        if (ObjectDB::get_instance(target_id) != nullptr) {
            target->take_damage(spell->get_power());
        }
    }
  points:
  - <strong>Deallocated Native Memory:</strong> <code>Node</code> is not reference-counted; <code>queue_free()</code> deletes the C++ instance while raw <code>Enemy*</code> pointers remain dangling.
  - <strong>Fatal Engine Segfault:</strong> Dereferencing a freed <code>Node*</code> crashes immediately with <code>0xC0000005 ACCESS_VIOLATION</code> and no managed stack trace.
  - <strong>Manual ObjectID Tracking:</strong> C++ callers must manually store <code>ObjectID</code> and query <code>ObjectDB::get_instance(id)</code> before every dereference.
