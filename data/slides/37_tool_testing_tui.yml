  - <strong>Double-Buffered ANSI Interface:</strong> Real-time rolling metrics, execution
    phase tracking, and split-pane logs.
  - <strong>Interactive Inspection:</strong> Navigate phases with arrow keys; drill
    down into detailed logs with Enter.
  - <strong>Automated CI Fallback:</strong> Gracefully falls back to clean streaming
    text in automated CI pipelines (<code>NO_TUI=1</code>).
  - <strong>Editor Driver Integration:</strong> Launches headless Godot to test tool
    scripts and editor docks without opening a GUI.
notes: Running tests shouldn't be boring. When you run lapis test, it launches an
  interactive double-buffered ANSI TUI dashboard. You see live multi-phase progress,
  rolling logs with syntax coloring, and instant leak verification metrics. It makes
  continuous testing a genuinely satisfying part of the development loop.
