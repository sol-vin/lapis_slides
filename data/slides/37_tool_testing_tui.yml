  items:
  - <strong>Extensive 45+ Modular Suites:</strong> Validates 420+ specifications across 2D/3D physics, A* navigation, multiplayer RPCs, and headless tool scripts.
  - <strong>Double-Buffered Split-Pane UI:</strong> Zero-flicker ANSI terminal interface with rolling execution progress, active phase tracking, and live colored logs.
  - <strong>Interactive Drill-Down Inspection:</strong> Use keyboard navigation (<code>↑/↓/j/k</code>) to select any phase and press <code>Enter</code> for full test modal logs.
  - <strong>Automated CI Fallback:</strong> Seamlessly degrades to clean, unbuffered streaming log output in automated CI pipelines (<code>NO_TUI=1</code>).
notes: |
  With a test base exceeding 45 modular suites and 420 individual tests, plain terminal output quickly becomes overwhelming. Lapis features an interactive, double-buffered ANSI TUI dashboard launched via lapis test (or make test TUI=1). Developers get a split-pane view showing live multi-phase progress across core language bindings, headless in-editor tool tests, runtime suites, and deterministic zero-leak verification. You can navigate phases with arrow keys, inspect full logs in interactive modals with Enter, or run in headless CI mode with NO_TUI=1.
