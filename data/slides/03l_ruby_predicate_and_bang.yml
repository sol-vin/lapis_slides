  items:
    - '<strong>The Outsider''s Bafflement:</strong> In C, Java, Go, and Python, punctuation characters in identifiers are illegal syntax errors. In C# or Swift, <code>?</code> and <code>!</code> are reserved for nullability operators.'
    - '<strong>Eliminating Prefix Bikeshedding:</strong> Kills the eternal naming debates between <code>is_empty</code>, <code>has_items</code>, <code>check_alive</code>, and <code>should_spawn</code>. A question mark turns any word into an English question.'
    - '<strong>In-Place Mutation Flare:</strong> A developer scanning a pull request can instantly spot destructive mutations (<code>sort!</code>, <code>compact!</code>) versus harmless pure functions.'
    - '<strong>Dual Error Handling APIs:</strong> Elegant, idiomatic pairing between soft failure (<code>save</code> returns false) and strict assertion (<code>save!</code> raises an exception).'
    - '<strong>First-Class in Crystal:</strong> Crystal natively embraces <code>?</code> and <code>!</code> in method names, enforcing strict boolean return types on predicates at compile time.'
notes: |
  In almost every C-family language, identifiers are strictly restricted to alphanumeric characters and underscores: [a-zA-Z0-9_]. If you try to name a function 'alive?' in Java, C++, or Go, the compiler crashes with a syntax error. In modern languages like C# or Swift, question marks and exclamation points are reserved operators for optional chaining and force-unwrapping. Seeing them as part of a function's name looks utterly bizarre to outsiders.
  In Ruby, Matz realized that punctuation can convey profound semantic intent without bloating the vocabulary. Method names ending in a question mark are 'predicates': they ask a question and return a boolean. This single convention permanently eliminated thousands of hours of pointless bikeshedding over whether a function should be named 'is_alive', 'has_health', 'check_active', or 'get_is_alive'. It simply becomes 'player.alive?'.
  Even more powerful is the exclamation point, or 'bang' method. A bang method acts as a bright red safety flare signaling danger: it means 'this method mutates the receiver in place' (like sort! modifying the array rather than returning a copy), or 'this method raises an exception instead of returning false/nil' (like save!). When reviewing code, you can immediately identify every mutating or throwing call at a glance. Crystal fully embraces this convention, giving you expressive semantic punctuation that compiles directly to high-speed native code.
