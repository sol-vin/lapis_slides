  items:
    - '<strong>The Outsider''s Bafflement:</strong> In C, Java, Go, and Python, punctuation characters in identifiers are illegal syntax errors. In C# or Swift, <code>?</code> is reserved solely for nullability operators.'
    - '<strong>Eliminating Prefix Bikeshedding:</strong> Kills naming debates between <code>is_empty</code>, <code>has_items</code>, <code>check_alive</code>, and <code>should_spawn</code>. A question mark turns any word into an English question.'
    - '<strong>Nil Over Errors Guarantee (<code>some_method?</code>):</strong> In Ruby and Crystal, <code>?</code> systematically guarantees <strong>no error will be thrown</strong>. Methods like <code>first?</code>, <code>to_i?</code>, and <code>[]?</code> return <code>nil</code> instead of raising crashes!'
    - '<strong>In-Place Mutation Flare (<code>!</code>):</strong> A developer scanning a pull request can instantly spot destructive mutations (<code>sort!</code>, <code>normalize!</code>) versus harmless pure functions.'
    - '<strong>Dual Error Handling APIs:</strong> Elegant, idiomatic pairing between non-throwing nilable lookups (<code>find?</code>), soft boolean returns (<code>save</code>), and strict assertions (<code>save!</code>).'
    - '<strong>Crystal Compile-Time Nil Safety:</strong> Crystal enforces strict compile-time checks on <code>T | Nil</code> returns from <code>?</code> methods, making null pointer dereferences impossible.'
notes: |
  In almost every C-family language, identifiers are strictly restricted to alphanumeric characters and underscores: [a-zA-Z0-9_]. If you try to name a function 'alive?' in Java, C++, or Go, the compiler crashes with a syntax error. In modern languages like C# or Swift, question marks are compiler operators for optional types and safe navigation.
  In Ruby and Crystal, punctuation is elevated into a rich semantic communication tool. First, methods ending in '?' are 'predicates'—they ask a question and return a boolean. This single convention permanently eliminated thousands of hours of bikeshedding over whether a function should be named 'is_alive', 'has_health', 'check_active', or 'get_is_alive'.
  Second, and profoundly important: 'some_method?' implies nilability and guarantees that NO ERROR WILL BE THROWN! This embodies the beloved 'Nil over Errors' philosophy. In languages like Python or Java, looking up a missing key or parsing an invalid integer throws an exception ('KeyError', 'IndexOutOfBoundsException', 'ValueError'), forcing developers into bloated try/catch blocks for routine control flow. In Ruby and Crystal, 'items[99]?' and '"abc".to_i?' guarantee that no exception is raised—they simply return 'nil'! Callers can handle edge cases cleanly with nil checks or fallback operators (like 'val || default').
  Third, the exclamation point, or 'bang' method, acts as an unmissable safety flare: it signals in-place destructive mutation ('sort!' vs 'sort') or that the method raises an exception on failure ('save!' vs 'save'). Crystal preserves these exact conventions and enforces compile-time nil safety and boolean typing with zero runtime overhead.
