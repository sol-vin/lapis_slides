right:
  type: card
  title: Binary Auditor Capabilities
  color: cyan
  items:
  - <strong>Deep Static & Dynamic Analysis:</strong> Inspects PE/ELF/Mach-O headers, section alignments, export tables, and basic block graphs using radare2.
  - <strong>Visual Terminal Metrics Charts:</strong> <code>lapis analyze --chart</code> renders visual ASCII/ANSI distribution bars for <code>.text</code>, <code>.rdata</code>, and <code>.data</code> sections.
  - <strong>Automated Size Budget Enforcement:</strong> <code>--budget-check</code> acts as a strict CI gate, failing automated builds if binary size or section bloat exceeds defined thresholds.
  - <strong>Security & Strip Verification:</strong> Detects unstripped debug symbols, validates entry point invariants, and verifies compiler hardening flags (ASLR, DEP, SafeSEH).
notes: |
  Game developers need to guard against binary bloat and security regressions before shipping. With lapis analyze, developers gain deep insight into compiled DLLs and executables. The tool renders visual section charts directly in your terminal, audits basic block metrics, and allows you to enforce strict section size budgets in CI using lapis analyze --budget-check—ensuring zero unexpected dependency bloat in release builds.
