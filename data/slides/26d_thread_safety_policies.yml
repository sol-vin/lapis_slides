notes: |
  Godot's SceneTree is strictly single-threaded. Mutating node hierarchy off-thread corrupts internal child lists and causes unrecoverable ACCESS_VIOLATION crashes.
  Lapis solves this with our ThreadSafety guard. ThreadPolicy gives developers complete control: Raise for fail-fast debugging in development, Warn for non-fatal logging, Defer for automatic queueing, and Disabled for zero-cost release builds.
  ScopePolicy::TreeOnly is particularly powerful: it permits background worker threads to assemble large, detached orphan node hierarchies off-thread, such as procedurally generated dungeon rooms or terrain meshes.
  Once the graph is assembled, developers call Godot.on_main_thread to safely attach the finished hierarchy to the live SceneTree at the next frame boundary.
