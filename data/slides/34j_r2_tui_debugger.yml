  items:
  - <strong>7 Dedicated Inspection Tabs:</strong> Instant hotkeys for Disassembly (<code>pdf</code>), Pseudo-C (<code>pdc</code>), Crystal Source (<code>cl</code>), Registers (<code>dr</code>), Hex Memory (<code>px</code>), Call Stack (<code>dbt</code>), and Binary Metrics.
  - <strong>Opal HexViewer Integration:</strong> Deep raw memory inspection with ASCII sidebars, byte offsets, and live diff highlighting directly in the console.
  - <strong>Godot ObjectDB & Variant Forensics:</strong> <code>--object</code> dumps class hierarchies and 64-bit IDs; <code>--variant</code> decodes packed Variant memory layouts without engine crashes.
  - <strong>Zero-Dependency Native Execution:</strong> Runs completely inside the terminal via cradare2 without requiring heavy GUI debuggers, browser bridges, or remote debug servers.
notes: |
  The interactive Lapis Debugger TUI brings the full power of radare2 and cradare2 into a fluid, double-buffered terminal interface. Developers can navigate 7 specialized tabs—stepping through assembly side-by-side with pseudo-C, inspecting mapped Crystal source lines, monitoring live 64-bit CPU registers, navigating raw memory via Opal's HexViewer, and decoding Godot ObjectDB headers and Variant payloads directly from the command line.
