gdscript:
  title: ':circle-xmark: GDScript: Two-Step Preload & Untyped Load'
  lang: gdscript
  tag: GDScript
  font_size: '0.78rem'
  code: |
    func spawn_entities() -> void:
        # Pitfall 1: Preload returns generic PackedScene;
        # requires manual instantiate() + runtime casting
        const PlayerScene = preload("res://scenes/player.tscn")
        var player = PlayerScene.instantiate() as Player
        if not player:
            push_error("Failed cast to Player")
        add_child(player)

        # Pitfall 2: Dynamic load returns untyped Resource;
        # no caching, no type parameters, silent null failures
        var theme = load("res://assets/theme.tres") as Theme
        var sound = load("res://audio/jump.wav") as AudioStreamWAV
        var comp_scene = load("res://scenes/companion.tscn") as PackedScene
        var companion = comp_scene.instantiate() as Companion
        add_child(companion)
  points:
  - <strong>Two-Step Instantiation:</strong> Requires calling <code>preload(...)</code>, storing a <code>PackedScene</code>, and calling <code>.instantiate()</code> separately.
  - <strong>Unsafe Runtime Casting:</strong> Untyped <code>Resource</code> return requires <code>as Player</code> casting that fails silently if types diverge.
  - <strong>No Built-In Preload Cache:</strong> Dynamic <code>load()</code> hits the filesystem repeatedly unless developers hand-roll custom caching dictionaries.
crystal:
  title: ':sparkles: Crystal: Inferred load, preload & instantiate_as'
  lang: crystal
  tag: Crystal (Lapis)
  font_size: '0.78rem'
  code: |
    def spawn_entities : Void
      # 1. Type-Safe Scene Instantiation via instantiate_as:
      player_scene = preload("res://scenes/player.tscn")
      player = player_scene.instantiate_as(Player) # Concrete Player node!
      add_child(player)

      # 2. Compile-Time Extension Inferred load & preload:
      scene = load("res://scenes/companion.tscn")    # Inferred -> PackedScene
      companion = scene.instantiate_as(Companion)
      add_child(companion)

      icon  = preload("res://assets/icon.svg")       # Inferred -> Texture2D
      sound = load("res://audio/jump.wav")           # Inferred -> AudioStream

      # 3. Explicit typing with native .as / .as? & nilable variants:
      combat = load("res://data/combat.tres").as(CombatConfig)
      opt_config = load?("res://data/optional.tres").as?(CombatConfig)
    end
  points:
  - <strong>Type-Safe <code>instantiate_as(T)</code>:</strong> Unpacks and verifies the instantiated node type against ClassDB, eliminating silent runtime casting bugs.
  - <strong>Extension Type Inference:</strong> <code>load(&quot;res://...&quot;)</code> and <code>preload(&quot;res://...&quot;)</code> automatically deduce PackedScene (.tscn), Texture2D (.svg/.png), or AudioStream (.wav/.ogg) at compile time!
  - <strong>Native Casting (<code>.as</code> &amp; <code>.as?</code>):</strong> Standard Crystal downcasting replaces verbose <code>as:</code> arguments; use <code>load?</code> / <code>preload?</code> for safe, exception-free loading.
  - <strong>Thread-Safe Cache:</strong> <code>PreloadCache</code> and <code>preload(...)</code> use mutex synchronization to prevent race conditions during background loading.
takeaway:
  badge: ASSET ERGONOMICS
  text: Lapis extension-inferred load and preload macros alongside type-safe instantiate_as turn asset loading and scene instantiation into clean, compile-time verified operations.
notes: |
  Every Godot developer knows the repetitive ceremony of loading scenes: const Scene = preload(...), then var instance = Scene.instantiate() as Type. It's multi-step, untyped, and clutters gameplay scripts.
  In Lapis, our core engine bindings provide compile-time type-inferred macros and type-safe instantiation. Calling 'scene.instantiate_as(Player)' instantiates and returns a statically typed Player node with zero casting boilerplate.
  Furthermore, our top-level 'load' and 'preload' macros inspect file extensions at compile time—automatically deducing PackedScene for .tscn, Texture2D for .png/.svg, and AudioStream for audio files. When paired with native Crystal '.as' and '.as?', loading and instantiation are seamless and 100% type-safe.
