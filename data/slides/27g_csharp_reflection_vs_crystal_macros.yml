  font_size: '0.82rem'
  code: |
    public partial class NetworkSync : Node
    {
        // Runtime reflection: 10-100x slower, boxes args, and stripped by AOT!
        public void DispatchRPC(string methodName, params object[] args)
        {
            var flags = BindingFlags.Public | BindingFlags.Instance | BindingFlags.NonPublic;
            MethodInfo? method = GetType().GetMethod(methodName, flags);
            if (method == null) throw new MissingMethodException(methodName);

            // Allocates object[] and boxes value types on every packet!
            method.Invoke(this, args);
        }
        // Alternative Roslyn generators require separate .csproj, analyzers & MSBuild plumbing.
    }
  points:
    - '<strong>Runtime Reflection Tax:</strong> <code>method.Invoke()</code> is 10–100x slower than direct calls and forces dynamic string lookups on every packet.'
    - '<strong>Argument Boxing Penalties:</strong> Passing primitives through reflection boxes <code>int</code>, <code>float</code>, and <code>Vector3</code> into heap objects.'
    - '<strong>Roslyn Tooling Agony:</strong> Compile-time generators require separate analyzer projects, complex AST dependencies, and constant IDE desyncs.'
crystal:
  title: ':sparkles: Crystal: First-Class Compile-Time AST Macros'
  lang: crystal
  tag: Crystal (Lapis)
  card_title: Crystal Zen Advantages
  font_size: '0.82rem'
  code: |
    node NetworkSync < Node do
      # Compile-time AST macro generates static dispatch without reflection tables
      macro generate_rpc_dispatcher(*methods)
        def dispatch_rpc(action : String, packet : Packet) : Nil
          case action
          {% for method in methods %}
          when {{ method.stringify }}
            {{ method.id }}(packet.read_{{ method.id }}_payload) # Static dispatch!
          {% end %}
          else raise "Unknown RPC: #{action}"
          end
        end
      end

      generate_rpc_dispatcher sync_transform, player_spawn, player_hit
    end
  points:
    - '<strong>Built-In Language Macros:</strong> AST macros are native language primitives requiring zero extra projects, analyzers, or compiler plugins.'
    - '<strong>Compile-Time Static Dispatch:</strong> Expands into direct static <code>case</code> branches with typed arguments—zero runtime reflection overhead.'
    - '<strong>Whole-Program Type Inference:</strong> Full compile-time type validation with no metadata tables, no trimming hazards, and no boxing.'
takeaway:
  badge: COMPILE-TIME METAPROGRAMMING
  text: 'Crystal macros bring full compile-time metaprogramming and reflection without the tooling agony or runtime reflection tax of C#.'
notes: |
  In C#, developers are trapped in an uncomfortable dilemma: either use `System.Reflection` at runtime—which is painfully slow, boxes every primitive argument, and crashes when NativeAOT trimming strips metadata—or write a Roslyn Source Generator. But Roslyn generators require an entire separate C# analyzer project, complex syntax tree parsing, and fragile MSBuild plumbing that constantly causes IDE red squiggles. In Crystal, macros are a first-class language feature. You write expressive metaprogramming logic directly inside your codebase using Crystal syntax. Macros inspect types, loop over properties, and generate type-safe dispatchers at compile time, leaving behind zero runtime reflection tables and zero boxing.
