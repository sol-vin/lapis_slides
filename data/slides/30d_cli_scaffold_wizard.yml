  items:
  - <strong>Interactive Guided Wizard (<code>lapis cli -n</code>):</strong> Interactive step-by-step configurator walks developers through project type selection, metadata specification, directory picking, and instant validation.
  - <strong>Direct Scriptable Scaffolding:</strong> CLI commands (<code>lapis scaffold game &lt;name&gt;</code>, <code>lapis scaffold addon &lt;name&gt;</code>) allow instant zero-interaction scaffolding for CI pipelines and scripts.
  - <strong>Turnkey Production Layout:</strong> Generates complete, runnable architectures including <code>project.godot</code>, <code>shard.yml</code>, <code>src/main.cr</code>, default scenes, scripts, and build tasks.
  - <strong>Addon Isolation Safety:</strong> Automatically structures addons with isolated <code>.gdextension</code> manifests, ClassDB namespace protection, and packaging configurations.
notes: |
  Starting a new project shouldn't require copy-pasting boilerplate or manually configuring build scripts. The Lapis CLI provides both a guided interactive wizard (lapis cli -n) and direct command-line scaffolding (lapis scaffold). Whether creating a full-featured standalone game, a redistributable GDExtension addon, or a self-contained showcase example, Lapis generates a clean, turnkey project structure with pre-configured Crystal shards, engine manifests, and automated hot-reloading hooks ready for development.
