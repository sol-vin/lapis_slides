    color: purple
    badge: 'EPHEMERAL'
    items:
      - '<strong>Zero Heap Overhead:</strong> Blocks are passed implicitly without allocating heap Proc objects.'
      - '<strong>Ephemeral Control Flow:</strong> Invoked directly with <code>yield</code> in the method body.'
      - '<strong>Natural Enumerable Chaining:</strong> Powers idiomatic Ruby loops: <code>[1, 2].each { |n| ... }</code>.'
      - '<strong>The Ampersand Bridge:</strong> <code>&block</code> reifies a block into a Proc object when needed.'
  - type: card
    title: '2. Procs (Proc.new)'
    color: cyan
    badge: 'PERMISSIVE'
    items:
      - '<strong>First-Class Objects:</strong> Reified callable instances instantiated via <code>Proc.new</code>.'
      - '<strong>Permissive Arity:</strong> Missing arguments default to <code>nil</code> with zero runtime argument errors.'
      - '<strong>Enclosing Method Return:</strong> Calling <code>return</code> inside a Proc exits the enclosing method scope.'
      - '<strong>Callable Dispatch:</strong> Invoked explicitly via <code>p.call(args)</code> or bracket syntax <code>p[args]</code>.'
