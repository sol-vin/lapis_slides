  color: purple
  items:
    - '<strong>Blocks & Yield (Ephemeral):</strong> Blocks (<code>do..end</code> or <code>{..}</code>) are passed implicitly to methods and invoked with <code>yield</code>, avoiding heap object allocation overhead.'
    - '<strong>Procs (Permissive Objects):</strong> Created via <code>Proc.new</code>. Treats arguments permissively (missing become <code>nil</code>) and a <code>return</code> exits the enclosing method scope.'
    - '<strong>Lambdas (Strict Anonymous Methods):</strong> Created via <code>-&gt;(x) { ... }</code>. Enforces exact argument counts (raises <code>ArgumentError</code>) and <code>return</code> exits only the lambda.'
    - '<strong>Method-to-Callable Cleanliness:</strong> Turn methods into first-class callables via <code>method(:name)</code> or clean lambda forwarders (<code>-&gt;(x) { name(x) }</code>).'
    - '<strong>The Ampersand Bridge (<code>&amp;</code>):</strong> Converts ephemeral blocks into reified Procs in method signatures (<code>&amp;blk</code>), and unpacks Procs back into blocks for method calls (<code>&amp;proc</code>).'
notes: |
  Closures are the beating heart of Ruby and Crystal. Ruby provides three distinct tiers of closures. At the lightest level are blocks—ephemeral code chunks passed implicitly and triggered with yield. They power iteration and resource-scoping patterns without allocating heap objects. When you need closures as first-class citizens that you can store in variables or pass around, you have Procs and Lambdas. Procs are lenient: they don't care if you pass too few or too many arguments, and returning from a Proc returns from the enclosing method. Lambdas, on the other hand, behave like true anonymous methods: they strictly enforce parameter counts and their return statements only exit the lambda itself. The ampersand operator acts as the bidirectional bridge between blocks and Procs. Crystal preserves this exact block-and-proc elegance, while adding compile-time static types and LLVM optimization.
