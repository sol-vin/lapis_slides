  items:
  - <strong>Universal Variant Marshalling:</strong> Automatically marshals numbers, strings, vectors, and arrays between Crystal and GDScript.
  - <strong>Reflection Inspection:</strong> <code>has_method("name")</code> checks method presence at runtime before dispatching.
  - <strong>Automated Bindings Generator:</strong> Lapis automatically parses <code>extension_api.json</code> and GDScript ASTs to generate typed wrappers with zero manual glue code.
  - <strong>Dead-Pointer Protected:</strong> Dynamic dispatches validate node liveness via <code>#check_alive!</code> before invoking.
notes: |
  What about calling GDScript from Crystal? Lapis provides both flexible dynamic dispatch via .call, .get, and .set, and an automated bindings generator. Lapis inspects Godot's extension_api.json and GDScript reflection to synthesize typed Crystal wrappers with zero manual C-API boilerplate. Arguments are marshalled transparently through Godot's Variant type, and every invocation is guarded by our monotonic 64-bit instance ID check.
