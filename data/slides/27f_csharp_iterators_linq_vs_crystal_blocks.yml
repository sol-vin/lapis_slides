  card_title: C# LINQ & Iterator Anti-Patterns
  code: |
    using Godot;
    using System.Collections.Generic;
    using System.Linq;

    public partial class EnemyRadar : Node3D
    {
        [Export] public float ScanRadius { get; set; } = 500.0f;

        // LINQ in a 60 FPS physics tick produces continuous GC allocations!
        public List<Enemy> FindPrioritizedTargets(Vector3 origin)
        {
            // 1. GetChildren() returns Godot.Collections.Array interop wrapper
            // 2. OfType<T>() allocates an OfTypeIterator<T> state machine on heap
            // 3. Where(...) allocates a Func<Enemy, bool> closure display class
            // 4. OrderBy(...) allocates a SortingSelector and multiple arrays
            // 5. ToList() allocates a List<Enemy> buffer on the managed heap
            return GetChildren()
                .OfType<Enemy>()
                .Where(e => e.IsAlive && e.GlobalPosition.DistanceTo(origin) <= ScanRadius)
                .OrderBy(e => e.GlobalPosition.DistanceSquaredTo(origin))
                .Take(5)
                .ToList(); // Multiple heap allocations EVERY frame!
        }
    }
  points:
  - <strong>Hidden Heap Allocations in Hot Loops:</strong> LINQ convenience operators (<code>Where</code>, <code>Select</code>, <code>OrderBy</code>) instantiate delegate closures (<code>Func&lt;T, bool&gt;</code>) and display classes on the managed heap every invocation.
  - <strong>IEnumerator State Machine Rigmarole:</strong> Custom iterators and LINQ operators generate hidden nested classes with <code>switch(state)</code> state machines and heap allocations per call.
  - <strong>Virtual Interface Dispatch Overhead:</strong> Iterating via <code>IEnumerable&lt;T&gt;</code> forces virtual <code>.MoveNext()</code> and <code>.Current</code> calls every step, defeating CPU branch prediction and loop vectorization.
  - <strong>Interop Collection Boxing:</strong> Converting Godot's loosely-typed <code>Array</code> via <code>.OfType&lt;T&gt;()</code> incurs runtime type-check penalties and boxed Variant conversions.
crystal:
  title: ':sparkles: Crystal: Zero-Cost Inlined Blocks & Pure Value Iterators'
  lang: crystal
  tag: Crystal (Lapis)
  card_title: Crystal Zen Advantages
  code: |
    node EnemyRadar < Node3D do
      @export @scan_radius : Float32 = 500.0_f32

      # Zero allocations! Inlined blocks compile directly to vectorized LLVM loops
      def prioritized_targets(origin : Vector3) : Array(Enemy)
        # 1. Direct typed child iteration with zero intermediate wrappers
        # 2. Block predicates are inlined at the callsite (no closure objects!)
        # 3. No IEnumerator or state machine on the heap
        children(as: Enemy)
          .select { |e| e.alive? && e.global_position.distance_to(origin) <= @scan_radius }
          .sort_by! { |e| e.global_position.distance_squared_to(origin) }
          .first(5)
      end
    end
  points:
  - <strong>Inlined Blocks with Zero Allocation:</strong> Crystal blocks (<code>each</code>, <code>select</code>, <code>map</code>) are inlined directly at the callsite by LLVM with zero heap allocations, zero closures, and zero GC churn.
  - <strong>Safe for 60/144 FPS Game Loops:</strong> Filter, sort, and transform collections inside <code>_physics_process</code> without allocating a single byte on the heap.
  - <strong>Value-Type Iterator Pipelines:</strong> First-class <code>Iterator(T)</code> allows lazy, composable chaining with stack allocation and full compiler optimizations.
  - <strong>Direct Native Collection Access:</strong> Direct typed traversal over node children (<code>children(as: Enemy)</code>) without boxing or reflection.
takeaway:
