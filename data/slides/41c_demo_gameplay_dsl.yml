notes: |
  In Part 3 of our demo, we explore first-class in-editor features.
  First, script editing: we author a player controller script using Crystal's clean Lapis DSL.
  Notice how readable this is: we declare an exported speed property with a range slider, and Godot immediately surfaces it in the Inspector dock for level designers to tweak in real time.
  Second, running the game: we press F5 directly inside the Godot editor.
  Unlike standard C++ or Rust GDExtension workflows where Windows locks the DLL and forces you to quit Godot, Lapis compiles a timestamped shadow DLL and loads it in 0.38s with zero file locks.
  You get the speed of compiled native code with the iteration loop of GDScript!
