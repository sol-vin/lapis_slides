    # 1. Author and edit gameplay script in editor:
    node PlayerController < CharacterBody3D do
      @[Export(range: 1.0_f32..25.0_f32, step: 0.5_f32)]
      property speed : Float32 = 14.0_f32

      def _physics_process(delta : Float64) : Void
        dir = Input.get_vector("left", "right", "up", "down")
        self.velocity = Vector3.new(dir.x * speed, 0.0, dir.y * speed)
        move_and_slide
      end
    end

    # 2. Press F5 in Godot to Run Project:
    # [Editor] Shadow DLL loaded: game_9102.dll
    # [OK] Recompiled & launched in 0.38s (0 file locks)!
