  items:
  - <strong>Interactive HTML Reports:</strong> Generates self-contained, responsive HTML benchmark dashboards with interactive filters, search, and iteration timelines.
  - <strong>Vector SVG Comparison Charts:</strong> Simultaneously renders crisp, resolution-independent SVG bar charts suitable for direct embedding in docs or presentations.
  - <strong>XML Historical Progression:</strong> Stores structured benchmark results in an XML history log (<code>history.xml</code>) to track performance across commits and engine upgrades.
  - <strong>Automated CI Performance Gating:</strong> Enforces automated thresholds in GitHub Actions (fails build if throughput drops > 5%), preventing silent gameplay regressions.
notes: |
  Performance benchmarking is not a one-time exercise; it requires continuous verification. With lapis benchmarks compare html, developers and CI pipelines automatically track execution times across Godot releases. The tool produces interactive HTML reports, embeds vector SVG charts, and updates an XML history database. If a pull request causes a performance regression beyond 5%, the automated CI gate immediately flags the issue before it reaches production.
