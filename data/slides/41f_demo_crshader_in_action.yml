  items:
    - '<strong>Direct Crystal-to-GPU Uniforms:</strong> <code>shield_mat.set_uniform</code> writes float/vector values directly into shader uniform buffers without dictionary boxing.'
    - '<strong>Dynamic Material Synthesis:</strong> <code>CrShader.material</code> compiles and constructs GPU materials on the fly with declarative Crystal blocks.'
    - '<strong>Reactive Gameplay FX:</strong> Player health changes from <code>Damageable</code> immediately drive shield color distortion and glitch pulses in real time.'
