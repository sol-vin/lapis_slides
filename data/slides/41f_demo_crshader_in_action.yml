notes: |
  In the grand finale of our live demonstration, we open the hood on Soulantern—a complete, production-grade game rebuilt in pure Crystal using Lapis.
  Running `lapis run --project=soulantern --showcase` loads a complex multi-scene world with over a thousand active nodes, dynamic lighting, custom shaders, and enemy state machines.
  Notice the real-time telemetry: locked 60 frames per second, sub-millisecond physics ticks, and zero GC pause latency.
  In games written with GDScript or C#, garbage collection pauses can cause perceptible micro-stutters and frame pacing drops during combat.
  Crystal's stack allocation and LLVM-optimized machine code eliminate that bottleneck completely.
  Lapis proves that you don't have to compromise between developer happiness and extreme runtime performance!
