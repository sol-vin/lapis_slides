    - '<strong>Zero Heap Allocation Per Frame:</strong> Uniform dispatches use direct native GDExtension pointers, ensuring zero GC pressure in <code>_process</code>.'
notes: |
  In Part 4, we showcase what CrShader can do inside our game.
  We create an EnergyShield node that mixes in our Damageable trait. Using CrShader.material, we synthesize an animated plasma shield material right in Crystal.
  Look at _process: every single frame, we calculate a pulse oscillation and a damage ratio, and we push them straight into the GPU shader uniforms—with zero dictionary allocations and zero string hashing.
  When the player takes damage, the shield visibly distorts, reddens, and pulses more rapidly.
  Because this runs in real time in Godot, level designers can adjust the pulse_speed slider in the Inspector dock and see the shader respond immediately in the editor viewport!
