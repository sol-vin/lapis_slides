  items:
    - '<strong>Frictionless Engine Dictionaries:</strong> <code>Godot::Dictionary.new(**kwargs)</code> allows keyword initialization, transparent Symbol key indexing (<code>dict[:key]</code>), and generic typed getters.'
    - '<strong>Nested Dictionary Drilling:</strong> <code>dict.dig?(:stats, :attack, :base, as: Int32)</code> navigates nested Variant dictionaries safely without intermediate nil checks.'
    - '<strong>Typed Array Filtering &amp; Sampling:</strong> <code>GodotArray#filter_as(T)</code> downcasts elements to <code>Array(T)</code>; paired with <code>sample</code>, <code>first?</code>, <code>last?</code>, and negative indexing (<code>arr[-1]</code>).'
    - '<strong>Modular Math Extensions (<code>lapis/math</code>):</strong> <code>Number#approach</code> for non-overshooting interpolation, <code>Number#degrees</code>/<code>radians</code>, and <code>Vector2/Vector3.random_dir</code>.'
    - '<strong>Zero-Allocation State Machines (<code>lapis/fsm</code>):</strong> Compile-time FSM DSL generating inlined lifecycle hooks and jump-table transitions with zero runtime heap churn.'
notes: |
  Handling engine collections and gameplay utilities in native bindings often requires frustrating boilerplate. In Lapis, Godot::Dictionary feels like a native Crystal Hash: it can be initialized with keyword arguments, indexed transparently with Symbols, and queried with safe typed getters. Furthermore, dict.dig? lets you drill down through nested dictionaries without defensive nil checks at every level.
  GodotArray is equally ergonomic, providing typed filtering with filter_as(Enemy) and bounds-safe utilities like sample and negative indexing.
  Finally, Lapis provides optional standalone modules that can be included anywhere: 'require "lapis/math"' provides essential gameplay mathematics like non-overshooting value approach and uniform spherical random vectors, while 'require "lapis/fsm"' delivers an ultra-fast, zero-allocation finite state machine DSL.
