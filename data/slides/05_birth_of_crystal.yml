  title: The Compiler Synthesis
  color: cyan
  items:
  - <strong>Designed from Day One for Types:</strong> Crystal wasn't a dynamic language
    patched with types; it was built from scratch as a statically typed language.
  - <strong>Global Type Inference:</strong> You rarely write type annotations for
    local variables. The compiler analyzes the entire program flow and infers concrete
    types.
  - '<strong>LLVM Native Backend:</strong> Crystal emits LLVM IR, benefiting from
    decades of optimization: autovectorization, link-time optimization (LTO), and
    register allocation.'
  - <strong>Static Nil Safety:</strong> Null pointer dereferences are caught at compile
    time. <code>T</code> cannot be nil; only <code>T?</code> can, forcing explicit
    compiler-checked handling.
  - <strong>Direct C ABI Interop:</strong> Seamless bindings to native C libraries
    without JNI or FFI marshalling penalties.
notes: 'In 2011, Ary Borenszweig and the Crystal core team set out to solve this exact
  dilemma. Instead of bolting types onto a dynamic runtime, they built a new language
  from the ground up: syntax as slick and human as Ruby, but statically typed with
  a global type inference engine and an LLVM native compiler backend. Crystal gives
  you the developer experience of a high-level scripting language, but compiles straight
  to bare-metal machine code with zero VM overhead, complete static nil safety, and
  direct C ABI compatibility.'
