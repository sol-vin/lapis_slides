  - <strong>Crystalline LSP Integration:</strong> Automatically configures the Crystalline language server daemon with background compilation, symbol indexing, and hover signatures.
  - <strong>Multi-Editor Parity:</strong> Supports modern editor ecosystems: VS Code, Cursor, Zed, and Neovim with identical build tasks and LSP settings.
  - <strong>Automated Gutter Debugging:</strong> Emits ready-to-run debugger configurations in <code>launch.json</code> or Neovim DAP that connect directly to radare2.
  - <strong>Zero Manual Boilerplate:</strong> Eliminates manual JSON/Lua editing when onboarding new team members—run <code>lapis ide setup</code> and start coding immediately.
notes: |
