gdscript:
  title: ':circle-xmark: GDScript: Unchecked .emit() & Manual Type Guards'
  lang: gdscript
  tag: GDScript
  code: |
    extends Node2D
    signal health_changed(current: int, max: int)

    func _ready() -> void:
        # 1. Requires wiring separate callback methods or untyped lambdas
        $StartButton.pressed.connect(_on_start_button_pressed)
        $Area2D.body_entered.connect(_on_body_entered)

        # 2. Signal.emit() is variadic Variant — wrong types compile silently!
        health_changed.emit("wrong_type", 100) # Runtime bug, no compiler error!

    func _on_body_entered(body: Node2D) -> void:
        # 3. Manual runtime type guard & cast required in every callback
        if body is Player:
            (body as Player).collect_coin()
  points:
  - '<strong>Unchecked Variadic <code>.emit()</code>:</strong> Even in Godot 4, <code>Signal.emit()</code> accepts arbitrary <code>Variant</code> varargs—wrong argument counts or types fail only at runtime.'
  - '<strong>Manual Type-Guard Boilerplate:</strong> Physics and UI callbacks require repetitive <code>if body is Player:</code> checks and casts instead of declarative type filtering.'
  - '<strong>Callback Sprawl:</strong> Splits event wiring in <code>_ready()</code> from handler bodies scattered across the bottom of the script.'
crystal:
  title: ':sparkles: Crystal: Declarative on Macro, Type Filters & emit'
  lang: crystal
  tag: Crystal (Lapis)
  font_size: '0.80rem'
  code: |
    def _ready : Void
      # 1. Declarative 'on' with first-class typed signal
      on start_button.pressed do
        start_game_sequence
      end

      # 2. Positional type-filtering & auto-downcasting (zero .as(T)!)
      on area.body_entered, Player do |player|
        player.collect_coin
      end

      # 3. Clean unsubscription via returned subscription handle
      sub = on player.died do
        trigger_game_over
      end
      sub.disconnect # Clean, explicit unsubscription

      # 4. Type-safe emission & mass disconnection
      emit(player.health_changed, 75, 100)
      start_button.pressed.disconnect_all
    end
  points:
  - <strong>Declarative <code>on</code> Sugar:</strong> Connects blocks directly to signals (<code>on start_button.pressed { ... }</code>) with zero single-use handler boilerplate.
  - <strong>Positional Type Filtering:</strong> <code>on area.body_entered, Player do |player|</code> filters signal arguments by concrete class and automatically downcasts.
  - <strong>Deterministic Lifecycle:</strong> Returned <code>SignalSubscription</code> allows clean unsubscription via <code>sub.disconnect</code> without managing strings.
  - <strong>Type-Safe <code>emit</code> Macro:</strong> <code>emit(player.health_changed, 75, 100)</code> verifies argument types and counts at compile time with zero string hashing.
takeaway:
  badge: DECLARATIVE REACTIVE ERGONOMICS
  text: Lapis's on macro eliminates boilerplate handler sprawl, letting you wire reactive gameplay events directly with typed closures, positional filtering, and auto-downcasting.
notes: |
  In GDScript, connecting signals is notoriously verbose. For every single button press, trigger zone, or event, you must define a separate named method like _on_start_button_pressed or pass string callback names to Callable.
  Lapis introduces the declarative 'on' macro. You can connect inline closures directly to first-class typed signals, or use positional type-filtering like 'on area.body_entered, Player do |player|' which filters out non-player bodies and passes an automatically downcasted Player instance with zero manual casting.
  Subscriptions track 64-bit ObjectDB instance IDs and self-prune automatically when targets are freed. Paired with our type-safe 'emit' macro and 'disconnect_all', reactive gameplay in Lapis combines Ruby-like zen ergonomics with full LLVM compile-time verification.
