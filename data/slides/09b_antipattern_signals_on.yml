gdscript:
  title: ':circle-xmark: GDScript: Method Sprawl & Callable Boilerplate'
  lang: gdscript
  tag: GDScript
  font_size: '0.82rem'
  code: |
    func _ready() -> void:
        # Pitfall 1: Clunky named method wiring for every interaction
        $StartButton.pressed.connect(_on_start_button_pressed)
        
        # Pitfall 2: Verbose Callable wrapping for dynamic callbacks
        $Enemy.connect("died", Callable(self, "_on_enemy_died"))
        
        # Pitfall 3: Stringly-typed emit lacks compile-time argument checks
        emit_signal("health_changed", 75, 100)

    func _on_start_button_pressed() -> void:
        start_game_sequence()

    func _on_enemy_died(bounty: int) -> void:
        add_score(bounty)
  points:
  - <strong>Method Sprawl:</strong> Every connected signal requires creating a separate single-use handler function (<code>_on_button_pressed</code>).
  - <strong>Callable Verbosity:</strong> Dynamic connections require wrapping receivers in <code>Callable(self, "_on_...")</code>.
  - <strong>Untyped String Emission:</strong> <code>emit_signal("...")</code> provides zero compile-time signature verification.
crystal:
  title: ':sparkles: Crystal: Declarative on Macro & Type-Safe emit'
  lang: crystal
  tag: Crystal (Lapis)
  font_size: '0.82rem'
  code: |
    def _ready : Void
      # 1. Declarative 'on' with first-class typed signal
      on start_button.pressed do
        start_game_sequence
      end

      # 2. Typed signal with block arguments — zero strings!
      on enemy.died do |bounty|
        add_score(bounty)
      end

      # 3. Type-safe emission macro (expands to typed emitter)
      emit(player.health_changed, 75, 100)
      emit(player.renamed)
    end
  points:
  - <strong>Declarative <code>on</code> Sugar:</strong> Connects blocks directly to signals (<code>on start_button.pressed { ... }</code>) with zero single-use handler boilerplate.
  - <strong>Pure Typed Signals (No Strings):</strong> <code>on enemy.died { |bounty| ... }</code> provides 100% compile-time signal validation and typed block arguments.
  - <strong>Type-Safe <code>emit</code> Macro:</strong> <code>emit(player.health_changed, 75, 100)</code> verifies argument types and counts at compile time.
  - <strong>Zero Allocation Overhead:</strong> Compiles down to direct static dispatch without runtime string lookups or dictionary hashing.
takeaway:
  badge: DECLARATIVE ERGONOMICS
  text: Lapis's on macro eliminates boilerplate handler sprawl, letting you wire reactive gameplay events directly with typed inline closures.
notes: |
  In GDScript, connecting signals is notoriously verbose. For every single button press, trigger zone, or event, you must define a separate named method like _on_start_button_pressed or pass string callback names to Callable. This litters scripts with tiny single-use methods and disconnects the logic from where the event is wired.
  Lapis introduces the declarative 'on' macro. You can connect inline closures directly to first-class typed signals like 'on start_button.pressed { start_game }' or 'on enemy.died { |bounty| add_score(bounty) }' with zero string lookups. Paired with our type-safe 'emit' macro, signals in Lapis combine Ruby-like zen ergonomics with full LLVM compile-time parameter verification.
