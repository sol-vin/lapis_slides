  font_size: '0.84rem'
  code: |
    public partial class PlayerController : CharacterBody3D
    {
        // Verbose property ceremony: attribute + public + explicit get/set
        [Export] public float Speed { get; set; } = 300.0f;
        [Export] public int MaxHealth { get; set; } = 100;

        // Signal declaration requires separate dummy delegate:
        [Signal]
        public delegate void HealthChangedEventHandler(int cur, int max);

        public int Heal(int amount)
        {
            _health = Math.Clamp(_health + amount, 0, MaxHealth);
            EmitSignal(SignalName.HealthChanged, _health, MaxHealth);
            return _health;
        }
    }
  points:
    - '<strong>Mandatory Partial Boilerplate:</strong> Forces every node to be declared <code>public partial class</code> for Roslyn generators.'
    - '<strong>Dummy Signal Delegates:</strong> Defining a signal requires declaring an auxiliary <code>delegate</code> with an <code>EventHandler</code> suffix.'
    - '<strong>String-Based Signal Names:</strong> Signal emission relies on generated static classes (<code>SignalName.HealthChanged</code>) and boxed parameters.'
crystal:
  title: ':sparkles: Crystal / Lapis: Expressive, Zero-Noise Declarations'
  lang: crystal
  tag: Crystal (Lapis)
  font_size: '0.84rem'
  code: |
    node PlayerController < CharacterBody3D do
      @[Export]
      property speed : Float32 = 300.0_f32
      @[Export]
      property max_health : Int32 = 100

      signal health_changed(current : Int32, max : Int32)

      def heal(amount : Int32) : Int32
        @health = (@health + amount).clamp(0, @max_health)
        emit(health_changed, @health, @max_health)
        @health
      end
    end
  points:
    - '<strong>Zero-Ceremony Declarations:</strong> Clean <code>node PlayerController &lt; CharacterBody3D</code> blocks with zero partial class boilerplate.'
    - '<strong>First-Class Signal DSL:</strong> <code>signal name(...)</code> automatically synthesizes type-safe <code>emit(name, ...)</code> methods.'
    - '<strong>Direct ClassDB Exports:</strong> <code>@[Export]</code> registers properties directly into the Godot inspector with zero getter/setter noise.'
takeaway:
  badge: CONCISE DECLARATIONS
  text: Crystal strips away C#'s enterprise ceremony and attribute bloat, delivering clean declarative elegance backed by native GDExtension performance.
notes: |
  Comparing Godot C# to Lapis reveals a massive gulf in developer ergonomics. In C#, every single node requires `using Godot; using System;`, `public partial class` boilerplate for source generators, and verbose `[Export] public float Speed { get; set; }` properties. Even worse, declaring a signal in C# requires writing a dummy `delegate` with an `EventHandler` suffix, and emitting it involves static constants like `SignalName.HealthChanged`. In Lapis, you write pure, expressive Crystal: `node PlayerController < CharacterBody3D do`, `@[Export] property speed : Float32 = 300.0_f32`, and `signal health_changed(...)` which automatically generates type-safe emit methods. You write concise code with minimal boilerplate.
