    node CombatRadar < Node2D do
      @targets = Array(Enemy).new

      def _physics_process(delta : Float64)
        origin = global_position # Direct C ABI: zero P/Invoke overhead
        range_sq = 400.0_f32 * 400.0_f32

        # Inlined loop: stack iteration with zero heap closures
        @targets.each do |target|
          next if target.global_position.distance_squared_to(origin) > range_sq
          target.take_damage(35.0_f32, origin) # Direct typed dispatch: zero boxing
        end

        # Stack iteration avoids GC churn in the hot physics loop
      end
    end
  points:
  - <strong>Direct Native C ABI:</strong> Ahead-of-time compiled by LLVM directly to native machine code; engine property reads execute at raw C++ speed with zero marshalling overhead.
  - <strong>Inlined Iteration:</strong> Crystal's <code>each</code> block is inlined by LLVM directly on the stack—allocating zero heap closure objects.
  - <strong>Static Typed Method Dispatch:</strong> <code>target.take_damage(35.0_f32, origin)</code> invokes direct function pointers without <code>Variant</code> boxing or dynamic lookups.
  - <strong>Minimal Heap Churn:</strong> The inlined traversal allocates zero heap objects, maintaining smooth, deterministic frame pacing.
