notes: |
  Why does C# struggle in high-performance gameplay loops? In Godot C#, every call into engine nodes must traverse the managed-to-unmanaged P/Invoke boundary, adding call overhead and struct copying. Even worse, standard C# idioms like LINQ closures allocate temporary objects on the heap every single frame, while dynamic method calls box arguments into Godot Variant arrays. When the .NET Garbage Collector pauses execution to sweep Gen0 and Gen1 heaps, frame times spike by 15ms to 50ms, causing noticeable hitching right in the middle of combat.
  In Lapis, Crystal compiles directly to bare-metal machine code via LLVM with a direct C ABI interface to Godot. Crystal's higher-order blocks (select!, sort_by!, each) are completely inlined on the stack with zero heap closures, and methods dispatch directly without Variant boxing. Hot physics and combat loops allocate exactly 0 bytes on the heap, delivering rock-solid 120+ FPS frame pacing with zero GC stutter.
