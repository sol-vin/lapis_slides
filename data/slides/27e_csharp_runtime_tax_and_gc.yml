  title: ':circle-xmark: Godot C#: P/Invoke Overhead, Boxing & GC Spikes'
  lang: csharp
  tag: C# (.NET 8)
  card_title: C# VM Tax, Boxing & GC Pauses
  code: |
    public partial class CombatRadar : Node2D
    {
        private List<Enemy> _targets = new();

        public override void _PhysicsProcess(double delta)
        {
            var origin = GlobalPosition; // P/Invoke across managed boundary

            // LINQ allocates closures, enumerators, and list buffers on heap every frame
            var inRange = _targets
                .Where(t => t.GlobalPosition.DistanceTo(origin) < 400.0f)
                .OrderBy(t => t.GlobalPosition.DistanceSquaredTo(origin))
                .ToList();

            // Variant array allocation & dynamic dispatch boxes floats and vectors
            foreach (var target in inRange)
                target.Call("take_damage", 35.0f, origin);

            // Floods .NET Gen0/Gen1 nursery -> GC sweeps cause 15ms-50ms frame drops
        }
    }
  points:
  - <strong>P/Invoke Boundary Overhead:</strong> Reading engine properties and calling C++ nodes repeatedly crosses the managed CLR boundary, incurring marshalling latency.
  - <strong>LINQ Closure & Enumerator Churn:</strong> Idiomatic operators (<code>Where</code>, <code>OrderBy</code>) instantiate delegate display classes, heap enumerators, and buffer arrays 60–120 times every second.
  - <strong>Variant Boxing & Dynamic Dispatch:</strong> Calling <code>target.Call(...)</code> dynamically boxes value arguments into temporary <code>Godot.Variant</code> arrays, flooding Gen0/Gen1 nursery heaps.
  - <strong>Unpredictable GC Stutter:</strong> When the .NET runtime sweeps the nursery, frame times spike by 15ms–50ms, causing visible frame drops in intensive gameplay.
