  card_title: C# VM Tax, Boxing & GC Pauses
  code: |
    public partial class CombatRadar : Node2D
    {
        private List<Enemy> _targets = new();

        public override void _PhysicsProcess(double delta)
        {
            var origin = GlobalPosition; // P/Invoke across managed boundary

            // 1. LINQ allocates closures & enumerators on heap EVERY physics frame:
            var inRange = _targets
                .Where(t => t.GlobalPosition.DistanceTo(origin) < 400.0f)
                .OrderBy(t => t.GlobalPosition.DistanceSquaredTo(origin))
                .ToList(); // ⚠️ Heap allocation: List<T> + display class + enumerator

            // 2. Variant boxing & dynamic dispatch:
            foreach (var target in inRange)
            {
                // Allocates Variant array for arguments, boxing float & Vector2:
                target.Call("take_damage", 35.0f, origin);
            }
            // Result: Floods .NET Gen0/Gen1 heap -> GC pauses drop frames (15ms-50ms spikes!)
        }
    }
  points:
  - <strong>P/Invoke Boundary Overhead:</strong> Reading <code>GlobalPosition</code> and calling engine APIs repeatedly crosses the managed CLR to unmanaged C++ boundary, incurring marshalling latency.
  - <strong>Heap Allocation Churn in Hot Loops:</strong> Idiomatic C# features like LINQ (<code>.Where()</code>, <code>.OrderBy()</code>, lambdas) allocate delegate closures, display classes, and enumerator objects on the heap 60 to 120 times every second.
  - <strong>Variant Boxing &amp; Reflection:</strong> Calling <code>target.Call(...)</code> dynamically boxes value types into temporary <code>Godot.Variant</code> arrays, flooding the .NET Gen0/Gen1 nursery.
  - <strong>GC Frame Spikes &amp; Micro-Stutter:</strong> When the CLR Garbage Collector pauses execution to sweep the nursery, frame times spike by 15ms–50ms, causing visible frame drops during intensive combat.
