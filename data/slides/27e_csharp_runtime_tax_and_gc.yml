    public partial class ParticleSwarm : Node2D
    {
        // Heavy allocations in 60fps / 120fps physics loop:
        public override void _PhysicsProcess(double delta)
        {
            for (int i = 0; i < 10_000; i++)
            {
                // 1. P/Invoke crossing boundary (C# CLR -> C++ Godot)
                // 2. Struct marshalling and hidden memory allocations
                var pos = GetParticlePos(i);

                // 3. LINQ or lambda closures allocate garbage on heap:
                var nearby = _targets.Where(t => t.DistanceTo(pos) < 50.0f);

                // 4. Variant boxing: wrapping primitives into Godot.Variant
                // causes thousands of heap allocations per second!
                // -> Triggers CLR Garbage Collector pauses (15ms-50ms spikes!)
            }
        }
    }
  points:
  - <strong>P/Invoke Marshaling Barrier:</strong> Every call between C# and Godot must cross the managed/unmanaged runtime boundary, translating pointers and copying data.
  - <strong>Boxing &amp; Allocation Churn:</strong> Passing primitives to Godot APIs often boxes values into <code>Godot.Variant</code>, flooding the .NET Gen0/Gen1 heaps with short-lived objects.
  - <strong>Garbage Collection Stutter:</strong> The .NET CLR garbage collector runs non-deterministically; when a Gen2 collection triggers, frame rates plummet, causing visible micro-stutter.
  - <strong>Bloated Distribution:</strong> Shipping a C# Godot game requires bundling the entire .NET runtime (~50-100MB+ extra binary footprint).
