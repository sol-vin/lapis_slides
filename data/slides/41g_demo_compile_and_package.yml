    - '<strong>LLVM -O3 Optimization:</strong> Full link-time optimization, function inlining, and aggressive dead-code elimination produce lean, ultra-fast binaries.'
    - '<strong>Automated PCK & Asset Bundling:</strong> Godot scenes, shader materials, and texture assets are packed into an optimized standalone <code>.pck</code> file.'
    - '<strong>Self-Contained Portability:</strong> Bundles the executable runner alongside <code>libgodot.dll</code>, Boehm GC, PCRE2, and all installed addons (<code>crshader</code>).'
