notes: |
  In Part 4 of our demo, we take our finished game and package it for real-world distribution.
  Instead of scattering loose DLLs, scene folders, and separate PCK files, we run `lapis package game --release --portable --embed-pck`.
  In one command, Lapis compiles the Crystal code with LLVM -O3 optimizations, strips all debug symbols, builds the Godot PCK asset pack, and embeds it directly into the binary's GDPC footer while bundling Boehm GC and runtime dependencies.
  The result is a single, self-contained `my_game.exe` with zero external dependencies—ready to upload to Steam, itch.io, or run on a clean PC!
