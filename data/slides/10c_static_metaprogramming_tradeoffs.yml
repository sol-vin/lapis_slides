    # Crystal has NO runtime interpreter or method dictionary:
    target.send("cast_spell", 50)            # Compile Error!
    eval("class Boss < #{dyn_parent}; end")  # Compile Error!
    target.instance_variable_set("@hp", 100) # Fixed memory layout!
