notes: |
  When programmers coming from C, C++, Java, C#, Go, or Python first encounter Ruby code, they often experience intense cognitive dissonance. The syntax doesn't look like the traditional C-family algol-derived languages they grew up with. Where are the return statements? Why is someone assigning an if statement to a variable? Why is there an 'if' tacked onto the end of a line after the function call? How can a method have a question mark or exclamation mark in its name? And how can you possibly re-open a standard library class and add methods to it?
  To an outsider, these conventions look like lawless chaos. But to experienced Rubyists, they are the secret sauce of developer happiness. None of these are accidents or sloppy language design—they are intentional, mathematically sound, human-centered ergonomic choices. In this section, we'll demystify each of these famous 'oddities' and explain why they make code cleaner, more readable, and less error-prone. And most importantly, we will see how Crystal took these exact ergonomic oddities and proved they can run at native C++ execution speeds.
