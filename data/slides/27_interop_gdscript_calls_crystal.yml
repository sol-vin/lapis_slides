left:
  type: code
  title: player.cr — Exported Crystal Node
  tag: Crystal
  lang: crystal
  code: "node Player < CharacterBody3D do\r\n  @[Export]\r\n  property speed : Float32
    = 7.0_f32\r\n\n  signal health_changed(current : Int32)\r\n\n  def heal(amount
    : Int32) : Int32\r\n    @health += amount\r\n    emit_health_changed(@health)\r\n
    \   @health\r\n  end\r\nend"
right:
  type: code
  title: ui_controller.gd — GDScript Consumer
  tag: GDScript
  lang: gdscript
  code: "extends Control\r\n\n@onready var player: Player = $Player\r\n\nfunc _on_heal_pressed()
    -> void:\r\n    # Calls Crystal method directly with autocompletion!\r\n    var
    new_hp = player.heal(25)\r\n    $HPLabel.text = \"HP: %d\" % new_hp\r\n\nfunc
    _ready() -> void:\r\n    # Connects to Crystal signal seamlessly\r\n    player.health_changed.connect(_on_hp_changed)"
notes: You don't have to rewrite your entire game in Crystal to use Lapis. Lapis nodes
  register directly with Godot's ClassDB. That means GDScript developers on your team
  can instantiate Crystal nodes, call Crystal methods, inspect exported properties,
  and connect to Crystal signals with complete native editor autocomplete.
