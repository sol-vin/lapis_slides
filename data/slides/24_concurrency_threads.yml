  code: |
    # Offload heavy procedural generation to native OS thread
    worker_thread = Thread.new do
      # 1. Heavy multi-core CPU crunching runs off the main thread:
      noise = Godot::FastNoiseLite.new
      mesh_data = generate_marching_cubes(noise)

      # 2. Type-safe dispatch directly to Godot's Main Thread:
      # No string callback names, no single-use handler method sprawl!
      Godot.on_main_thread do
        update_surface_mesh(mesh_data)
        @terrain_mesh.visible = true
      end
    end
right:
  type: card
  title: OS Thread Invariants
  color: amber
  items:
  - <strong>True Hardware Parallelism:</strong> <code>Thread.new</code> executes on dedicated OS threads across hardware CPU cores.
  - <strong>SceneTree Safety Invariant:</strong> NEVER call <code>add_child</code> or mutate live nodes directly from background threads.
  - <strong>Type-Safe Dispatch (<code>Godot.on_main_thread</code>):</strong> Buffers typed closures directly into Godot's MessageQueue—eliminating stringly <code>call_deferred</code>.
  - <strong>Zero-Overhead on Main:</strong> If already on the rendering thread, the closure executes immediately without queueing or latency.
notes: |
  When your game requires heavy procedural generation, pathfinding, or physics computation, cooperative fibers aren't enough—you need true hardware parallelism. In Lapis, you can spawn OS background threads using Thread.new. Background threads crunch data across all available CPU cores without ever dropping a frame.
  To apply the results safely, you don't need string-based call_deferred callbacks or method sprawl. Instead, Godot.on_main_thread accepts a type-safe closure, buffering it safely into Godot's engine MessageQueue for deterministic execution at the next frame boundary.
