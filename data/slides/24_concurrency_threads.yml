right:
  type: card
  title: OS Thread Invariants
  color: amber
  items:
  - <strong>True Hardware Parallelism:</strong> <code>Thread.new</code> executes on
    dedicated OS threads across CPU cores.
  - <strong>SceneTree Safety Invariant:</strong> NEVER call <code>add_child</code>,
    <code>remove_child</code>, or <code>queue_free</code> from an OS thread.
  - <strong>Cross-Thread Dispatch via call_deferred:</strong> Push completed results
    back to the main thread via Godot's thread-safe MessageQueue.
  - <strong>Thread Sleep Rules:</strong> Use <code>Crystal::System::Thread.sleep</code>
    for true OS thread sleeps.
notes: When your game requires heavy procedural generation, pathfinding, or physics
  computation, cooperative fibers aren't enough—you need true hardware parallelism.
  In Lapis, you can spawn OS background threads using Thread.new. Background threads
  crunch data across all available CPU cores without ever dropping a frame, and send
  results back via call_deferred.
