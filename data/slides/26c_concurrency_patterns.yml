  title: Concurrency Invariants & Architecture
  color: purple
  items:
  - "<strong>SceneTree Affinity Invariant:</strong> SceneTree modifications (<code>add_child</code>, transforms) must stay on the main thread; violations raise <code>ThreadAffinityError</code>."
  - "<strong>Buffered Channel Actors:</strong> Offload heavy pathfinding, procedural generation, and AI to OS threads (<code>Thread.new</code>) via buffered <code>Channel(T).new(cap)</code>."
  - "<strong>Cooperative Gameplay Fibers:</strong> Non-blocking <code>spawn</code> fibers yield in <code>_process</code> via <code>await(timer)</code> or <code>await(signal)</code> without stalling engine frames."
  - "<strong>Zero-Lock Message Passing:</strong> Background threads pass immutable Crystal structs, eliminating mutex contention, cache invalidation, and deadlocks."
notes: |
  Concurrent game programming often devolves into mutex chaos and race conditions. In Lapis, we combine Crystal's Actor model with Godot's single-threaded SceneTree guarantees.
  Heavy tasks like A* pathfinding, voxel generation, and AI simulations run on dedicated OS worker threads (Thread.new). They communicate with the game through buffered channels.
  On the main thread, _process non-blockingly drains completed results using a select block and applies updates directly to SceneTree nodes—100% thread-safe with zero mutex locks!
  Meanwhile, cooperative gameplay fibers handle non-blocking asynchronous state machines using await without ever blocking the engine frame loop.
