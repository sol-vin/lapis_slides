left:
  type: code
  title: dialogue_cutscene.cr — Cooperative Gameplay Fibers
  tag: Crystal
  lang: crystal
  code: |
    # Spawn lightweight cooperative fiber on main thread
    spawn do
      dialogue_box.typewrite("A storm is approaching...")
      await!(dialogue_box.finished) # Unwraps or raises TimeoutError

      await?(1.5.seconds)           # Non-blocking delay (returns Bool)
      camera.screen_shake(intensity: 0.8)
      lightning.trigger_flash

      # Await with AwaitStatus predicate inspection
      status = await(lightning.flash_completed, timeout_sec: 2.0)
      if status.ok?
        dialogue_box.typewrite("We must take shelter!")
      end
    end

    def _process(delta : Float64) : Void
      # Yield cooperative slice to spawned fibers
      Fiber.yield
    end
right:
  type: card
  title: Fiber Concurrency Invariants
  color: cyan
  items:
  - <strong>Cooperative Scheduling:</strong> Fibers execute on the OS main thread;
    zero mutexes or locks required for SceneTree operations.
  - <strong>Yielding in _process:</strong> Call <code>Fiber.yield</code> in <code>_process</code>
    to ensure fibers advance with frame ticks.
  - <strong>Await Triad (<code>await</code>, <code>await?</code>, <code>await!</code>):</strong>
    Never call blocking <code>sleep</code> in fibers; use non-blocking await with status predicates.
  - <strong>DisposedObjectError:</strong> Awaiting fibers raise <code>Godot::DisposedObjectError</code>
    if the target node is freed, preventing silent hangs.
notes: Godot's scene tree is fundamentally single-threaded. Lapis provides lightweight,
  cooperative fibers for orchestrating asynchronous gameplay sequences—dialogue, cutscenes,
  scripted events—directly on the main thread. With the await triad (await, await?, await!),
  fibers can wait on signals or timers with full timeout control and dead-pointer safety.
