notes: |
  Here is how "?" and "!" come together in practice when designing real-world APIs like a complex network operation.
  Instead of forcing every caller into a single rigid error-handling paradigm—like Go's repetitive error tuples everywhere or Java's mandatory checked exceptions—Crystal's semantic punctuation lets you offer all three contracts from one unified implementation:
  1. The base 'complex' method performs the operation and returns a stack-allocated Tuple containing a 'Status | Exception' alongside a 'Result | Nil'. Callers that need deep diagnostics, status inspection, or custom retry policies destructure both values directly.
  2. The question-mark variant 'complex?' simply unpacks the tuple and returns 'Result | Nil'. When a caller doesn't care why the network call failed and just wants to branch on whether a result arrived, 'if res = complex?' handles it in one line with compile-time nil narrowing.
  3. The bang variant 'complex!' unpacks the tuple, immediately raises the exception if one was encountered, and returns a guaranteed non-nil 'Result'.
  Because Crystal allows '?' and '!' directly in method identifiers, all three share the same base name—giving the caller complete control over failure semantics with a single character at the call site.
