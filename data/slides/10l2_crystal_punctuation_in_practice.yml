  title: network_triad.cr — The complex / complex? / complex! Pattern
  tag: Crystal
  lang: crystal
  font_size: '0.80rem'
  code: |
    # 1. Base method: full diagnostic Tuple (status/error + result)
    def complex : {Status | Exception, Result | Nil}
      # ... fake complex network operation ...
      {Status::Ok, Result.new}
    rescue ex : Exception
      {ex, nil}
    end

    # 2. Safe query (?): returns Result | Nil (ignores error details)
    def complex? : Result | Nil
      _, result = complex
      result
    end

    # 3. Strict bang (!): returns Result or throws the error
    def complex! : Result
      status, result = complex
      raise status if status.is_a?(Exception)
      result.not_nil!
    end
