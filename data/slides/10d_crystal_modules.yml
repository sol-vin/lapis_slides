hero_feature:
  title: 'gameplay_modules.cr — Horizontal Composition'
  badge: 'ZERO-COST TRAITS'
  color: cyan
  lang: crystal
  code: |
    # 1. Namespace & mixin dual use (extend self)
    module SpatialMath
      extend self
      def dist_sq(a, b)
        (a.x - b.x)**2 + (a.y - b.y)**2
      end
    end

    # 2. Stateful trait with compile-time contracts
    module Damageable
      abstract def armor : Int32
      property health : Int32 = 100

      def take_damage(raw : Int32) : Void
        @health = Math.max(0, @health - Math.max(1, raw - armor))
      end
    end

    # 3. Mix across unrelated classes & value structs
    class BossEnemy < GameActor
      include Damageable
      getter armor : Int32 = 25
    end

    struct WoodenCrate
      include Damageable
      getter armor : Int32 = 5
    end
  desc: 'Mixed-in methods resolve statically at compile time and inline directly into native machine code with zero vtable penalties.'
