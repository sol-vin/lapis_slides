  items:
    - '<strong>Horizontal Composition via <code>include</code>:</strong> Mix reusable behaviors across unrelated scene nodes without deep inheritance trees or multiple-inheritance hazards.'
    - '<strong>Why Lapis Uses <code>gmodule</code>:</strong> Pure <code>module</code> handles language-level mixins, but Godot nodes need <code>gmodule</code> to register <code>@[Export]</code> properties and signals into ClassDB.'
    - '<strong>Zero Virtual Dispatch Overhead:</strong> Mixin methods resolve statically at compile time and inline directly into machine code—zero vtable lookups.'
    - '<strong>Abstract Method Contracts:</strong> <code>abstract def</code> in traits enforces compile-time interface conformance without runtime reflection or interface boxing.'
    - '<strong>Namespace & Singleton Utilities:</strong> <code>extend self</code> enables modules to act simultaneously as standalone functional namespaces and mixable math traits.'
notes: |
  In object-oriented game development, classical single inheritance quickly breaks down: an Enemy, a DestructibleProp, and a Player all take damage, but they live in completely different branches of Godot's node hierarchy.
  In C++, solving this requires multiple inheritance with virtual tables or complex component wrappers. In Ruby, mixin modules solved this, but with the penalty of runtime ancestor lookup chains.
  Crystal gives us zero-cost horizontal mixins and namespaces via 'extend self'.
  However, when bridging to Godot, a standard Crystal 'module' is not enough: Godot's engine needs to know about exported properties, Inspector sliders, and engine signals in ClassDB. That is why Lapis provides the 'gmodule' macro. It acts like a Crystal module, but automatically registers exports and signals into the node's ClassDB reflection table with zero runtime overhead.
