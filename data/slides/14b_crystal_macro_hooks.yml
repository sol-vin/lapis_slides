  title: Compile-Time Module & Class Hooks
  color: amber
  items:
    - '<strong>The <code>macro included</code> Hook:</strong> Executes whenever a module is included into a class. Automatically injects instance variables, methods, and validations into the receiver.'
    - '<strong>Replaces Ruby''s <code>self.included</code>:</strong> Ruby required runtime metaprogramming tricks (<code>base.extend ClassMethods</code>). Crystal achieves full mixin synthesis at compile time with zero runtime reflection.'
    - '<strong>The <code>macro inherited</code> Hook:</strong> Fires the instant a class is subclassed, allowing base classes to inspect, configure, and register child types automatically.'
    - '<strong>Zero-Overhead Registries:</strong> Build entity factories and plugin lists during compilation—no manual arrays or reflection scanning at startup.'
    - '<strong>Type-Safe & Inlined:</strong> All injected code participates in standard global type inference and compiles directly into bare-metal machine code.'
notes: |
  In Ruby, developers loved mixin modules with include, but doing advanced metaprogramming required clumsy runtime hooks like def self.included(base) followed by base.extend(ClassMethods).
  In Crystal, macro hooks elevate this to compile time. The macro included hook fires the moment a module is included, allowing you to inject instance variables, methods, and compile-time checks directly into the host class with full access to @type.
  Similarly, macro inherited fires the instant a class is subclassed. This lets frameworks and game engines automatically register derived entity types into factories or registries without manual registration boilerplate or slow runtime reflection scans.
  Everything is resolved and validated during compilation, compiling down to direct, inlined machine instructions.
