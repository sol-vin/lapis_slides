  items:
    - '<strong>1. Bind &amp; Boot (<code>lib CDoom</code>):</strong> Bind the header-only C port to Crystal first so the entire game runs and remains testable from minute one.'
    - '<strong>2. 1-to-1 Unsafe Port (<code>Pointer(T)</code>, <code>Box(T)</code>, <code>malloc</code>):</strong> Translate C functions one by one into Crystal using raw <code>Pointer(T)</code>, <code>Box(T)</code>, and <code>malloc</code>, flipping each C symbol to <code>extern</code>.'
    - '<strong>3. Continuous Live Verification:</strong> Because Crystal shares the exact C ABI, the half-C, half-Crystal Ship of Shwageseus compiles and plays after every single function swap.'
    - '<strong>4. Idiomatic Crystalization:</strong> Once every C plank is replaced, refactor raw pointers and <code>malloc</code> into safe Crystal classes, enums, and slices—boom, DOOM 100% in Crystal!'
notes: |
  We call this the "Ship of Shwageseus" method—or two-way bindings.
  First, you bind the header-only C library so you can play DOOM in Crystal immediately.
  Second, you take the functions as they are written in C and translate them one by one into Crystal—written 1-to-1 with the C code using Pointer(T), Box(T), and malloc—while turning the original C function into an extern declaration. Because Crystal speaks the native C ABI without FFI marshalling overhead, you can test each individual function inside the live game the moment you rewrite it.
  Third, once every C function has been moved across the border, you translate that raw pointer code into real, idiomatic Crystal. And boom—you have DOOM fully made in Crystal without ever having a broken build in between.
