    - '<strong>Opt-In Require:</strong> Add <code>require "lapis/cs_extras"</code> to enable <code>+=</code> and <code>-=</code> event operators on signals.'
    - '<strong>Familiar C# Syntax:</strong> <code>signal += -&gt;handler</code> provides a seamless onboarding ramp for developers migrating from Godot C#.'
