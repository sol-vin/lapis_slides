  items:
    - '<strong>Composed Module Inheritance (<code>gmodule A &lt; B</code>):</strong> Modules can inherit from other modules! <code>Combatant</code> automatically brings along all <code>Damageable</code> properties and signals, then adds its own.'
    - '<strong>Cooperative Lifecycle Chaining (<code>super</code>):</strong> Modules implement <code>_process</code>, <code>_physics_process</code>, or <code>_ready</code>. Calling <code>super</code> guarantees all mixed-in traits execute in proper MRO sequence.'
    - '<strong>Compile-Time Abstract Contracts:</strong> <code>abstract def</code> inside a module guarantees that any node including the trait implements the contract—verified at compile time with zero runtime reflection.'
    - '<strong>Defeats the Diamond Problem:</strong> Linearized Crystal mixin semantics eliminate C++ virtual diamond inheritance ambiguities while enabling deep behavioral composition.'
    - '<strong>Autonomous Gameplay Traits:</strong> Modules like <code>AutoRegen</code> manage their own per-frame timers and state without requiring dedicated child nodes or manual plumbing.'
notes: |
  gmodule goes far beyond simple flat mixins—it unlocks a complete, robust trait architecture for game engines.
  First, gmodule supports composed inheritance: writing 'gmodule Combatant < Damageable' means Combatant inherits all exported properties, typed signals, and methods from Damageable. When BossMonster includes Combatant, it gets health, defense, attack power, and all corresponding signals in one shot.
  Second, gmodule solves the dreaded lifecycle callback problem. Traditional component architectures struggle with multiple systems needing _process or _physics_process. With gmodule, calling super in _process ensures every included trait's frame logic executes in predictable method-resolution order without dropping callbacks.
  And third, using Crystal's native abstract def inside a gmodule creates hard compile-time interface contracts. If a node includes Interactable but forgets to implement on_interact, the compiler refuses to build. It delivers total architectural safety with zero virtual call overhead.
