  code: |
    macro fsm(name, initial = :idle, &block)
      @{{name.id}} : Symbol = {{initial}}
      {{block.body}}

      def transition_to(new_state : Symbol) : Nil
        old_state = @{{name.id}}
        return if old_state == new_state
        case old_state
        {% for st in block.body.expressions %}
          when {{st.args[0]}} then _fsm_exit_{{st.args[0].id}}
        {% end %}
        end
        @{{name.id}} = new_state
        case new_state
        {% for st in block.body.expressions %}
          when {{st.args[0]}} then _fsm_enter_{{st.args[0].id}}
        {% end %}
        end
      end
    end
right:
  type: card
  title: Compile-Time Metaprogramming Invariants
  color: amber
  items:
    - '<strong>Compile-Time AST Unrolling:</strong> Iterates over <code>block.body.expressions</code> during compilation with zero runtime reflection.'
    - '<strong>Synthesizes Hook Methods:</strong> Each <code>state :chase</code> block compiles into concrete <code>_fsm_enter_chase</code> and <code>_fsm_exit_chase</code> methods.'
    - '<strong>Zero Closure Allocations:</strong> Lifecycle blocks are spliced directly into method bodies rather than heap-allocated <code>Proc</code> closures.'
    - '<strong>Direct Jump Tables:</strong> Both exit and enter <code>case</code> blocks lower to LLVM switch tables on interned 32-bit symbols.'
notes: |
  Here is the actual Crystal macro implementation from `src/libgodot/fsm.cr`. Notice how `transition_to` works: the macro walks `block.body.expressions` at compile time and synthesizes two flat `case` statements—first calling `_fsm_exit_<state>` for the outgoing state, updating `@state = new_state`, and then calling `_fsm_enter_<state>` for the incoming state. Because every state block is unrolled into a direct method call at compile time, there are zero heap closures, zero function pointers, and zero dictionary lookups.
