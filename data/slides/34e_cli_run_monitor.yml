right:
  type: card
  title: Real-Time Gameplay Telemetry
  color: green
  items:
  - <strong>Dual Rolling Line Graphs (<code>lapis run -p template --monitor</code>):</strong> Real-time ASCII graphs plot frame rate (FPS) and heap memory allocation (MB) side-by-side with 500ms sampling granularity.
  - <strong>Template & Multi-Target Supervision:</strong> Targets projects seamlessly via <code>-p template</code>, continuously monitoring host binary execution, PID changes, and exit codes.
  - <strong>Graceful Process Termination:</strong> Pressing <code>Ctrl+K</code> issues clean OS termination signals, allowing Godot scenes and native C++ resources to unregister safely.
  - <strong>Sub-Millisecond Overhead:</strong> Telemetry collection runs in an isolated non-blocking background fiber, ensuring zero impact on gameplay physics or render frame pacing.
notes: |
  Profiling runtime performance shouldn't require attaching bulky external profilers that alter frame timing. The Lapis Runtime Performance Monitor (`lapis run -p template --monitor`) launches the game executable directly from the template folder and displays real-time rolling graphs of frame rate stability and heap memory allocation right in the terminal. If performance drops or memory balloons, developers can spot regressions instantly, restart with [R], or terminate runaway processes gracefully with [K].
