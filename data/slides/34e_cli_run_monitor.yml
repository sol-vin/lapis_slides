right:
  type: card
  title: Real-Time Gameplay Telemetry
  color: green
  items:
  - <strong>Dual Rolling Line Graphs (<code>lapis cli -r</code>):</strong> Real-time ASCII graphs plot frame rate (FPS) and heap memory allocation (MB) side-by-side with 500ms sampling granularity.
  - <strong>Engine Process Supervision:</strong> Continuously monitors host binary execution, detecting PID changes, unhandled exceptions, and clean exit codes.
  - <strong>Graceful Process Termination:</strong> Pressing <code>Ctrl+K</code> issues clean OS termination signals, allowing Godot scenes and native C++ resources to unregister safely.
  - <strong>Sub-Millisecond Overhead:</strong> Telemetry collection runs in an isolated non-blocking background fiber, ensuring zero impact on gameplay physics or render frame pacing.
notes: |
  Profiling runtime performance shouldn't require attaching bulky external profilers that alter frame timing. The Lapis Runtime Performance Monitor (lapis cli -r) launches the game executable and displays real-time rolling graphs of frame rate stability and heap memory allocation right in the terminal. If performance drops or memory balloons, developers can spot regressions instantly and terminate runaway processes gracefully with a single hotkey.
