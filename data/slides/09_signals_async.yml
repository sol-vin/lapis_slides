  font_size: '0.78rem'
  code: |
    # 1. Declarative signal connection sugar with 'on' or 'connect':
    start_btn = self["UI/StartButton", Godot::Button]
    on start_btn.pressed do
      start_game_sequence
    end

    # 2. Declaring custom typed signals with parameters:
    signal health_changed(current : Int32, max_health : Int32)
    signal player_died

    # 3. First-class signal subscriptions, one-shot, and type filters:
    health_changed.connect do |curr, max|
      hud.update_health_bar(curr, max)
    end
    player_died.once do
      game_over_director.trigger_defeat
    end
    on area.body_entered, Player do |player|
      player.collect_coin
    end

    # 4. First-class signal emission on signal accessors:
    health_changed.emit(75, 100)
    emit(health_changed, 75, 100) # macro sugar
    player_died.emit
right:
  type: card
  title: Reactive Gameplay Features
  color: cyan
  items:
  - <strong>Declarative <code>on</code> &amp; <code>connect</code>:</strong> Connect signals with clean Crystal blocks—<code>on button.pressed { ... }</code> eliminates single-use handler boilerplate.
  - <strong>First-Class Signal Accessors:</strong> Signals are typed objects; <code>health_changed.emit(75, 100)</code> and <code>health_changed.connect</code> provide zero namespace pollution.
  - <strong>Positional Type Filtering:</strong> <code>on area.body_entered, Player do |p|</code> automatically filters by class and downcasts argument without manual <code>.as(T)</code>.
  - <strong>One-Shot Subscriptions:</strong> <code>signal.once { ... }</code> automatically unhooks after the first invocation, preventing stale event leaks.
  - <strong>Automatic ObjectDB Pruning:</strong> Subscriptions track 64-bit instance IDs; when either sender or receiver dies, connections dissolve cleanly.
notes: |
  Signals are the heartbeat of Godot game architecture. In Lapis, signals feel completely native to Crystal. With our 'on' macro and 'connect' blocks, you can wire up signals with idiomatic closures—eliminating single-use handler functions.
  Signals are first-class typed accessors: 'health_changed.emit(75, 100)', 'player_died.once', and positional type filtering like 'on area.body_entered, Player' prevent method namespace pollution and collisions.
  Systems stay decoupled and clean, with compile-time verification catching signature mismatches instantly with zero runtime reflection overhead.
