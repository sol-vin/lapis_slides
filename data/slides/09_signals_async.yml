  title: reactive_events.cr — Type-Safe Signal Subscriptions
  tag: Crystal
  lang: crystal
  font_size: '0.84rem'
  code: |
    # 1. Custom typed signals
    signal health_changed(current : Int32, max : Int32)
    signal player_died

    # 2. Declarative subscriptions & one-shot hooks
    health_changed.connect do |curr, max|
      hud.update_health(curr, max)
    end
    player_died.once { game_over_director.trigger_defeat }

    # 3. Positional type filtering
    on area.body_entered, Player do |player|
      player.collect_coin
    end

    # 4. First-class typed emission
    health_changed.emit(75, 100)
right:
  type: card
  title: Reactive Gameplay Architecture
  color: cyan
  items:
    - '<strong>Declarative <code>on</code> &amp; <code>connect</code>:</strong> Wire signals with clean blocks, eliminating boilerplate intermediary methods.'
    - '<strong>First-Class Signal Accessors:</strong> <code>health_changed.emit(...)</code> provides type-checked invocation with zero namespace pollution.'
    - '<strong>Positional Type Filtering:</strong> <code>on area.body_entered, Player</code> filters collision events and downcasts targets automatically.'
    - '<strong>One-Shot & Safe Lifecycle:</strong> <code>signal.once { ... }</code> auto-unhooks after firing, while dead-instance tracking prevents stale callback crashes.'
notes: |
  Signals are the heartbeat of Godot game architecture. In Lapis, signals feel completely native to Crystal. With our 'on' macro and 'connect' blocks, you can wire up signals with idiomatic closures—eliminating single-use handler functions.
  Signals are first-class typed accessors: 'health_changed.emit(75, 100)', 'player_died.once', and positional type filtering like 'on area.body_entered, Player' prevent method namespace pollution and collisions.
  Systems stay decoupled and clean, with compile-time verification catching signature mismatches instantly with zero runtime reflection overhead.
