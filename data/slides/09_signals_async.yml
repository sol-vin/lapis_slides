  type: card
  title: Reactive Gameplay Features
  color: cyan
  items:
  - <strong>Closure Connections:</strong> Connect signals with clean Crystal blocks—no
    string method names or delegate boilerplate.
  - <strong>Synthesized Signal Helpers:</strong> Declaring <code>signal died</code>
    auto-generates <code>emit_died</code>, <code>on_died</code>, and <code>on_died_once</code>
    with compile-time type verification.
  - <strong>First-Class await:</strong> Await timers (<code>await(2.5.seconds)</code>)
    or typed signals (<code>await(boss.died)</code>).
  - <strong>Dead-Pointer Guard:</strong> If an awaited node is freed during waiting,
    the fiber safely aborts with <code>DisposedObjectError</code> instead of segfaulting.
  - <strong>Cross-Language Interop:</strong> Connect GDScript signals and call dynamic
    methods with <code>node.call("method", args)</code>.
notes: Signals are the heartbeat of Godot game architecture. In Lapis, signals feel
  completely native to Crystal. You can connect signals with idiomatic Crystal closures,
  eliminating single-use handler functions. Declaring a signal with our macro auto-generates
  type-safe emitter and listener helpers. And our first-class await mechanism lets
  you write procedural cutscenes and asynchronous timers cleanly using fibers, with
  automatic dead-pointer protection guarding against deallocated nodes.
