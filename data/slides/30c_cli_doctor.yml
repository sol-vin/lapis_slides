right:
  type: card
  title: Zero-Friction Toolchain Verification
  color: green
  items:
  - <strong>Full-Stack Toolchain Audit:</strong> Validates Crystal, LLVM 18, Godot 4.8+, radare2, MSVC/GCC, and CRT runtime dependencies in one pass.
  - <strong>Live Readiness Meter:</strong> Visual progress gauge displays environment readiness percentage and actionable status badges.
  - <strong>Automated Remediation (<code>--fix</code>):</strong> Automatically repairs missing <code>extension_list.cfg</code> entries, purges locked shadow DLLs, and stages missing runtime libraries.
  - <strong>Poison Protection:</strong> Detects and purges rogue host <code>libgodot.dll</code> copies in addon directories that cause fatal ClassDB crashes.
notes: |
  Toolchain setup issues are the number one cause of onboarding friction in native game development. lapis doctor audits your entire developer environment in seconds—checking the Crystal compiler, LLVM backends, Godot engine binaries, radare2, and runtime DLLs. If anything is missing or misconfigured, running lapis doctor --fix automatically resolves configuration gaps, purges stale Windows shadow DLLs, and stages required libraries without manual intervention.
