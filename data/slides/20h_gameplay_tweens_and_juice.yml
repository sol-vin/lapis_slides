    - '<strong>Statement-Based Tween Pipelines:</strong> <code>tween(item) do animate(...); chain(); parallel(); ease(Ease.Out) end</code> automatically peels apart block statements into a unified execution pipeline.'
    - '<strong>Strict Identifier Type Safety:</strong> Targets use typed property identifiers (<code>animate(position)</code>, <code>animate(modulate.a)</code>), eliminating runtime typos and strictly rejecting symbols/strings.'
    - '<strong>First-Class <code>Ease</code> &amp; <code>Trans</code> Enums:</strong> Clean constants like <code>Ease.Out</code> and <code>Trans.Cubic</code> (or <code>Ease::Out</code>) with automatic type-safe method forwarding.'
    - '<strong>Compile-Time Checked <code>tween</code> Macro:</strong> <code>tween(boss.position.y, to: 150.0, in: 0.4.seconds)</code> statically validates property access at compile time, eliminating runtime typos.'
    - '<strong>Real Sub-Properties &amp; Direct Alpha:</strong> Animate transparency directly via <code>modulate.a</code> (maps to engine <code>modulate:a</code>) or <code>alpha</code> with compile-time type verification.'
    - '<strong>Native <code>Time::Span</code> Durations &amp; Cooperative Await:</strong> Pass idiomatic Crystal time units (<code>0.4.seconds</code>, <code>150.milliseconds</code>); await completion via <code>await(tw.finished)</code> without blocking the engine loop.'
notes: |
  Game feel and juice are essential to making games satisfying to play, but setting up Godot tweens in GDScript often involves fragmented method calls and error-prone strings like "position:y".
  Lapis introduces an expressive statement-based animation DSL:
  First, 'tween(item) do animate(...); chain(); parallel(); ease(Ease.Out) end' peels apart expressions in the block, automatically turning individual calls into a continuous, high-performance tween pipeline.
  Second, property targets require real identifiers instead of symbols, statically verifying that the property exists and matches the target value type at compile time!
  Third, first-class Ease and Trans enums ('Ease.Out', 'Trans.Cubic') provide intuitive autocomplete and runtime forwarding.
  Coupled with native Crystal time units ('0.4.seconds', '150.milliseconds') and cooperative fiber awaiting via 'await(tw.finished)', animation code is concise, fast, and completely type-safe.
