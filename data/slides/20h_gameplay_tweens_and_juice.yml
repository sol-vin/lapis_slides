notes: |
  Game feel and juice are essential to making games satisfying to play, but setting up Godot tweens in code often involves repetitive boilerplate: create_tween(), manual tween_property calls, and awkward Variant boxing.
  In Lapis, we made juice effortless. A single call to 'coin.punch_scale' triggers an immediate, elastic scale rebound that makes collectibles pop.
  For multi-step sequences, 'Node#tween' provides a fluent builder block with 'animate' and 'delay', wrapping primitive types and engine math objects into Variants automatically. You can pass Crystal's native duration syntax like 0.5.seconds, and cooperatively await completion using 'await(tween.finished)' without freezing the engine loop.
