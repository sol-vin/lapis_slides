    - '<strong>Fluent Pipeline Chaining:</strong> <code>tween(item) do animate(...).chain.animate(...).parallel.animate(...) end</code> chains sequential and concurrent steps seamlessly with symbol easing (<code>:cubic</code>, <code>:out</code>).'
    - '<strong>Compile-Time Checked <code>tween</code> Macro:</strong> <code>tween(boss.position.y, to: 150.0, in: 0.4.seconds)</code> statically validates property access at compile time, eliminating runtime typos.'
    - '<strong>Real Sub-Properties &amp; Multi-Symbol Paths:</strong> Animate transparency directly via <code>modulate.a</code> (maps to engine <code>modulate:a</code>) or sub-properties (<code>:position, :y</code>) with compile-time type verification.'
    - '<strong>Native <code>Time::Span</code> Durations:</strong> Pass idiomatic Crystal time units (<code>0.4.seconds</code>, <code>150.milliseconds</code>) across all tweening and interval methods.'
