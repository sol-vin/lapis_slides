notes: |
  Game feel and juice are essential to making games satisfying to play, but setting up Godot tweens in GDScript often involves fragmented method calls and error-prone strings like "position:y".
  Lapis introduces an expressive fluent animation DSL:
  First, 'tween(item) do animate(...).chain.animate(...).parallel.animate(...) end' creates fluent, readable sequential and concurrent animation pipelines with symbol easing (':cubic', ':out').
  Second, compile-time type-checked single-property tweens: writing 'tween(boss.position.y, to: 150.0, in: 0.4.seconds)' statically verifies that 'position.y' exists on 'boss' during compilation!
  Third, 'coin.tween_to' omits the redundant target argument and supports multi-symbol paths like ':position, :y' with zero string allocations.
  Coupled with native Crystal time units ('0.4.seconds', '150.milliseconds') and cooperative fiber awaiting via 'await(tw.finished)', animation code is concise, fast, and completely type-safe.
