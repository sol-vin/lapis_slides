  items:
    - '<strong>Opt-In Require:</strong> Add <code>require "lapis/extras"</code> to enable expressive operator sugar on Godot Node classes.'
    - '<strong>Path Traversal Operator (<code>/</code>):</strong> <code>self / "Visuals" / Marker2D</code> walks scene paths fluently, pairing seamlessly with Crystal''s native <code>.as(T)</code>.'
    - '<strong>Scene Unique Nodes (<code>%</code>):</strong> <code>self % ProgressBar</code> provides instant 1:1 parity with Godot''s unique node identifier syntax.'
    - '<strong>Multi-Append Tree Assembly (<code>&lt;&lt;</code>):</strong> <code>parent &lt;&lt; c1 &lt;&lt; c2</code> brings Crystal''s stream-append idiom to SceneTree construction.'
    - '<strong>Ancestor Climbing (<code>&lt;&lt; Class</code>):</strong> <code>node &lt;&lt; Player</code> climbs parent nodes until finding the requested type, with <code>Class?</code> supporting safe nilable searches.'
notes: |
  With 'require "lapis/extras"', Node gains expressive mathematical and stream operators for hierarchy manipulation.
  First, the slash operator (/) provides intuitive path traversal: 'self / "Visuals" / Marker2D' navigates down the scene tree without writing raw strings or method calls.
  Second, the percent operator (%) provides 1:1 parity with GDScript's scene-unique nodes: 'self % ProgressBar' resolves and types the unique node in a single expression.
  Third, the double-arrow operator (<<) serves dual ergonomic roles: when passed a Node, it mounts the child to the parent and returns the parent, enabling fluent chains like 'self << player << hud'. When passed a Class type like 'self << Player', it performs upward ancestor climbing, searching parent nodes until finding a matching instance!
