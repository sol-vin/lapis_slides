    - '<strong>Opt-In Require:</strong> Add <code>require "lapis/extras"</code> to enable expressive operator sugar.'
    - '<strong>Path Traversal (<code>/</code>):</strong> <code>self / "Visuals" / Marker2D</code> walks paths fluently with native <code>.as(T)</code>.'
    - '<strong>Multi-Append Assembly (<code>&lt;&lt;</code>):</strong> <code>parent &lt;&lt; c1 &lt;&lt; c2</code> brings stream-append to scene trees.'
