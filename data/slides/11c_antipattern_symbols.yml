  code: |
    # PROBLEM 1: Dictionary String Keys — Silent Null on Typos
    var blackboard: Dictionary = {}
    blackboard["target_enemy"] = player_node
    # Typo in key silently returns null, causing downstream crash:
    var target = blackboard.get("target_enmy") # => null!
    target.take_damage(10) # Runtime Crash: Invalid call on base Nil

    # PROBLEM 2: State Machine String Hashing & Typo Blindspots
    var state: StringName = &"patrol"
    if state == &"petrol": # Typo compiles silently! Logic fails at runtime.
        refuel_vehicle()

    # PROBLEM 3: Frame-by-Frame String Comparison & Intern Table Locks
    match current_action:
        "idle": play_animation("idle")
        "attack": deal_damage() # Hashed string lookup every frame

  points:
  - '<strong>Silent Null on Typoed Keys:</strong> Typoing a dictionary string key (<code>blackboard.get("target_enmy")</code>) returns <code>null</code> without any warning, causing crashes down the line.'
  - '<strong>Silent Typo Bugs in States:</strong> String and StringName comparisons never fail at compile time. Misspellings like <code>&"petrol"</code> silently evaluate to <code>false</code>, creating insidious bugs.'
  - '<strong>Hashing & Intern Mutex Churn:</strong> Strings require runtime byte comparisons. StringNames require global mutex locking and hash table queries inside Godot''s engine pool.'
crystal:
  title: ':sparkles: Crystal: 32-Bit Immediate Symbols, Single-Cycle CMP & Typo Proofing'
  lang: crystal
  tag: Crystal (Lapis)
  code: |
    # SOLUTION 1: Godot::Dictionary & NamedTuple Symbol Key Indexing
    dict = Godot::Dictionary.new(target: player_node, score: 500)
    dict[:score] = 750                             # Native Symbol key indexing!
    dmg = dict.dig?(:stats, :attack, as: Int32)    # Safe nested digging!

    # SOLUTION 2: 32-Bit Immediate Integer (cmp eax, imm32) — 0 Allocations
    # Symbols are NOT strings: they are immediate 32-bit compiler IDs:
    state = :patrol
    if state == :patrol # Single machine instruction (1 CPU cycle)
      move_to_waypoint
    end

    # SOLUTION 3: Fast Jump-Table Matching (Zero String Hashing)
    case state
    when :idle   then play_animation("idle")
    when :patrol then patrol_route
    when :alert  then engage_combat
    end # Pure integer comparison, 0 heap bytes, 0 GC churn!
  points:
  - '<strong>Frictionless Engine Dictionaries:</strong> <code>Godot::Dictionary.new(**kwargs)</code> and <code>dict[:key]</code> bring transparent Symbol key access and nested <code>dig?</code> to engine collections.'
  - '<strong>Immediate 32-Bit Integers:</strong> Symbols are NOT strings. They are immediate 32-bit integer IDs assigned by the compiler — zero heap allocations, zero GC tracking, zero pointer dereferences.'
  - '<strong>Single-Cycle CPU Comparisons:</strong> Evaluating <code>state == :patrol</code> compiles to a single CPU machine instruction (<code>cmp</code>). No string hashing, no string length checks.'
takeaway:
  badge: 32-BIT IMMUTABLE IDENTITY • ZERO HEAP ALLOCATIONS
  text: Symbols solve Godot's silent dictionary typos and runtime string hash overhead by turning identifiers into immediate 32-bit integers with compile-time checked keys.
notes: |
  Symbols are one of the most beloved features inherited from Ruby and elevated to bare-metal performance in Crystal. In Godot GDScript, developers constantly rely on strings and StringNames for dictionaries, state machines, and event tags. But strings introduce two massive problems: first, typos fail silently—a misspelled dictionary key returns null without any compiler warning, and `if state == &"petrol"` simply evaluates to false. Second, strings involve runtime byte comparisons or global intern-table hash lookups.
  In Crystal, symbols like `:target_enemy` and `:patrol` are not strings at all: they are immediate 32-bit integer IDs resolved at compile time. Furthermore, Lapis bridges this directly to the engine: `Godot::Dictionary` supports keyword argument initialization (`Godot::Dictionary.new(target: player, score: 500)`), native Symbol key indexing (`dict[:score] = 750`), and nested type drilling via `dict.dig?(:stats, :attack, as: Int32)`. Comparing symbols takes a single CPU clock cycle (`cmp`) with zero heap allocations and zero GC overhead.
