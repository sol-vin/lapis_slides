title: 'Nil Safety: Runtime Crashes vs. Compile-Time Proof'
subtitle: 'Eliminating Godot''s #1 Runtime Exception: ''Invalid call on base Nil'''
badge: GDSCRIPT ANTI-PATTERN VS. CRYSTAL CLEAN SOLUTION
badge_color: amber
palette: aperture
layout: code-comparison-layout
gdscript:
  title: '❌ GDScript: Runtime Null Dereference'
  lang: gdscript
  tag: GDScript
  code: "func attack_target(target: Node) -> void:\r\n    # Compiles fine! But crashes
    during gameplay if weapon is missing or freed\r\n    var weapon = target.get_node_or_null(\"EquippedWeapon\")\r\n
    \   weapon.slash(45)\r\n    # CRASH: Invalid call to function 'slash' in base
    'Nil'.\r\n    # Or worse: ACCESS_VIOLATION if native C++ node was freed!\r\n\n
    \   # Forces developers to litter code with defensive guards:\r\n    if is_instance_valid(weapon):\r\n
    \       weapon.slash(45)"
  points:
  - <strong>Nullable by Default:</strong> Variables are nullable without compiler
    enforcement or warnings.
  - <strong>Duck-Typing Roulette:</strong> Errors only surface when players execute
    specific actions in-game.
  - <strong>Dead Pointer Segfaults:</strong> Freed C++ nodes leave dangling pointers,
    risking fatal engine crashes.
crystal:
  title: '✨ Crystal: Flow-Sensitive Compile-Time Checks'
  lang: crystal
  tag: Crystal (Lapis)
  code: "def attack_target(target : Godot::Node) : Void\r\n  # weapon is Weapon? (Union
    type: Weapon | Nil). Compiler forces checking!\r\n  if weapon = target.get_node_as?(Weapon,
    \"EquippedWeapon\")\r\n    weapon.slash(45) # Compiler narrows type to Weapon!\r\n
    \ end\r\n\n  # Or concise safe navigation with .try:\r\n  target.get_node_as?(Weapon,
    \"EquippedWeapon\").try(&.slash(45))\r\n\n  # Monotonic 64-bit ID check (#check_alive!)
    prevents dead-pointer segfaults\r\nend"
  points:
  - <strong>Non-Nil by Default:</strong> <code>Weapon</code> cannot be nil; only <code>Weapon?</code>
    explicitly allows nil.
  - <strong>Flow-Sensitive Typing:</strong> Compiler automatically narrows <code>Weapon?</code>
    to <code>Weapon</code> inside <code>if weapon = ...</code>.
  - <strong>Automatic ObjectDB Verification:</strong> Lapis calls <code>#check_alive!</code>
    before every dispatch, guaranteeing memory safety.
takeaway:
  badge: ZERO RUNTIME CRASHES
  text: Crystal's static type system mathematically proves nil safety at compile time,
    eliminating null dereferences before launching.
notes: In GDScript, every developer has experienced the dreaded 'Invalid call to function
  on base Nil' crash, or worse, a hard engine crash when dereferencing an object that
  was freed in C++. In Crystal, Nil is a distinct type, and types are non-nil by default.
  If a node lookup might return nil, its type is Weapon | Nil. The Crystal compiler
  will literally refuse to compile your game until you prove to the type checker that
  you've handled the nil case.
