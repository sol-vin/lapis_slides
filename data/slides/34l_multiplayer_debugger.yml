  color: purple
  items:
  - <strong>Cooperative Lockstep Debugging:</strong> Hitting a breakpoint in server code pauses all connected client instances in synchronized lockstep—eliminating socket timeout drops during debugging.
  - <strong>Declarative Simulation Macro:</strong> The <code>multiplayer_test(name, clients = 2)</code> macro spins up a headless authoritative host and N client nodes in a single process.
  - <strong>Network Jitter & Loss Injection:</strong> Test harnesses dynamically simulate adverse network conditions (e.g. 45ms latency variance and 5% packet loss) to verify delta reconciliation.
  - <strong>Wireshark-Style Packet Capture:</strong> Automatically logs packet sequence numbers, payload lengths, channel IDs, and RPC transmission bytes for deterministic protocol triage.
notes: |
  Multiplayer game development is notoriously difficult to debug because setting a breakpoint usually triggers a network timeout disconnect. Lapis solves this through cooperative lockstep debugging: when the host hits an r2 breakpoint or in-editor gutter break, connected clients freeze in cooperative lockstep, preserving network state. Combined with our declarative multiplayer_test harness and packet capture logging, you can verify netcode, RPCs, and state replication with complete confidence.
