  code: |
    record ShieldAbsorbed, shield_remaining : Float32, mitigated : Float32
    record CriticalDamage, armor : Float32, final_damage : Float32

    node CombatResolver < Node do
      # Native mathematical union: zero wrappers, zero boxing
      alias HitResult = ShieldAbsorbed | CriticalDamage | Nil

      def resolve_hit(target : Node3D, raw_damage : Float32) : HitResult
        case target
        when ShieldDrone
          # Compiler automatically narrows target to ShieldDrone
          ShieldAbsorbed.new(target.shield_points, raw_damage * 0.5_f32)
        when PlayerCharacter
          CriticalDamage.new(target.armor_rating, raw_damage * 2.0_f32)
        else
          nil
        end
      end
    end
  points:
  - <strong>First-Class Mathematical Union Types:</strong> Types like <code>ShieldAbsorbed | CriticalDamage | Nil</code> are native language primitives with zero heap wrappers and zero boxing.
  - <strong>Compile-Time Exhaustive Pattern Matching:</strong> The Crystal compiler verifies that all possible union types are handled; omitting a variant triggers a compile-time build error.
  - <strong>Automatic Compiler Type Narrowing:</strong> Inside <code>when ShieldDrone</code>, the compiler automatically casts and narrows the variable type without unsafe downcasts or manual casts.
  - <strong>Value-Type Stack Records:</strong> Small data structures (<code>record</code>) are allocated directly on the stack with zero GC allocation.
takeaway:
