  card_title: C# Union & Casting Hazards
  code: |
    using Godot;
    using System;

    public partial class CombatResolver : Node
    {
        // C# lacks native union types; forces loose object returns
        public object ResolveHit(Node3D target, float rawDamage)
        {
            if (target is ShieldDrone drone)
            {
                // Unchecked runtime type checking and downcasting
                return new ShieldAbsorbed(drone.ShieldPoints, rawDamage * 0.5f);
            }
            else if (target is PlayerCharacter player)
            {
                return new CriticalDamage(player.ArmorRating, rawDamage * 2.0f);
            }

            // Non-exhaustive: unhandled types silently fail at runtime
            return null!;
        }
    }
  points:
  - <strong>Absence of Native Union Types:</strong> C# cannot natively express <code>ShieldAbsorbed | CriticalDamage | Nil</code>, forcing developers into loose <code>object</code> returns, wrapper hierarchies, or third-party libraries.
  - <strong>Non-Exhaustive Pattern Matching:</strong> C# switch expressions on general types do not enforce compile-time exhaustiveness; omitting a newly added type silently compiles and fails at runtime.
  - <strong>Runtime Type Check &amp; Downcast Tax:</strong> Evaluating <code>target is ShieldDrone drone</code> incurs runtime type inspection and pointer downcasting instructions on every evaluation.
  - <strong>Wrapper Object Allocation Overhead:</strong> Simulating discriminated unions via records or wrapper structs allocates intermediate objects and incurs boxing.
