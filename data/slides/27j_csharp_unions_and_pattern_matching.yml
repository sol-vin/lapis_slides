    public partial class CombatResolver : Node
    {
        // C# lacks native unions; forces loose object returns & runtime casts:
        public object ResolveHit(Node3D target, float rawDamage)
        {
            if (target is ShieldDrone drone)
                return new ShieldAbsorbed(drone.ShieldPoints, rawDamage * 0.5f);
            else if (target is PlayerCharacter player)
                return new CriticalDamage(player.ArmorRating, rawDamage * 2.0f);

            return null!; // Non-exhaustive: unhandled types fail silently!
        }
    }
  points:
    - '<strong>No Native Union Types:</strong> Cannot express <code>ShieldAbsorbed | CriticalDamage | Nil</code>, forcing loose <code>object</code> returns or wrapper classes.'
    - '<strong>Non-Exhaustive Matching:</strong> C# type switches do not guarantee compile-time exhaustiveness; unhandled cases fail silently at runtime.'
    - '<strong>Runtime Downcast Overhead:</strong> <code>target is ShieldDrone drone</code> incurs dynamic type checks and pointer downcasts on every frame.'
