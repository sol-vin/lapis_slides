  color: purple
  items:
  - <strong>Why Not Rust?</strong> Borrow-checker friction with cyclic SceneTree graphs, slower compile times, and heavy FFI boilerplate.
  - <strong>Why Not C++?</strong> Manual pointer management, header sprawl, no compile-time nil safety, and raw <code>0xC0000005</code> segfaults.
  - <strong>Why Not GDScript?</strong> Interpreted VM bottlenecks in heavy simulation loops (Crystal averages 46.2x faster, up to 140x+ in compute).
  - <strong>Why Not C#?</strong> 80 MB+ .NET runtime footprint, P/Invoke marshalling overhead, and verbose OOP ceremony.
  - <strong>The Crystal Sweet Spot:</strong> Native LLVM machine code, global type inference, and expressive Ruby-inspired syntax.
notes: |
  When evaluating language bindings for game engines, the immediate question is always: 'Why Crystal? Why not Rust, C++, C#, or just stick with GDScript?'
  Beyond tribal preferences, there is a profound engineering reality here. Rust's ownership model fights Godot's cyclic SceneTree graphs; C++ suffers from header sprawl and catastrophic segfaults; GDScript hits severe throughput bottlenecks in tight loops; and C# brings runtime overhead with GC frame spikes.
  Crystal provides the rare sweet spot: raw LLVM machine speed and static nil safety paired with the expressive, human-first ergonomics of Ruby.
