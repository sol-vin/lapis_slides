  items:
  - <strong>Crystal AST Demangling:</strong> Automatically translates mangled compiler symbols into clean Crystal method signatures (<code>Player#_physics_process:Float64</code>) for source-line breakpoints.
  - <strong>In-Memory String Layouts:</strong> Inspects runtime Crystal String structures at raw memory addresses (validating <code>type_id</code>, <code>bytesize</code>, <code>length</code>, and UTF-8 buffer bytes).
  - <strong>Array & Slice Header Decoding:</strong> Directly reads dynamic Array capacity vs size and Slice pointers to ensure zero unwanted heap allocations during tight physics and render loops.
  - <strong>Runtime Class Hierarchy:</strong> Discovers all compiled Crystal classes, methods, entrypoints, and Boehm GC allocator symbols directly from PE/ELF binaries without external symbol servers.
notes: |
  Lapis pairs with cradare2 to deliver first-class native reverse engineering and live debugging for the Crystal runtime. Developers can inspect Crystal classes, demangle method symbols for setting breakpoints, and examine the precise in-memory byte layout of Crystal Strings, Arrays, and Slices. This makes it trivial to verify zero-allocation gameplay invariants and diagnose subtle memory corruptions directly in the terminal.
