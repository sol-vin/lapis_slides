---
id: 39_dual_modes
title: 'Dual Modes: Mode A vs. Mode B'
subtitle: Seamless In-Editor GDExtension Development Paired with Lean Standalone Shipping
badge: ARCHITECTURE • DUAL EXECUTION MODES
badge_color: amber
palette: fos
layout: two-column-layout
ratio: 1:1
left:
  type: card
  title: 'Mode A: GDExtension In-Editor'
  color: cyan
  items:
  - <strong>Host Binary:</strong> Godot Engine executable (<code>godot.exe</code>).
  - <strong>Primary Binaries:</strong> <code>crystal_bridge.dll</code> + <code>game.dll</code>.
  - <strong>GC Bootstrapping:</strong> Initialized by C++ loader bridge (<code>GC_init()</code>).
  - <strong>Hot Reloading:</strong> Automatic timestamped shadow DLL loading on F5.
  - <strong>Primary Use Case:</strong> Rapid development, editor tool scripts, level
    design.
right:
  type: card
  title: 'Mode B: Standalone LibGodot Host'
  color: amber
  items:
  - <strong>Host Binary:</strong> Pure Crystal executable (<code>bin/game.exe</code>).
  - <strong>Primary Binaries:</strong> Crystal entry point dynamically loading <code>libgodot.dll</code>.
  - <strong>GC Bootstrapping:</strong> Initialized natively by the Crystal CRT at
    process launch.
  - <strong>Hot Reloading:</strong> Recompilation of standalone executable.
  - <strong>Primary Use Case:</strong> Production shipping, headless CI, embedded
    runners, minimum binary size.
notes: 'Lapis supports two distinct execution paradigms. During active development,
  you run in Mode A: Godot hosts the bridge as a GDExtension, giving you full in-editor
  tool execution, live inspector sync, and hot reloading. For production shipping,
  you switch to Mode B: a lean standalone Crystal executable that embeds LibGodot,
  boots instantly, and requires zero editor overhead.'
