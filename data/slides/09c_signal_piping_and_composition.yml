  points:
  - <strong>Forwarding Ceremony:</strong> Forwarding a signal from a child component to an outer system requires writing dummy intermediary handler methods.
  - <strong>Arity & Conversion Glue:</strong> Adapting a signal with extra arguments or mismatched numeric types requires allocating anonymous lambda wrappers.
  - <strong>Manual Polymorphic Filtering:</strong> Filtering collision events to specific types requires runtime <code>if body is Type:</code> inspection and manual re-emission.
  - <strong>Fragile Disconnection:</strong> Lambda connections are anonymous and cannot be cleanly disconnected without caching the <code>Callable</code> reference.
crystal:
  title: ':sparkles: Crystal: Strict (>) & Loose (>>) Signal Piping'
  lang: crystal
  tag: Crystal (Lapis)
  card_title: Lapis Reactive Signal Piping
  font_size: '0.74rem'
  code: |
    def _ready : Void
      # 1. Strict Pipe (>): Compile-time verified signature match
      player.level_up > hud.on_level_changed

      # 2. Loose Pipe (>>): Automatic arity trimming & numeric conversion
      # Drops priority (Int32), converts intensity Float64 -> Float32:
      player.action_performed >> hud.on_notify

      # 3. Loose Pipe (>>): Arity trimming to 0-arguments
      # Drops all 3 arguments and triggers event trigger:
      player.action_performed >> hud.on_any_action

      # 4. Loose Pipe (>>): Polymorphic type filtering & auto-downcasting
      # Silently ignores non-Enemy nodes; passes downcasted Enemy!
      area.body_entered >> self.enemy_detected

      # 5. Clean, explicit unpiping via subscription handle:
      sub = (player.tapped >> hud.on_any_action)
      sub.disconnect
    end
  points:
  - <strong>Strict Pipe (<code>&gt;</code>):</strong> <code>source &gt; target</code> establishes a direct compile-time verified signal pipeline with zero intermediate methods.
  - <strong>Loose Pipe (<code>&gt;&gt;</code>):</strong> Automatically trims unused trailing arguments and performs safe numeric conversions (e.g. <code>Float64</code> to <code>Float32</code>).
  - <strong>Polymorphic Type Filtering:</strong> <code>area.body_entered &gt;&gt; self.enemy_detected</code> silently ignores non-matching nodes and automatically downcasts matching instances.
  - <strong>First-Class Subscription Lifecycle:</strong> Returns a concrete <code>SignalSubscription</code> handle for clean, deterministic unpiping via <code>sub.disconnect</code> without managing raw strings.
takeaway:
  badge: REACTIVE ZEN
  text: Lapis signal piping operators (> and >>) eliminate boilerplate forwarding handlers, lambda wrappers, and manual type guards in favor of expressive reactive streams.
notes: |
  Signal forwarding and event composition are fundamental to decoupled game architecture. In GDScript, forwarding a signal requires writing single-use methods like '_on_player_level_up' or allocating anonymous lambdas. Adapting signals with different argument counts or filtering collision events to specific enemy classes requires repetitive 'if body is Enemy:' boilerplate.
  Lapis introduces first-class signal piping operators:
  Strict piping with '>' establishes a direct pipeline between two signals whose signatures match at compile time.
  Loose piping with '>>' provides incredible gameplay flexibility: it automatically trims trailing arguments (allowing a 3-argument signal to trigger a 2-argument or 0-argument signal), converts numeric types like Float64 to Float32, and performs polymorphic type filtering. For example, 'area.body_entered >> self.enemy_detected' silently filters out walls or players, passing only instances of Enemy to the receiver automatically downcast!
  Piping returns a standard SignalSubscription handle, making unpiping as simple as 'sub.disconnect'.
