  - <strong>GC Equilibrium Enforcement:</strong> Calls <code>GC.collect</code> before
    and after iterations to settle heap state.
  - '<strong>Strict Delta Verification:</strong> Mathematically proves that delta
    object count is strictly zero: <code>ΔObjects == 0</code>.'
  - <strong>Prevents Release Regressions:</strong> CI quality gates automatically
    fail if any PR introduces a memory leak.
notes: Memory leaks are fatal in long-running games. Lapis includes a dedicated testing
  apparatus with mathematical zero-leak verification. Using Lapis::Test.assert_no_leak,
  our test runner queries Godot's Performance singletons and forces GC equilibrium
  before and after running iterations, mathematically proving that zero objects or
  memory leaked.
