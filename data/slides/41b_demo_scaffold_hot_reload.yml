notes: |
  Let's jump into our live demo! In Part 1, we start in a completely clean environment.
  Running `lapis new game my_game` scaffolds a full, ready-to-run Godot 4.8 game project with Crystal bindings in milliseconds.
  It generates project.godot, sets up shard.yml with the required dependencies, pre-wires the GDExtension bridge manifest, and creates initial scenes and src/main.cr.
  There are zero tedious manual setup steps—the project is immediately ready to compile, edit, or launch.
