right:
  type: card
  title: Release Packaging Invariants
  color: purple
  items:
  - <strong>Strict Addon Isolation:</strong> Packaging strictly bundles <code>crystal_integration</code>; dummy test addons are NEVER shipped.
  - <strong>Automatic DLL Synchronization:</strong> Bundles required runtime DLLs: <code>gc.dll</code>, <code>iconv-2.dll</code>, <code>pcre2-8.dll</code>.
  - <strong>Dead-Code Stripping:</strong> Release binaries are compiled with <code>--release -O3</code> and stripped of debug symbols.
  - <strong>Cryptographic Checksums:</strong> Generates <code>SHA256SUMS.txt</code> automatically for all output archives.
notes: |
  Shipping games and addons shouldn't require tedious manual zip packaging. Lapis features a turnkey packaging system. A single command packages official GDExtension addons, Windows Inno Setup installers, Debian packages, and standalone playable games with automatic DLL dependency bundling and cryptographic checksums.
