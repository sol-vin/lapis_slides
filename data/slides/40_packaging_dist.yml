    - '<strong>Playable Game Bundles (<code>lapis package game</code>):</strong> Exports the Godot <code>.pck</code> and automatically stages <code>crystal_bridge.dll</code>, <code>gc.dll</code>, <code>iconv-2.dll</code>, and <code>pcre2-8.dll</code>.'
    - '<strong>Strict Addon Isolation (<code>lapis package addon</code>):</strong> Packages redistributable GDExtension addons (<code>crystal_integration</code>) while stripping test/dummy artifacts.'
