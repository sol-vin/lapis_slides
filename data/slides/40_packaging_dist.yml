    - '<strong>Cross-Platform Installers (<code>installer</code> / <code>deb</code>):</strong> Compiles with <code>--release -O3</code>, strips debug symbols, and builds Windows Inno Setup <code>.exe</code> and Linux <code>.deb</code> packages.'
