right:
  type: card
  title: Why It Beats GDScript & C# Serialization
  color: purple
  items:
  - <strong>Zero Runtime Reflection:</strong> Serialization code is synthesized by
    macros at compile time; no reflection API overhead.
  - <strong>Strict Schema Validation:</strong> Missing required fields or mismatched
    types raise clear parse errors rather than corrupting save state.
  - <strong>Built-in Format Support:</strong> First-class standard library support
    for JSON, YAML, and binary formats.
  - <strong>Engine Agnostic Data Structures:</strong> Save models exist as pure Crystal
    data structures independent of Godot node hierarchies.
notes: Save systems and network state serialization often suffer from runtime reflection
  overhead and fragile dictionary mapping in GDScript and C#. In Crystal, adding JSON::Serializable
  to a struct generates complete, high-speed serialization and deserialization code
  at compile time. It validates schemas strictly, serializes directly into buffers,
  and requires zero manual dictionary mapping.
