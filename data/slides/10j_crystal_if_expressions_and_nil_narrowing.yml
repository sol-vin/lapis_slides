  code: |
    # 1. 'if' and 'case' are first-class expressions returning values:
    speed = if boosted?
              play_sfx(:turbo)
              100
            else
              50
            end

    # 2. Ranges, Implicit '.method?' Calls & Type Dispatch:
    loot = case roll_or_boss
           when 95..100 then :legendary_sword        # Range (===)
           when .even?  then :silver_coin            # Calls subject.even?!
           when Boss    then roll_or_boss.drop_relic # Type dispatch!
           else              :rusty_dagger
           end

    # 3. Multi-Value Tuple Matching (Goodbye Nested Ifs):
    move = case {state, grounded?, stamina > 0}
           when {:dash, true, true}  then :ground_boost
           when {:dash, false, true} then :air_dash
           when {_, _, false}        then :exhausted
           else                           :idle
           end
