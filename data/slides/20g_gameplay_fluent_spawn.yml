right:
  type: card
  title: Direct Tree Mounting & Instantiation
  color: purple
  items:
    - '<strong>Direct Tree Instantiation:</strong> <code>add_child(NodeClass) do |n|</code> instantiates, configures, and mounts child nodes in a single call without separate <code>.new</code>.'
    - '<strong>Typed Scene Spawning:</strong> <code>add_child(scene, as: Bullet) do |b|</code> and <code>add_child(path, as: T)</code> unpack packed scenes directly into child hierarchies with typed downcasting.'
    - '<strong>Direct Sibling Mounting:</strong> <code>add_sibling(NodeClass) do |m|</code> mounts new nodes under the current node''s parent with configuration block and headless standalone fallback.'
    - '<strong>Class-Level Resource Loaders:</strong> <code>PackedScene.load(path)</code> and <code>Resource.load(path, as: T)</code> eliminate manual casting on loaded resources.'
    - '<strong>Verified Scene Operations:</strong> <code>change_scene!(path)</code>, <code>reload_scene!</code>, and <code>current_scene_as(T)</code> handle scene transitions with automatic thread-safety validation.'
notes: |
  Writing gameplay code shouldn't require repetitive three-step instantiation boilerplate (`new`, configure, `add_child`). In Lapis, we provide direct tree instantiation: `add_child(Sprite2D) do |s| ... end` creates the node, yields it for configuration, mounts it into the hierarchy, and returns the strongly-typed instance in a single expression.
  Furthermore, `add_child(scene, as: Bullet)` and `add_child(path, as: T)` unpack scenes directly into the tree with automatic downcasting. Sibling nodes mount effortlessly with `add_sibling(Marker2D)`. Paired with class-level resource loaders like `PackedScene.load(...)` and verified `change_scene!(...)`, Lapis makes scene tree construction completely frictionless.
