  title: Direct Tree Mounting & Instantiation
  color: purple
  items:
    - '<strong>Context Execution (<code>with .. yield</code>):</strong> Configuration blocks execute directly within the receiver''s scope—no dummy block arguments (<code>|node|</code>) required.'
    - '<strong>Scene Pipeline Operator (<code>&gt;</code>):</strong> <code>add_child(scene &gt; Enemy)</code> preloads, instantiates, and downcasts packed scenes in one line with inline configuration blocks.'
    - '<strong>Type-Preserving Returns:</strong> <code>Node#add_child(node : T) : T</code> preserves concrete static type instead of returning <code>Void</code>, enabling <code>enemy = add_child(...)</code>.'
    - '<strong>Direct Tree Instantiation:</strong> <code>add_child(Sprite2D) do ... end</code> instantiates, configures, and mounts child nodes in a single call without separate <code>.new</code>.'
    - '<strong>Sibling Pipeline Parity:</strong> <code>add_sibling(scene &gt; Marker2D)</code> mounts sibling nodes under the current node''s parent with configuration block and standalone fallback.'
    - '<strong>Fluent <code>#build</code> &amp; <code>#configure</code>:</strong> Chainable configuration blocks allow fluent property setup on any Godot engine object or custom node.'
notes: |
  Writing gameplay code shouldn't require repetitive three-step instantiation boilerplate (`new`, configure, `add_child`). In Lapis, we provide direct tree instantiation with Crystal's 'with .. yield' context execution: `add_child(Sprite2D) do ... end` creates the node, evaluates configuration directly in its context without needing block arguments like `|s|`, mounts it into the hierarchy, and returns the strongly-typed instance in a single expression.
  Furthermore, the Scene Pipeline operator `>` turns packed scene spawning into pure joy: `add_child("res://scenes/enemy.tscn" > Enemy)` instantiates, downcasts, mounts, and configures the child inline. Crucially, `add_child` preserves the child's static type `T` rather than returning `Void`, enabling direct assignment.
  Sibling nodes mount effortlessly with `add_sibling(scene > Marker2D)`, while any object can be customized with `Object#build` and `Object#configure`. Scene management is rounded out with `PackedScene.load(...)` and verified `change_scene!(...)`.
