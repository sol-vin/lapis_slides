  items:
    - '<strong>Opt-In Require:</strong> Add <code>require "lapis/extras"</code> to enable wildcard globbing and streaming query methods on scene nodes.'
    - '<strong>Wildcard &amp; Globstar Queries (<code>*</code>):</strong> <code>self * {"pattern", Type}</code> and <code>get_nodes</code> support single-level <code>*</code> and recursive globstars <code>**</code>, returning <code>Array(T)</code>.'
    - '<strong>Streaming Iteration:</strong> <code>each_node(pattern, Type)</code> traverses subtrees without allocating intermediate collections.'
    - '<strong>Fluent GroupQuery DSL:</strong> <code>group(:name)</code> provides chainable <code>.each(as: Type)</code>, <code>.to_a(as: Type)</code>, <code>.first</code>, <code>.first!</code>, and broadcast <code>.call</code>.'
    - '<strong>Receiver Scoping &amp; Block Shorthands:</strong> <code>each_node</code> yields via <code>with node yield node</code>, supporting receiver-scoped blocks (<code>do alert! end</code>) and proc shorthands (<code>&amp;.queue_free</code>).'
notes: |
  Finding and managing collections of nodes across complex scene trees has always been awkward in game engines. In GDScript, you either manually loop through get_children(), write recursive traversal helper functions, or rely on stringly-typed engine groups.
  With 'require "lapis/extras"', Lapis introduces an expressive scene tree query engine: First, intuitive shell-like patterns query immediate wildcards like 'self * {"Enemies/*/Hitbox", Area2D}' or recursive globstars like 'get_nodes("Spawns/**", Marker2D)'.
  Second, regex queries like 'self * /^FX_Spark_\d+$/' match dynamic nodes instantly.
  Third, our fluent 'group(:enemies)' DSL provides typed iteration with '.each(as: Enemy)', '.first(as: Boss)', and broadcast '.call'. For high-frequency loops, 'each_node' streams matching descendants directly through inlined blocks without allocating intermediate collections.
