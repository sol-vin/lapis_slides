gdscript:
  title: ':circle-xmark: GDScript: 10,000 Heap RefCounted Allocations & Pointer Chasing'
  lang: gdscript
  tag: GDScript
  font_size: '0.84rem'
  code: |
    class_name CombatEvent extends RefCounted:
        var damage: float; var element: int; var crit: bool
        func _init(d: float, e: int, c: bool):
            damage = d; element = e; crit = c

    # 10,000 separate heap mallocs + atomic refcount updates:
    var events: Array[CombatEvent] = []
    for e in enemies:
        events.append(CombatEvent.new(45.0, 1, true))

    # Cache disaster: Array of 10,000 pointers scattered in RAM
    for evt in events:
        apply_damage(evt.damage) # 10,000 pointer chases!
    events.clear() # Mass deallocation triggers GC stutter
  points:
    - '<strong>Heap Thrashing for Ephemeral Data:</strong> 10,000 events require 10,000 individual <code>malloc</code> calls and atomic refcount updates.'
    - '<strong>Pointer Chasing & Cache Misses:</strong> <code>Array[CombatEvent]</code> stores scattered 64-bit pointers, thrashing CPU L1/L2 caches.'
    - '<strong>Deallocation Frame Stutters:</strong> Bulk disposal of thousands of <code>RefCounted</code> instances causes GC micro-freezes.'
crystal:
  title: ':sparkles: Crystal: CPU Register Value Passing & Flat Contiguous Buffers'
  lang: crystal
  tag: Crystal (Lapis)
  font_size: '0.84rem'
  code: |
    struct CombatEvent
      getter damage : Float32, element : ElementType, critical : Bool
      def initialize(@damage, @element, @critical = false); end
    end

    # 1. Ephemeral event in CPU registers: 0 heap allocations!
    def apply_damage(event : CombatEvent) : Void
      @health -= event.critical? ? event.damage * 2.0_f32 : event.damage
    end

    # 2. 10,000 structs inlined into ONE flat 120 KB buffer:
    events = Array(CombatEvent).new(10_000)
    10_000.times { events << CombatEvent.new(45.0_f32, ElementType::Fire, true) }
    events.each { |evt| apply_damage(evt) } # Linear cache sweep!
  points:
    - '<strong>Zero-Heap Value Passing:</strong> Passing <code>CombatEvent</code> copies directly in CPU registers or on the stack with 0 heap bytes.'
    - '<strong>Contiguous Cache Line Saturation:</strong> <code>Array(CombatEvent)</code> embeds structs inline into a single 120 KB buffer.'
    - '<strong>Zero Pointer Dereferencing:</strong> Flat contiguous memory maximizes CPU cache line hits and unlocks LLVM auto-vectorization.'
takeaway:
  badge: SYSTEMS SPEED • CACHE LOCALITY
  text: Stack-allocated structs eliminate thousands of heap allocations per frame, delivering bare-metal C cache locality with elegant object syntax.
notes: |
  In fast-paced games—bullet hells, horde survivors, ARPG combat loops, and particle engines—allocating tiny gameplay data packets on the heap is a primary cause of framerate drops. In GDScript, custom data types must extend RefCounted. When you spawn 10,000 projectiles or process 10,000 combat events, Godot must perform 10,000 individual heap allocations and atomic refcount updates. An array of these objects is just an array of pointer addresses scattered randomly across memory, causing massive L1 cache miss penalties on every frame. When they die, mass deallocation causes micro-stutters.
  In Crystal, structs are first-class value types. Passing a CombatEvent to a method passes it directly in CPU registers or on the stack with zero heap allocations. Even better, an Array(CombatEvent) stores the 12-byte structs contiguously in a single flat memory block. 10,000 events take just 120 KB of contiguous RAM, maximizing CPU cache line efficiency and allowing LLVM to auto-vectorize loops with zero GC overhead.
