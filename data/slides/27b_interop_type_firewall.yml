    code: |
      func on_network_packet(pkt: Dictionary) -> void:
          # 1. Wrong primitive type (String vs int):
          player.heal("fifty_hp")
          # -> Blocked: Arg 1 (String) != int

          # 2. Wrong node class (Sprite2D vs Weapon):
          player.equip_weapon($MinimapIcon)
          # -> Blocked: Expected Weapon, got Sprite2D

          # 3. Invalid enum ordinal via dynamic set():
          player.set("stance", 999)
          # -> Ignored: Stance.from_value?(999) == nil

          # 4. Valid call crosses boundary cleanly:
          player.heal(50)
