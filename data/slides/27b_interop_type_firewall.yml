      enum Stance; Defensive; Aggressive; end

      node Player < CharacterBody3D do
        @[Export(enum: Stance)]
        property stance : Stance = Stance::Defensive

        @[Export(range: 0..500)]
        property health : Int32 = 100

        def heal(amount : Int32) : Int32
          # Guaranteed Int32 — never runs on String!
          @health = (@health + amount).clamp(0, 500)
        end

        def equip_weapon(weapon : Weapon) : Void
          # Guaranteed alive Weapon instance!
          @active_weapon = weapon
        end
      end
