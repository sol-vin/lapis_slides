  title: Zero-Loss Hot Reload Invariants
  color: amber
  items:
  - <strong>6-Phase Transactional Architecture:</strong> Pre-flight discovery, JSON quarantine serialization, shadow DLL swap, schema reconciliation, silent hydration, and verification.
  - <strong>Schema Drift Reconciliation:</strong> Coerces numeric widening (<code>Int</code> &rarr; <code>Float</code>), discards obsolete fields, and seeds defaults for newly added <code>@[Export]</code> properties without crashes.
  - <strong>Two-Pass Silent Hydration:</strong> Signals are temporarily blocked during property re-population, preventing spurious cascade triggers or audio glitches.
  - <strong>Lifecycle Hook (<code>_on_hot_reloaded</code>):</strong> Nodes implement <code>_on_hot_reloaded</code> to re-bind cached sub-objects or refresh procedural textures.
notes: |
  A major problem with C++ and GDExtension live reloading is that reloading the library usually resets all inspector values back to their defaults, or worse, crashes with dangling pointers to deleted vtables.
  Lapis 4.8-dev7 implements the StatePreserver: a 6-phase transactional reloading protocol. Before reloading, it recursively snapshots all active node properties into Engine metadata quarantine. After the new DLL is swapped in, it reconciles schema drift—handling added, deleted, or type-widened fields cleanly. It then silently hydrates values with signals blocked, and notifies nodes via '_on_hot_reloaded', preserving level designer edits perfectly across reloads.
