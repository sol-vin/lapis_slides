  items:
  - <strong>Mode 1 Fault Boundary Isolation:</strong> <code>lapis supervisor diagnose</code> classifies crash instruction pointers across 6 architectural boundaries (GameCode, Plugin, Bridge, Core, BoehmGC, CRT).
  - <strong>Dead-Pointer Register Scanner:</strong> <code>lapis dead-pointers</code> validates monotonic instance IDs in registers (<code>RCX</code>, <code>RDX</code>, <code>RDI</code>), immediately detecting dereferences of freed nodes.
  - <strong>Stale VTable Verification:</strong> <code>lapis stale-vtables</code> audits loaded objects to ensure no VTable pointers target unmapped previous shadow DLLs after dynamic hot reloading.
  - <strong>Static DSL Source Indexer:</strong> <code>lapis map</code> scans Crystal source files for <code>node</code>, <code>property</code>, and <code>signal</code> definitions, injecting typed symbols and comments into radare2 flags.
notes: |
  Lapis Mode 1 Supervisor and forensics tools solve the hardest problems in native game engine development. When a segfault occurs, the supervisor immediately pinpoints the architectural layer responsible—distinguishing game logic bugs from engine or bridge faults. Meanwhile, dead-pointer scanning catches freed Godot nodes and stale-vtable verification helps ensure clean hot reload cycles.
