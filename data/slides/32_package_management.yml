right:
  type: card
  title: Dual-Mode Packaging Invariants
  color: purple
  items:
  - <strong>Dual-Mode Installation:</strong> <code>lapis addon install</code> manages GDExtension plugins, while <code>lapis install shard</code> manages Crystal library dependencies with semantic version matching.
  - <strong>Automatic 2-Way Binding (<code>--bind</code>):</strong> When installing an addon, <code>--bind</code> automatically scans its custom nodes and generates typed Crystal wrapper classes.
  - <strong>Automated Shard Healing (<code>shard.override.yml</code>):</strong> Automatically writes and maintains override manifests to resolve ambiguous dependency sources and local paths without editing git-tracked files.
  - <strong>Poison Protection & DLL Staging:</strong> Automatically stages required C-runtime DLLs (<code>gc.dll</code>, <code>bridge.dll</code>) and purges illegal host <code>libgodot.dll</code> copies to prevent fatal ClassDB crashes.
notes: |
  Distributing compiled native addons in Godot is notoriously error-prone: addons require runtime DLLs like Boehm GC and the C++ bridge that standard Godot doesn't manage. Lapis provides complete dual-mode package management. With lapis addon install --shard --bind, Lapis stages precompiled GDExtension binaries, auto-enables the plugin in project.godot, links it into shard.yml, and generates typed Crystal wrappers for its custom nodes in one seamless step. If version conflicts arise across multiple addons, Lapis auto-heals dependencies using shard.override.yml to maintain deterministic builds.
