  points:
  - <strong>Web/WASM Export Lockout:</strong> Godot 4 C# cannot export games to the Web (HTML5/WASM) without unsupported experimental workarounds, locking developers out of game jams and browser gaming.
  - <strong>AssemblyLoadContext Zombie Leaks:</strong> Hot-reloading scripts in the Godot editor relies on .NET ALC; lingering static events or threads pin assemblies in RAM forever, forcing constant editor restarts.
  - <strong>Massive Runtime Payload:</strong> Distributing a Godot C# game requires packaging 60MB+ of .NET CLR virtual machine binaries, managed DLLs, and JIT/GC support libraries.
  - <strong>Double-Build Toolchain Tax:</strong> Running a C# project requires installing a matching .NET SDK, maintaining <code>.csproj</code>/<code>.sln</code> XML files, and waiting for MSBuild on every play press.
