  code: |
    using Godot;
    using System;

    public partial class AudioManager : Node
    {
        // Static event retains AssemblyLoadContext in RAM
        public static event Action? OnSoundEffectPlayed;

        public override void _Ready()
        {
            // Unreleased listener pins assembly as a 'zombie' ALC
            OnSoundEffectPlayed += HandleSound;
        }

        private void HandleSound() => GD.Print("Playing SFX");
    }
  points:
  - <strong>AssemblyLoadContext Zombie Leaks:</strong> Hot-reloading in the editor relies on .NET ALC; lingering static events or threads pin assemblies in RAM, breaking debugger breakpoints and causing editor instability.
  - <strong>Platform Overhead &amp; Lockout:</strong> Godot 4 C# lacks seamless out-of-the-box Web export and incurs heavy runtime overhead on mobile, requiring complex Ahead-Of-Time (AOT) toolchain workarounds.
  - <strong>Massive Runtime Payload:</strong> Shipping a C# game requires packaging 60MB+ of .NET CLR virtual machine binaries, managed assemblies, and JIT/GC runtime dependencies.
  - <strong>Double-Build Toolchain Tax:</strong> Developing in C# requires managing external .NET SDKs, <code>.csproj</code> XML configurations, and waiting for MSBuild on every editor play press.
