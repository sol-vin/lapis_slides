  code: |
    public partial class WaveSpawner : Node3D, ISerializationListener
    {
        [Export] public int WaveIndex { get; set; } = 1;
        private List<int> _spawnedIds = new(); // Wiped on ALC reload!

        // 1. Must manually stash state before MSBuild unloads ALC:
        public void OnBeforeSerialize()
        {
            GameBus.WaveTick -= OnTick; // Forget this -> Zombie ALC!
            SetMeta("_ids", new Godot.Collections.Array(_spawnedIds));
        }

        // 2. Must manually unpack Variant collections after reload:
        public void OnAfterDeserialize()
        {
            GameBus.WaveTick += OnTick;
        }
    }
  points:
  - <strong>Manual <code>ISerializationListener</code>:</strong> Non-exported state is wiped on assembly reload unless manually marshalled in <code>OnBeforeSerialize</code>.
  - <strong>Zombie <code>AssemblyLoadContext</code> Leaks:</strong> One lingering static event or timer prevents the old .NET assembly from unloading in RAM.
  - <strong>60 MB+ CLR Runtime Payload:</strong> Shipping a C# build bundles the .NET virtual machine, managed BCL assemblies, and JIT/GC runtime.
  - <strong>External MSBuild Tax:</strong> Requires external .NET SDKs, <code>.csproj</code> files, and Roslyn source generators on every build.
