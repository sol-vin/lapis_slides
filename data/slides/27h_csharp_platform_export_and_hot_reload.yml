  code: |
    using Godot;
    using System;

    public partial class AudioManager : Node
    {
        // Static event retains AssemblyLoadContext in RAM
        public static event Action? OnSoundEffectPlayed;

        public override void _Ready()
        {
            // Unreleased listener pins assembly as a 'zombie' ALC
            OnSoundEffectPlayed += HandleSound;
        }

        private void HandleSound() => GD.Print("Playing SFX");
    }
  points:
  - <strong>AssemblyLoadContext Leaks:</strong> Lingering static events or threads pin .NET assemblies in RAM during hot-reload, breaking breakpoints.
  - <strong>Web &amp; Mobile Friction:</strong> Godot 4 C# lacks out-of-the-box Web export and requires heavy NativeAOT workarounds on mobile.
  - <strong>60 MB+ Runtime Payload:</strong> Shipping a C# build bundles the .NET CLR virtual machine, managed assemblies, and JIT/GC runtime.
  - <strong>Double-Build Tax:</strong> Requires external .NET SDKs, <code>.csproj</code> XML files, and MSBuild compilation on every editor play press.
