right:
  type: card
  title: Triaging Critical Failure Boundaries
  color: amber
  items:
  - <strong>Crystal Source Code Mapping:</strong> <code>lapis decompile --source</code> reads DWARF symbols to display exact Crystal source file lines and interleaved disassembly (<code>pdls</code>).
  - <strong>Side-by-Side Decompilation:</strong> <code>lapis decompile --side-by-side</code> renders an interactive split view comparing raw machine disassembly and structured pseudo-C.
  - <strong>Crystal Runtime Inspection:</strong> <code>lapis decompile --crystal</code> discovers all compiled Crystal classes, methods, entrypoints, and Boehm GC allocator symbols.
  - <strong>Native Editor Debugging (<code>lapis editor -d</code>):</strong> Attaches radare2 directly to the running engine with dual log redirection (<code>editor.log</code> vs <code>editor-crystal.log</code>).
  - <strong>Automated Boundary Forensics:</strong> Intercepts hardware exceptions (<code>0xC0000005</code>), classifies boundary fault (GameCode vs Bridge), and dumps full thread backtraces.
notes: |
  Lapis provides deep native binary inspection and debugging directly from the terminal. Developers can map compiled functions back to original Crystal source code lines using lapis decompile --source, inspect runtime classes and Boehm GC symbols with --crystal, or decompile methods into side-by-side assembly and pseudo-C using --side-by-side. When debugging complex physics or editor tool interactions, lapis editor -d launches Godot under radare2 with isolated dual-channel logging. If an unexpected memory access occurs, automated forensics inspects the 64-bit ObjectDB instance ID and verifies boundary integrity across game code, plugins, and the GDExtension bridge.
