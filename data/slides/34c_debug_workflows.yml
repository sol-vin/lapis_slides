right:
  type: card
  title: Triaging 3 Critical Failure Boundaries
  color: amber
  items:
  - <strong>Side-by-Side Decompilation:</strong> <code>lapis decompile --side-by-side</code> renders an interactive split view comparing raw machine disassembly and structured pseudo-C.
  - <strong>Native Editor Debugging (<code>lapis editor -d</code>):</strong> Attaches radare2 directly to the running engine with dual log redirection (<code>editor.log</code> vs <code>editor-crystal.log</code>).
  - <strong>ABI & Boundary Forensics:</strong> <code>lapis decompile --verify</code> audits entrypoints, DEP/ASLR hardening, and 64-bit ObjectDB instance IDs without external tooling.
  - <strong>Zero External Debugger Bloat:</strong> Eliminates multi-gigabyte LLDB/Python stacks in favor of high-performance native disassembly.
notes: |
  Lapis provides deep native binary inspection and debugging directly from the terminal. Developers can decompile any Crystal method into side-by-side assembly and structured pseudo-C using lapis decompile --side-by-side. When debugging complex physics or editor tool interactions, lapis editor -d launches Godot under radare2 with isolated dual-channel logging. If an unexpected memory access occurs, automated forensics inspects the 64-bit ObjectDB instance ID and verifies boundary integrity across game code, plugins, and the GDExtension bridge.
