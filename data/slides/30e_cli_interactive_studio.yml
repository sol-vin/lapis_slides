  items:
  - <strong>3D TrueColor Palette Studio (<code>lapis color --3d</code>):</strong> Interactive 3D spatial color picker rendering rotating RGB cubes, spheres, circles, and squares in 24-bit ANSI terminal color.
  - <strong>Interactive Project Explorer (<code>lapis explore</code>):</strong> Full-keyboard terminal file browser with arrow-key navigation, type icons, metadata inspection, and instant selection.
  - <strong>Text Shader FX Playground (<code>lapis shaders</code>):</strong> Real-time CRT scanlines, phosphor glow, curvature warp, and matrix digital rain rendered directly into the terminal buffer with zero GC allocation.
  - <strong>Interactive Docs Browser (<code>lapis docs tui</code>):</strong> Full-screen split-pane TUI search and guide browser for rapid offline API lookups during gameplay coding.
notes: |
  Lapis integrates deeply with Opal to bring graphical workstation ergonomics into the terminal. With lapis color --3d, developers can interactively rotate a 3D color cube to select precise TrueColor palettes without opening an external graphics suite. lapis explore provides an instant terminal file dialog with fuzzy filtering, while lapis shaders turns the console into a real-time text FX playground with CRT scanline simulation. Coupled with lapis docs tui, you have a complete developer command center right inside your shell.
