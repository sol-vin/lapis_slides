  items:
  - <strong>Interactive Project Explorer (<code>lapis explore</code>):</strong> Full-keyboard terminal file browser with arrow-key navigation, type icons, metadata inspection, and instant selection.
  - <strong>Action Driver REPL (<code>lapis driver repl</code>):</strong> Live interactive terminal automation shell driving live Godot editor controls, DOM inspection, and AI vision captures.
  - <strong>Double-Buffered Terminal Hub (<code>lapis cli</code>):</strong> Central full-screen command dashboard with quick keys (<code>[A]</code> Driver, <code>[B]</code> Package, <code>[L]</code> Logs), floating fuzzy palette (<code>~</code>), and live telemetry.
  - <strong>Built-In VCR Recording (<code>Ctrl+R</code> / <code>Ctrl+S</code>):</strong> Capture high-fidelity ANSI terminal screencasts (<code>.cast</code>) and instant syntax-colored HTML/ANSI screenshots with zero external dependencies.
notes: |
  Lapis integrates deeply with Opal to bring graphical workstation ergonomics directly into the terminal. With lapis explore, developers get an instant interactive file dialog with fuzzy filtering and keyboard navigation. With lapis driver repl, you have an interactive automation REPL that dispatches synthetic input into the live running Godot editor. And with the unified lapis cli hub, developers can navigate all tools, trigger VCR screencasts with Ctrl+R, and capture clipboard screenshots with Ctrl+S—a complete developer command center right inside your shell.
