title: 'Concurrency: Mutex Deadlocks vs. CSP Actor Channels'
subtitle: Manual Locking & SceneTree Hazards vs. Background Workers & Non-Blocking Drain
badge: GDSCRIPT ANTI-PATTERN VS. CRYSTAL CLEAN SOLUTION
badge_color: cyan
