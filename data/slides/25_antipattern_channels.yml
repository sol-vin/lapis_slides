layout: code-comparison-layout
gdscript:
  title: ':circle-xmark: GDScript: Mutex Locking & SceneTree Hazard'
  lang: gdscript
  tag: GDScript
  code: |
    var thread: Thread
    var mutex: Mutex
    func _ready():
        thread = Thread.new(); mutex = Mutex.new()
        thread.start(_worker_task)

    func _worker_task():
        var data = generate_terrain()
        mutex.lock()
        # DANGER: Modifying SceneTree off main thread corrupts memory!
        get_parent().add_child(data)
        # CRASH: Native C++ child array corruption
        mutex.unlock()
  points:
  - <strong>Manual Mutex Locking:</strong> Prone to race conditions, priority inversions, and hard deadlocks.
  - <strong>Fatal SceneTree Corruption:</strong> Modifying nodes from background threads corrupts Godot's child arrays.
  - <strong>No Typed Communication Queue:</strong> Lacks clean cross-thread actor queues.
crystal:
  title: ':sparkles: Crystal: Buffered Actor Channels'
  lang: crystal
  tag: Crystal (Lapis)
  code: |
    # Background worker thread with typed, buffered Actor Channel
    @channel = Channel(TerrainMesh).new(capacity: 32)
    Thread.new do
      mesh = generate_terrain_mesh
      @channel.send(mesh) # Lock-free thread-safe channel dispatch
    end

    def _process(delta : Float64) : Void
      # Non-blocking select drain on the main thread:
      loop do
        select
        when mesh = @channel.receive
          add_child(mesh) # 100% SceneTree thread-safe!
        else
          break # Channel empty, continue frame loop
        end
      end
    end
  points:
  - <strong>Lock-Free Actor Model:</strong> Typed <code>Channel(T)</code> eliminates manual mutexes and lock contention.
  - <strong>Non-Blocking Frame Drain:</strong> Main thread drains channel via <code>select ... else break</code>, ensuring 100% SceneTree safety.
  - <strong>Architectural Safety:</strong> Heavy compute stays strictly isolated from the rendering loop.
takeaway:
  badge: ACTOR PATTERN CONCURRENCY
  text: Crystal's actor channels give you parallel multi-core performance without mutexes or SceneTree corruption.
notes: |
  In GDScript, concurrent programming is fraught with peril. Developers use Mutex objects, and if a background thread accidentally touches a node in the SceneTree, Godot's internal child arrays corrupt, causing an immediate engine crash. In Crystal, we leverage the Actor pattern using Channel(T). Background worker threads crunch heavy procedural calculations and send immutable data structures through a buffered channel. On the main thread, _process non-blockingly drains the channel using a select block and safely mounts nodes to the scene tree. Zero mutexes, zero deadlocks, zero crashes.
