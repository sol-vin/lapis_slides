  title: Multimodal AI & Remote Control Invariants
  color: purple
  items:
  - <strong>Set-of-Marks AI Vision:</strong> <code>driver.capture_ai_manifest</code> extracts individual interactive controls into isolated PNG crops and generates <code>ui_manifest.json</code> with exact pixel bounding boxes.
  - <strong>Multimodal LLM Grounding:</strong> AI agents can inspect visual UI manifests to locate buttons, evaluate UI layout bugs, and plan interaction sequences.
  - <strong>Embedded TCP IPC Server:</strong> <code>Lapis::Editor::DriverServer</code> listens on localhost port <code>9095</code>, exposing remote JSON-RPC endpoints (<code>click</code>, <code>type</code>, <code>vision</code>, <code>dom</code>).
  - <strong>Interactive CLI REPL:</strong> <code>lapis driver repl</code> provides an interactive terminal shell to drive the live running Godot editor in real time.
  - <strong>Opal TUI Dashboard:</strong> Dedicated interactive terminal interface in Lapis Hub (<code>[A] Action Driver Controller</code>) with split-screen DOM explorer and live log traces.
notes: |
  Beyond traditional spec testing, Lapis 4.8-dev7 enables external automation and AI agent control of the Godot Editor. The ActionDriver includes an embedded TCP server listening on port 9095, letting you control the editor via 'lapis driver' or an interactive terminal REPL.
  Even more groundbreaking is our AI Vision subsystem: running 'lapis driver vision' generates a Set-of-Marks visual manifest. It captures a viewport screenshot, crops every interactive widget into an isolated PNG, and writes a structured 'ui_manifest.json' with exact bounding box coordinates and control classes. Multimodal AI agents can read this manifest, perceive the editor state visually, and execute automated workflows with zero human intervention.
