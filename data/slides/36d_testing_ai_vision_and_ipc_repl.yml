  color: emerald
  items:
  - <strong>Headless Engine Execution:</strong> Runs full Crystal specs and SceneTree integration tests in headless mode without requiring a GPU display server.
  - <strong>Deterministic Quality Gates:</strong> Fails CI builds immediately on uncaught exceptions, assertion failures, or ObjectDB instance leaks.
  - <strong>Multi-Platform Matrix:</strong> Compiles and tests natively across Windows, Linux, and macOS runners using standard CLI commands.
  - <strong>Fast Feedback Loop:</strong> Ahead-of-time compilation and in-memory test execution complete entire test suites in seconds.
  - <strong>Structured Test Artifacts:</strong> Generates JUnit XML, markdown reports, and binary size breakdowns directly for CI artifact archiving.
notes: |
  Testing in game development is often neglected in CI/CD pipelines due to heavy engine dependencies and lack of headless execution support. Lapis integrates headless testing directly into the standard CLI workflow via lapis test --headless. The runner boots Godot in headless mode, executes all Crystal specs, checks for ObjectDB memory leaks, and outputs structured test results. This allows teams to enforce strict quality gates in GitHub Actions or GitLab CI, catching regressions, memory leaks, and compilation errors automatically on every pull request.
