  items:
  - <strong>API Generator:</strong> <code>lapis api generate</code> parses <code>extension_api.json</code>
    and synthesizes 800+ typed Crystal classes.
  - <strong>Packaging Pipelines:</strong> Automated bundling of dependencies, DLLs,
    and stripped release binaries.
  - '<strong>Diagnostic Doctor:</strong> <code>lapis doctor</code> checks environment
    prerequisites: Crystal, LLDB, Godot, and Git.'
  - <strong>Multi-Addon Scaffolding:</strong> Easily scaffold isolated plugins that
    can be shared across the community.
notes: Beyond daily development, the Lapis CLI automates maintenance tasks. lapis
  api generate dumps Godot's GDExtension API JSON and regenerates all typed bindings
  in seconds. lapis package bundles complete standalone games or redistributable zip
  archives, and lapis doctor verifies that your compiler and debugger prerequisites
  are properly configured.
