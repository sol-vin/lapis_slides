right:
  type: card
  title: Automation & Maintenance Invariants
  color: amber
  items:
  - <strong>API Generator (<code>lapis bind</code>):</strong> Extracts Godot's <code>extension_api.json</code> and synthesizes 824 typed Crystal classes and 1,418 enums in 1.18 seconds with zero runtime reflection.
  - <strong>Side-by-Side Decompiler:</strong> <code>lapis decompile --side-by-side</code> renders an interactive split view comparing raw machine disassembly (<code>pdf</code>) and structured pseudo-C (<code>pdc</code>).
  - <strong>GDExtension ABI Verification:</strong> <code>lapis decompile --verify</code> audits entrypoints, DEP/ASLR hardening, and 64-bit ObjectDB memory boundaries without external tooling.
  - <strong>Full-Stack Toolchain Maintenance:</strong> Replaces disparate debugging scripts and reflection generators with a single cohesive CLI workflow.
notes: |
  Lapis elevates developer maintenance into a first-class experience. With lapis bind engine --dump, the CLI extracts Godot's extension_api.json, parses all 824 classes and 1,418 enums, and synthesizes complete, type-safe Crystal wrappers in 1.18 seconds using direct ptrcalls. Developers can decompile any Crystal method into side-by-side assembly and structured pseudo-C using lapis decompile --side-by-side, or audit GDExtension ABI entrypoints and memory boundaries with lapis decompile --verify.
