right:
  type: card
  title: Two-Way Automation Invariants
  color: amber
  items:
  - <strong>Engine API Generator (<code>lapis bind engine</code>):</strong> Extracts Godot's <code>extension_api.json</code> and synthesizes 824 typed Crystal classes and 1,418 enums in 1.18s with direct ptrcalls.
  - <strong>Project Node Generator (<code>lapis bind project</code>):</strong> Inspects custom GDScript <code>class_name</code> nodes in your project and generates strongly typed Crystal wrappers automatically.
  - <strong>Side-by-Side Decompiler (<code>lapis decompile</code>):</strong> Renders split views comparing raw machine disassembly (<code>pdf</code>) and structured pseudo-C (<code>pdc</code>) with Crystal source line mapping.
  - <strong>GDExtension ABI Verification:</strong> <code>lapis decompile --verify</code> audits entrypoints, DEP/ASLR hardening, and 64-bit ObjectDB memory boundaries without external tooling.
notes: |
  Lapis provides full two-way code generation between Godot and Crystal. With lapis bind engine --dump, the CLI extracts Godot's extension_api.json and synthesizes complete, type-safe Crystal wrappers for all 824 engine classes. Even more powerfully, lapis bind project scans your Godot project for custom GDScript nodes using class_name and generates typed Crystal wrapper classes—allowing Crystal code to seamlessly invoke custom GDScript gameplay systems with full compile-time autocomplete and zero stringly-typed dispatch.
