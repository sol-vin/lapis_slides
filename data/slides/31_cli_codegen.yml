right:
  type: card
  title: Automation & Maintenance
  color: amber
  items:
  - <strong>CLI Decompiler:</strong> <code>lapis decompile</code> decompiles methods to pseudo-C (<code>pdc</code>) and side-by-side assembly (<code>pdca</code>) with zero external servers.
  - <strong>Diagnostic Doctor:</strong> <code>lapis doctor</code> checks environment prerequisites: Crystal, radare2 (r2), Godot, and Git.
  - <strong>API Generator:</strong> <code>lapis api generate</code> parses <code>extension_api.json</code> and synthesizes 800+ typed Crystal classes in seconds.
  - <strong>Packaging Pipelines:</strong> <code>lapis package</code> automates bundling of runtime DLLs, manifests, and stripped release binaries.
notes: |
  Beyond daily development, the Lapis CLI automates systems maintenance and diagnostics. lapis decompile gives developers instant, offline pseudo-C decompilation directly in the terminal using radare2. lapis doctor audits your local toolchain—verifying Crystal, radare2, Godot, and Git configurations. And lapis package automates turnkey distribution of standalone production games and redistributable GDExtension addons.
