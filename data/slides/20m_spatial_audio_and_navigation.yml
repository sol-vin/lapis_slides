  items:
    - '<strong>Context-Aware <code>play_sound</code> Macro:</strong> Automatically selects 2D, 3D, or non-spatial audio players based on caller type.'
    - '<strong>Root-Mounted Audio Lifecycle:</strong> Players attach to scene root, so one-shot sounds never cut off when emitters die.'
    - '<strong>Relative Spatial Queries:</strong> <code>distance_to</code>, <code>direction_to</code>, and <code>angle_to_point</code> work directly between nodes.'
