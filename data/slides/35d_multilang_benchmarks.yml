    - '<strong>Native Clustering (45x–150x vs GDScript):</strong> Compiled targets (Crystal, C++, Rust, C#) cluster tightly between 3.8ms and 42.9ms, outperforming interpreted GDScript bytecode by two orders of magnitude.'
    - '<strong>Crystal vs C++ Parity:</strong> LLVM Ahead-of-Time compilation places Crystal within <strong>1.0x–1.2x of optimized C++ (-O3)</strong>, and Crystal actually <strong>beats C++ by 27% on Prime Sieve</strong> (27.2ms vs 37.4ms) due to aggressive inlining.'
