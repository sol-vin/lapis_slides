right:
  type: card
  title: Interactive Docs Invariants
  color: purple
  items:
  - <strong>Multi-Context CLI Lookups:</strong> Immediate terminal signatures for Godot ClassDB (<code>gd</code>), Crystal project nodes (<code>crystal</code>), architectural guides (<code>guide</code>), and Crystal stdlib (<code>stdlib</code>).
  - <strong>Rapid Full-Text Indexing:</strong> <code>lapis docs search &lt;term&gt;</code> indexes across thousands of API endpoints, methods, and markdown guides in milliseconds without launching a browser.
  - <strong>Double-Buffered Split-Pane TUI:</strong> <code>lapis docs tui</code> launches an Opal terminal reader featuring live symbol filtering, syntax-highlighted code blocks, and docstring scrolling (<code>PgUp</code>/<code>PgDn</code>).
  - <strong>Context Switching & Fuzzy Filters:</strong> Jump instantly between documentation realms with numeric hotkeys (<code>1-5</code>) or initiate in-TUI regex searches with <code>/</code>.
notes: |
  The Lapis documentation workflow is designed for developers who never want to break concentration by context-switching into an external web browser. Running lapis docs lookup gives instant signatures and inheritance trees directly in your shell. For deeper investigations, lapis docs tui opens a full-screen, double-buffered terminal documentation browser with live fuzzy search, numeric context filtering (Godot, Crystal, Guides, Stdlib), and smooth page-up/down scrolling over rich architectural explanations and code snippets.
