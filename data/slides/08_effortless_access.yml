  code: "# 1. Strongly typed child retrieval with onready macro\r\nonready weapon
    : Weapon = get_node_as(Weapon, \"WeaponMount/Sword\")\r\n\n# 2. Safe navigation
    with optional nodes (returns T?)\r\nif hud = get_node_as?(HUD, \"UI/HUDLayer\")\r\n
    \ hud.update_health(current_health)\r\nend\r\n\n# 3. Scene-unique nodes (%UniqueName)
    & recursive search\r\nhealth_bar = get_unique_node_as(ProgressBar, \"%HealthBar\")\r\nshield
    = find_child_as(Shield, \"EquippedShield\")\r\n\n# 4. Typed scene loading & dynamic
    instantiation\r\npacked = Godot.load_as(Godot::PackedScene, \"res://scenes/companion.tscn\")\r\ncompanion
    = packed.instantiate_as(Companion)\r\nadd_child(companion)\r\n\n# 5. Declarative
    property exports with inspector hints\r\n@[ExportRange(50.0..500.0, 10.0)]\r\nproperty
    move_speed : Float32 = 250.0_f32"
right:
  type: card
  title: Why It's Effortless
  color: cyan
  items:
  - '<strong>Declarative onready Macro:</strong> <code>onready weapon : Weapon = get_node_as(...)</code>
    resolves and binds nodes safely during <code>_ready</code>.'
  - <strong>Zero Casting Boilerplate:</strong> <code>get_node_as(T, path)</code> and
    <code>get_unique_node_as(T, "%Name")</code> return <code>T</code> directly — no
    ugly <code>as(T)</code> casts.
  - <strong>Compile-Time Nil Safety:</strong> <code>get_node_as?(T, path)</code> returns
    <code>T?</code>; Crystal's compiler forces flow-sensitive nil checks before method
    dispatch.
  - <strong>Typed Scene Instantiation:</strong> <code>Godot.load_as(PackedScene, path)</code>
    combined with <code>scene.instantiate_as(T)</code> constructs typed scene trees
    with zero reflection.
  - <strong>Declarative Export Hints:</strong> <code>@[ExportRange]</code> publishes
    Crystal properties directly into Godot's Inspector with editor UI hints.
notes: 'In many game frameworks, accessing nodes and properties is fraught with friction:
  manual casting boilerplate, runtime null panics, and brittle string lookups. In
  Lapis, accessing scene elements is effortless and strongly typed. With our onready
  macro and get_node_as, child nodes are resolved safely when the node enters the
  tree during _ready, returning the concrete typed class directly without casting.
  With get_node_as?, Crystal''s compiler enforces flow-sensitive nil checks, making
  null pointer dereference crashes impossible.'
